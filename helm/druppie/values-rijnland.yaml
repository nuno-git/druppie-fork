# Druppie Platform - Helm Values Override: rijnland.dev RKE2 cluster
# ==================================================================
#
# This file targets the remote RKE2 cluster at rijnland.dev. It layers on top of
# the base values.yaml and ONLY overrides what differs from the defaults:
#   - Traefik ingress (RKE2 ships Traefik, not nginx)
#   - Longhorn distributed storage for persistence
#   - No CNPG / KEDA / cert-manager operators installed on this cluster
#     (StatefulSet Postgres + manually-provisioned TLS secrets are used instead)
#   - In-cluster registry at druppie-registry.rijnland.dev/druppie
#
# All MCP modules stay at their base default (enabled: true) — do not list them here.
#
# IMPORTANT — domain MUST stay a single label under rijnland.dev (i.e.
# "druppie.rijnland.dev", never "foo.druppie.rijnland.dev"). The cluster wildcard
# TLS cert is *.rijnland.dev, which only matches single-label hosts.
#
# Prerequisite secret (must already exist in the druppie namespace):
#   - druppie-tls : kubernetes.io/tls secret holding a copy of the cluster
#                   *.rijnland.dev wildcard certificate + key.
#
# Usage:
#   helm upgrade --install druppie ./helm/druppie -n druppie \
#     -f helm/druppie/values.yaml \
#     -f helm/druppie/values-rijnland.yaml

global:
  imageRegistry: druppie-registry.rijnland.dev/druppie
  domain: druppie.rijnland.dev
  ingress:
    enabled: true
    className: traefik
    tls:
      enabled: true
      secretName: druppie-tls

persistence:
  storageClass: longhorn-distributed

nfs:
  enabled: false

cnpg:
  enabled: false

keda:
  enabled: false

certManager:
  enabled: false

sandbox:
  image: busybox:latest

init:
  enabled: true
