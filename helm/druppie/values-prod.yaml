# Production values for Druppie Helm chart
# Use: helm upgrade druppie helm/druppie/ -f helm/druppie/values-prod.yaml

global:
  domain: druppie.example.com
  ingress:
    className: traefik
    tls:
      enabled: true
      secretName: druppie-tls

backend:
  replicaCount: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "2000m"

frontend:
  replicaCount: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

keycloak:
  replicaCount: 1
  resources:
    requests:
      memory: "384Mi"
      cpu: "250m"
    limits:
      memory: "768Mi"
      cpu: "1000m"

gitea:
  replicaCount: 1

modules:
  coding:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "1000m"
  docker:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "1000m"

autoscaling:
  backend:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  frontend:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# CloudNativePG — HA PostgreSQL clusters
cnpg:
  enabled: true
  monitoring:
    enabled: true

persistence:
  storageClass: "hcloud-volumes"

nfs:
  enabled: true
  storageClassName: nfs-workspace
  storageClass: "hcloud-volumes"
  storageSize: 30Gi
  nodeSelector:
    pool: infra

highAvailability:
  pdb:
    enabled: false
  antiAffinity:
    enabled: false

certManager:
  enabled: true
  email: ""
