{{- /*
 =============================================================================
 Secrets template. Skipped entirely when externalSecrets.managed=true, in which
 case the Secret is owned by ExternalSecrets (ai/k8s vault-eso layer) — avoids a
 dual-owner race where Helm and ESO both reconcile the same Secret.
 When rendered (managed=false), all sensitive values are required() so a
 misconfigured/unmanaged install fails fast instead of shipping weak defaults.
 =============================================================================
*/ -}}
{{- if not .Values.externalSecrets.managed }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "druppie.fullname" . }}-secrets
  annotations:
    # Keep the live Secret across Helm upgrades even after this template stops
    # rendering (externalSecrets.managed=true), so ESO remains the uninterrupted
    # owner — no gap while ESO reconciles. ESO (deletionPolicy: Retain) owns the
    # lifecycle from then on.
    helm.sh/resource-policy: keep
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
type: Opaque
stringData:
  DRUPPIE_DB_PASSWORD: {{ required "postgresql.druppie.password is required (or set externalSecrets.managed=true)" .Values.postgresql.druppie.password | quote }}
  KEYCLOAK_DB_PASSWORD: {{ required "postgresql.keycloak.password is required (or set externalSecrets.managed=true)" .Values.postgresql.keycloak.password | quote }}
  GITEA_DB_PASSWORD: {{ required "postgresql.gitea.password is required (or set externalSecrets.managed=true)" .Values.postgresql.gitea.password | quote }}

  {{- if .Values.cnpg.enabled }}
  DATABASE_URL: "postgresql://{{ .Values.postgresql.druppie.username }}:{{ .Values.postgresql.druppie.password }}@{{ include "druppie.fullname" . }}-druppie-db-pooler-rw:5432/{{ .Values.postgresql.druppie.database }}"
  {{- else }}
  DATABASE_URL: "postgresql://{{ .Values.postgresql.druppie.username }}:{{ .Values.postgresql.druppie.password }}@{{ include "druppie.fullname" . }}-druppie-db:5432/{{ .Values.postgresql.druppie.database }}"
  {{- end }}

  KEYCLOAK_ADMIN: {{ .Values.keycloak.adminUser | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ required "keycloak.adminPassword is required (or set externalSecrets.managed=true)" .Values.keycloak.adminPassword | quote }}

  GITEA_ADMIN_PASSWORD: {{ required "gitea.adminPassword is required (or set externalSecrets.managed=true)" .Values.gitea.adminPassword | quote }}
  GITEA_PASSWORD: {{ required "gitea.adminPassword is required (or set externalSecrets.managed=true)" .Values.gitea.adminPassword | quote }}
  GITEA_TOKEN: {{ .Values.secrets.giteaToken | quote }}
  EXTERNAL_GITEA_TOKEN: {{ .Values.secrets.externalGiteaToken | quote }}

  ZAI_API_KEY: {{ .Values.secrets.zaiApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  DEEPINFRA_API_KEY: {{ .Values.secrets.deepinfraApiKey | quote }}
  FOUNDRY_API_KEY: {{ .Values.secrets.foundryApiKey | quote }}

  INTERNAL_API_KEY: {{ required "secrets.internalApiKey is required (or set externalSecrets.managed=true)" .Values.secrets.internalApiKey | quote }}
  DRUPPIE_MODULE_API_TOKEN: {{ .Values.secrets.moduleApiToken | quote }}

{{- if .Values.cnpg.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "druppie.fullname" . }}-druppie-db-superuser
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: {{ .Values.postgresql.druppie.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak-db-superuser
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: {{ .Values.postgresql.keycloak.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "druppie.fullname" . }}-gitea-db-superuser
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: {{ .Values.postgresql.gitea.password | quote }}
{{- end }}
{{- end }}
{{- end }}
