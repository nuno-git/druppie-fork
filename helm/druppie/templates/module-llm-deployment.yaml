{{- if .Values.modules.llm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-llm
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-llm
spec:
  replicas: {{ .Values.modules.llm.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-llm
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-llm
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerateGpu }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      {{- end }}
      containers:
        - name: module-llm
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.llm.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MCP_PORT
              value: {{ .Values.modules.llm.port | quote }}
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: ZAI_API_KEY
            - name: ZAI_BASE_URL
              value: {{ .Values.backend.zai.baseUrl | quote }}
            - name: ZAI_MODEL
              value: {{ .Values.backend.zai.model | quote }}
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: DEEPINFRA_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: OPENROUTER_API_KEY
                  # Branch envs: the chart secret has no OPENROUTER_API_KEY
                  # (it comes from Vault via extraEnvFromSecret below).
                  optional: true
          {{- if .Values.global.extraEnvFromSecret }}
          envFrom:
            # Branch environments: Vault-sourced overrides (ESO-managed).
            # Optional so the pod starts while the secret syncs.
            - secretRef:
                name: {{ .Values.global.extraEnvFromSecret }}
                optional: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.llm.port }}
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://localhost:{{ .Values.modules.llm.port }}/health')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://localhost:{{ .Values.modules.llm.port }}/health')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.modules.llm.resources | nindent 12 }}
{{- end }}
