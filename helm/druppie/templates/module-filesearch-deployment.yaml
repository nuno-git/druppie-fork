{{- $dev := include "druppie.moduleDevMode" (dict "root" . "mod" "filesearch") -}}
{{- if .Values.modules.filesearch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-filesearch
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-filesearch
spec:
  replicas: {{ .Values.modules.filesearch.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-filesearch
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-filesearch
        {{- if not .Values.persistence.rwx }}
        druppie.io/shared-storage: "true"
        {{- end }}
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- include "druppie.sharedStorageAffinity" . | nindent 6 }}
      containers:
        - name: module-filesearch
          {{- if $dev }}
          image: {{ include "druppie.moduleDevImage" (dict "root" . "image" .Values.modules.filesearch.image) }}
          imagePullPolicy: Always
          command:
            - bash
            - /scripts/module-dev-entrypoint.sh
            - "filesearch"
            - "module-filesearch"
            - {{ .Values.modules.filesearch.port | quote }}
          {{- else }}
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.filesearch.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- end }}
          env:
            - name: SEARCH_ROOT
              value: "/dataset"
            - name: MCP_PORT
              value: {{ .Values.modules.filesearch.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.filesearch.port }}
              protocol: TCP
          volumeMounts:
            {{- if $dev }}
            - name: workspace-dev
              mountPath: /workspace
            - name: module-dev-entrypoint
              mountPath: /scripts
              readOnly: true
            {{- else }}
            - name: dataset
              mountPath: /dataset
            {{- end }}
          {{- if $dev }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.modules.filesearch.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: {{ .Values.modules.filesearch.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.filesearch.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.filesearch.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.modules.filesearch.resources | nindent 12 }}
      {{- with .Values.modules.filesearch.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if $dev }}
        - name: workspace-dev
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-workspace-dev
        - name: module-dev-entrypoint
          configMap:
            name: {{ include "druppie.fullname" . }}-module-dev-entrypoint
            defaultMode: 0755
        {{- else }}
        - name: dataset
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-dataset
        {{- end }}
{{- end }}
