apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "druppie.fullname" . }}-config
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
data:
  # Global
  DRUPPIE_INSTANCE: {{ .Values.global.instance | quote }}
  DOMAIN: {{ .Values.global.domain | quote }}
  {{- /*
    Version (deployment metadata). CI sets global.imageTag to
    "<branch>-<timestamp>-<sha8>" (see .gitea/workflows/build.yaml); we parse
    branch/commit from it here so /api/version (frontend badges) reports the
    exact running build. Safe when imageTag is empty or "latest".
  */ -}}
  {{- $tag := .Values.global.imageTag | toString -}}
  {{- $commit := "" -}}
  {{- $branch := "" -}}
  {{- if $tag -}}
    {{- $parts := splitList "-" $tag -}}
    {{- if ge (len $parts) 3 -}}
      {{- $commit = last $parts -}}
      {{- $branch = initial (initial $parts) | join "-" -}}
    {{- end -}}
  {{- end }}
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  CHART_VERSION: {{ .Chart.Version | quote }}
  IMAGE_TAG: {{ .Values.global.imageTag | quote }}
  GIT_BRANCH: {{ $branch | quote }}
  GIT_COMMIT: {{ $commit | quote }}

  # Keycloak
  KEYCLOAK_REALM: "druppie"
  KEYCLOAK_CLIENT_ID: "druppie-backend"
  KEYCLOAK_SERVER_URL: "http://{{ include "druppie.fullname" . }}-keycloak:8080"
  KEYCLOAK_ISSUER_URL: "{{ include "druppie.keycloakExternalUrl" . }}"

  # Gitea
  GITEA_INTERNAL_URL: "http://{{ include "druppie.fullname" . }}-gitea:3000"
  GITEA_URL: "{{ include "druppie.giteaExternalUrl" . }}"
  GITEA_ORG: {{ .Values.gitea.org | quote }}
  GITEA_USER: {{ .Values.gitea.adminUser | quote }}
  GITEA_ADMIN_USER: {{ .Values.gitea.adminUser | quote }}
  GITEA_ADMIN_EMAIL: {{ .Values.gitea.adminEmail | quote }}

  # Backend
  BACKEND_URL: "http://{{ include "druppie.fullname" . }}-backend:8000"
  WORKSPACE_PATH: "/app/workspace"
  USE_MCP_MICROSERVICES: "true"
  {{- if not .Values.global.ingress.enabled }}
  # URL for compose_up apps to reach the backend (Docker-reachable, not K8s DNS)
  COMPOSE_DRUPPIE_URL: {{ (.Values.backend.composeDruppieUrl | default (printf "http://172.25.0.1:%d" (int .Values.backend.nodePort))) | quote }}
  {{- end }}

  # MCP module URLs
  MCP_CODING_URL: "http://{{ include "druppie.fullname" . }}-module-coding:9001"
  MCP_DOCKER_URL: "http://{{ include "druppie.fullname" . }}-module-docker:9002"
  MCP_FILESEARCH_URL: "http://{{ include "druppie.fullname" . }}-module-filesearch:9004"
  MCP_WEB_URL: "http://{{ include "druppie.fullname" . }}-module-web:9005"
  MCP_ARCHIMATE_URL: "http://{{ include "druppie.fullname" . }}-module-archimate:9006"
  MCP_REGISTRY_URL: "http://{{ include "druppie.fullname" . }}-module-registry:9007"
  MCP_LLM_URL: "http://{{ include "druppie.fullname" . }}-module-llm:{{ .Values.modules.llm.port }}"
  MCP_VISION_URL: "http://{{ include "druppie.fullname" . }}-module-vision:{{ .Values.modules.vision.port }}"
  MCP_KUBERNETES_URL: "http://{{ include "druppie.fullname" . }}-module-kubernetes:{{ .Values.modules.kubernetes.port }}"
  MCP_DATA_ACCESS_URL: "http://{{ include "druppie.fullname" . }}-module-data-access:9010"
  MCP_AZUREDEVOPS_URL: "http://{{ include "druppie.fullname" . }}-module-azuredevops:{{ .Values.modules.azuredevops.port }}"
  MCP_SEARXNG_URL: "http://{{ include "druppie.fullname" . }}-module-searxng:{{ .Values.modules.searxng.port }}"
  LAYOUT_SERVICE_URL: "http://{{ include "druppie.fullname" . }}-layout-service:8090"

  # CORS
  CORS_ORIGINS: "{{ include "druppie.frontendExternalUrl" . }}"

  # LLM defaults
  LLM_PROVIDER: {{ .Values.backend.llm.provider | quote }}
  ZAI_MODEL: {{ .Values.backend.zai.model | quote }}
  ZAI_BASE_URL: {{ .Values.backend.zai.baseUrl | quote }}
  DEEPSEEK_MODEL: {{ .Values.backend.deepseek.model | quote }}
  DEEPSEEK_BASE_URL: {{ .Values.backend.deepseek.baseUrl | quote }}
  DEEPINFRA_MODEL: {{ .Values.backend.deepinfra.model | quote }}
  DEEPINFRA_BASE_URL: {{ .Values.backend.deepinfra.baseUrl | quote }}
  LLMKUBE_MODEL: {{ .Values.backend.llmkube.model | quote }}
  LLMKUBE_BASE_URL: {{ .Values.backend.llmkube.baseUrl | quote }}

  # Sandbox
  DRUPPIE_SANDBOX_MODE: {{ if .Values.agentSandbox.enabled }}k8s{{ else }}docker{{ end }}
  DRUPPIE_SANDBOX_RUNTIME: {{ .Values.sandbox.runtime | quote }}
  DRUPPIE_SANDBOX_IMAGE: {{ .Values.sandbox.image | quote }}
  {{- if .Values.agentSandbox.enabled }}
  SANDBOX_NAMESPACE: "sandbox-runtime"
  SANDBOX_WARMPOOL: "agent-coding-warmpool"
  {{- end }}
  DRUPPIE_SANDBOX_USER: {{ .Values.global.instance | quote }}
  DRUPPIE_SANDBOX_NETWORK: "{{ .Values.global.instance }}-sandbox-net"
  DRUPPIE_SANDBOX_INET_NETWORK: "{{ .Values.global.instance }}-sandbox-inet"
  DRUPPIE_SANDBOX_MODULES_NETWORK: "{{ .Values.global.instance }}-sandbox-modules"
  DRUPPIE_SANDBOX_CACHE_VOLUME: "{{ .Values.global.instance }}_sandbox_dep_cache"
  DRUPPIE_DOCKER_MEMORY_LIMIT: {{ .Values.sandbox.memoryLimit | quote }}
  DRUPPIE_DOCKER_CPU_LIMIT: {{ .Values.sandbox.cpuLimit | quote }}
  WORKSPACE_ROOT: "/workspaces"
  DOCKER_NETWORK: "{{ .Values.global.instance }}-network"

  # Frontend Vite
  VITE_API_URL: "{{ include "druppie.backendExternalUrl" . }}"
  VITE_KEYCLOAK_URL: "{{ include "druppie.keycloakExternalUrl" . }}"
  VITE_KEYCLOAK_REALM: {{ .Values.frontend.vite.keycloakRealm | quote }}
  VITE_KEYCLOAK_CLIENT_ID: {{ .Values.frontend.vite.keycloakClientId | quote }}
  VITE_GITEA_URL: "{{ include "druppie.giteaExternalUrl" . }}"
