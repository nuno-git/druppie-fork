{{- $dev := include "druppie.moduleDevMode" (dict "root" . "mod" "registry") -}}
{{- if .Values.modules.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-registry
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-registry
spec:
  replicas: {{ .Values.modules.registry.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-registry
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-registry
        {{- if and $dev (not .Values.persistence.rwx) }}
        druppie.io/shared-storage: "true"
        {{- end }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $dev }}
      {{- include "druppie.sharedStorageAffinity" . | nindent 6 }}
      {{- end }}
      containers:
        - name: module-registry
          {{- if $dev }}
          image: {{ include "druppie.moduleDevImage" (dict "root" . "image" .Values.modules.registry.image) }}
          imagePullPolicy: Always
          command:
            - bash
            - /scripts/module-dev-entrypoint.sh
            - "registry"
            - "module-registry"
            - {{ .Values.modules.registry.port | quote }}
          {{- else }}
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.registry.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- end }}
          env:
            - name: DATA_DIR
              value: "/data"
            - name: MCP_PORT
              value: {{ .Values.modules.registry.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "druppie.fullname" . }}-config
            - secretRef:
                name: {{ include "druppie.fullname" . }}-secrets
            {{- if .Values.global.extraEnvFromSecret }}
            # Branch environments: Vault-sourced overrides (ESO-managed). Listed
            # last so its keys win; optional so pods start while it syncs.
            - secretRef:
                name: {{ .Values.global.extraEnvFromSecret }}
                optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.registry.port }}
              protocol: TCP
          {{- if $dev }}
          volumeMounts:
            - name: workspace-dev
              mountPath: /workspace
            - name: module-dev-entrypoint
              mountPath: /scripts
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: {{ .Values.modules.registry.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: {{ .Values.modules.registry.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.registry.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.registry.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.modules.registry.resources | nindent 12 }}
      {{- if $dev }}
      volumes:
        - name: workspace-dev
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-workspace-dev
        - name: module-dev-entrypoint
          configMap:
            name: {{ include "druppie.fullname" . }}-module-dev-entrypoint
            defaultMode: 0755
      {{- end }}
{{- end }}
