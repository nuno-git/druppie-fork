{{- if .Values.agentSandbox.enabled }}
# CiliumNetworkPolicy: allow module-coding to reach Gitea for host-side git clone.
#
# In agent-sandbox (k8s) mode, the host-side clone runs git clone inside the
# module-coding pod. The app-net NetworkPolicy blocks egress to private IPs
# (10/8), but Gitea endpoints resolve to private IPs:
#   - Internal: gitea:3000 (ClusterIP, same namespace)
#   - External: {{ .Values.gitea.external.url }} (resolves to {{ .Values.gitea.external.ip }})
#
# This CNP adds egress rules for both so git clone doesn't hang.
# Cilium unions CNP and NP egress, so this adds to the standard policies.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "druppie.fullname" . }}-module-coding-gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-coding
  egress:
    # Allow module-coding to reach the external Gitea (used for update_core scope)
    - toFQDNs:
        - matchPattern: "{{ .Values.gitea.external.url | replace "https://" "" | replace "http://" "" }}"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "3000"
              protocol: TCP
      # Also allow by known IP to avoid dependency on DNS proxy
    - toCIDR:
        - {{ .Values.gitea.external.ip }}/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "3000"
              protocol: TCP
{{- end }}