{{- if .Values.agentSandbox.enabled }}
# Harbor pull secret in the per-instance sandbox namespace.
# Warm pool pods need it to pull the sandbox image from Harbor.
# Created via ExternalSecret (ESO) when managed=true, or directly from chart values.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-regcred
  namespace: {{ .Values.global.instance }}-sandbox
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-ai-team-k8s
    kind: ClusterSecretStore
  target:
    name: harbor-regcred
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ include "druppie.eso-dockerconfigjson" . }}'
  data:
  - secretKey: username
    remoteRef:
      key: ci/harbor
      property: username
  - secretKey: password
    remoteRef:
      key: ci/harbor
      property: password
  - secretKey: registry
    remoteRef:
      key: ci/harbor
      property: registry
{{- end }}