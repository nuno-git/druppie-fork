{{- if .Values.agentSandbox.enabled }}
# SandboxTemplate: agent-coding — gVisor-isolated sandbox for AI agent code execution.
# Uses a custom image built on the agent-sandbox runtime (port 8888 server)
# with Druppie tools (Python, git, pip packages) added.
#
# IMPORTANT: the base image must include the agent-sandbox runtime server.
# Build with: druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s
# Push to: harbor.rijnland.dev/druppie/druppie-sandbox-k8s:latest
#
# Per-instance: each Druppie instance gets its own SandboxTemplate in its own
# sandbox namespace (e.g. druppie-sandbox, druppie-colab-dev-sandbox).
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: "{{ .Values.global.instance }}-agent-coding-template"
  namespace: "{{ .Values.global.instance }}-sandbox"
spec:
  podTemplate:
    spec:
      runtimeClassName: gvisor
      dnsPolicy: Default
      priorityClassName: druppie-agent
      containers:
      - name: runner
        image: {{ .Values.global.imageRegistry }}/druppie-sandbox-k8s:{{ .Values.global.imageTag }}
        ports:
        - containerPort: 8888
        readinessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: "250m"
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: {{ .Values.agentSandbox.coding.cpuLimit | default "2" }}
            memory: {{ .Values.agentSandbox.coding.memoryLimit | default "4Gi" }}
      imagePullSecrets:
      - name: harbor-regcred
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.agentSandbox.storageClass | default "longhorn-branch-env" }}
      resources:
        requests:
          storage: {{ .Values.agentSandbox.coding.workspaceSize | default "10Gi" }}
  networkPolicy:
    egress:
    # DNS
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    # HTTPS to external (npm, pip, git)
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
      - protocol: TCP
        port: 443
    # Gitea (git clone/push)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 3000
    # Harbor (image pulls)
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: harbor
      ports:
      - protocol: TCP
        port: 80
    # LLM endpoint
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
      - protocol: TCP
        port: 8000
{{- end }}
