{{- if .Values.agentSandbox.enabled }}
# RBAC for the sandbox-runtime namespace.
# The module-coding pod uses this ServiceAccount to create SandboxClaims
# and exec into sandbox pods via the agent-sandbox SDK.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-user
  namespace: sandbox-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-user
  namespace: sandbox-runtime
rules:
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims", "sandboxtemplates", "sandboxwarmpools"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/portforward", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-user
  namespace: sandbox-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-user
subjects:
- kind: ServiceAccount
  name: sandbox-user
  namespace: sandbox-runtime
{{- end }}
