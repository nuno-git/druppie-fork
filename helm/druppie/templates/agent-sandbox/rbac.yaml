{{- if .Values.agentSandbox.enabled }}
# RBAC for agent-sandbox claims.
#
# The module-coding pod runs in the release namespace (e.g. druppie-colab-dev)
# but creates SandboxClaims and execs into sandbox pods in the per-instance
# sandbox namespace (e.g. druppie-colab-dev-sandbox). A pod may only use a
# ServiceAccount from its own namespace, so we create a per-instance SA here
# and grant it permissions in the per-instance sandbox namespace via a
# per-instance Role + RoleBinding.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "druppie.fullname" . }}-module-coding
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "druppie.fullname" . }}-sandbox-user
  namespace: {{ .Values.global.instance }}-sandbox
rules:
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims", "sandboxtemplates", "sandboxwarmpools"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/portforward", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "druppie.fullname" . }}-sandbox-user
  namespace: {{ .Values.global.instance }}-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "druppie.fullname" . }}-sandbox-user
subjects:
- kind: ServiceAccount
  name: {{ include "druppie.fullname" . }}-module-coding
  namespace: {{ .Release.Namespace }}
{{- if .Values.devWorkspace.enabled }}
# When devWorkspace is enabled, the workspace pod uses the module-kubernetes SA
# but also needs sandbox permissions (module-coding runs embedded in the workspace).
- kind: ServiceAccount
  name: {{ include "druppie.fullname" . }}-module-kubernetes
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
