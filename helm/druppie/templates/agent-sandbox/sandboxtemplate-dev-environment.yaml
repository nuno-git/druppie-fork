{{- if .Values.agentSandbox.enabled }}
# SandboxTemplate: dev-environment — code-server + Druppie stack for developers.
# Plain runc (trusted developers), persistent, hibernatable.
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: dev-environment-template
  namespace: "{{ .Values.global.instance }}-sandbox"
spec:
  podTemplate:
    spec:
      priorityClassName: druppie-dev-vm
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: code-server
        image: coder/code-server:latest
        command: ["code-server", "--bind-addr", "0.0.0.0:8080", "/workspace"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-env-secrets
              key: pg-password
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: workspace
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.agentSandbox.storageClass | default "longhorn-branch-env" }}
      resources:
        requests:
          storage: {{ .Values.agentSandbox.devEnv.workspaceSize | default "20Gi" }}
{{- end }}
