{{- if .Values.modules.prreview.enabled }}
# CiliumNetworkPolicy: allow module-prreview to reach the external GitOps Gitea.
#
# The PR review module reads PRs and posts review comments via the Gitea API on
# aigit.waterschap.org, which resolves to a private IP (10.23.0.101). The
# app-net NetworkPolicy blocks egress to 10/8, so without this exception every
# PR review tool call times out. Same pattern as cnp-backend-gitops.yaml
# (Cilium unions CNP and NP egress).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "druppie.fullname" . }}-module-prreview-gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-prreview
  egress:
    - toFQDNs:
        - matchPattern: "aigit.waterschap.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
      # Also allow by known IP to avoid dependency on DNS proxy
    - toCIDR:
        - 10.23.0.101/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
