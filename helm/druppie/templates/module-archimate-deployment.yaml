{{- $dev := include "druppie.moduleDevMode" (dict "root" . "mod" "archimate") -}}
{{- if .Values.modules.archimate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-archimate
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-archimate
spec:
  replicas: {{ .Values.modules.archimate.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-archimate
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-archimate
        {{- if not .Values.persistence.rwx }}
        druppie.io/shared-storage: "true"
        {{- end }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- include "druppie.sharedStorageAffinity" . | nindent 6 }}
      containers:
        - name: module-archimate
          {{- if $dev }}
          image: {{ include "druppie.moduleDevImage" (dict "root" . "image" .Values.modules.archimate.image) }}
          imagePullPolicy: Always
          command:
            - bash
            - /scripts/module-dev-entrypoint.sh
            - "archimate"
            - "module-archimate"
            - {{ .Values.modules.archimate.port | quote }}
          {{- else }}
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.archimate.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- end }}
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: MCP_PORT
              value: {{ .Values.modules.archimate.port | quote }}
            - name: LAYOUT_SERVICE_URL
              value: "http://{{ include "druppie.fullname" . }}-layout-service:8090"
            - name: WORKSPACE_ROOT
              value: "/workspaces"
          envFrom:
            - configMapRef:
                name: {{ include "druppie.fullname" . }}-config
            - secretRef:
                name: {{ include "druppie.fullname" . }}-secrets
            {{- if .Values.global.extraEnvFromSecret }}
            # Branch environments: Vault-sourced overrides (ESO-managed). Listed
            # last so its keys win; optional so pods start while it syncs.
            - secretRef:
                name: {{ .Values.global.extraEnvFromSecret }}
                optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.archimate.port }}
              protocol: TCP
          volumeMounts:
            {{- if $dev }}
            - name: workspace-dev
              mountPath: /workspace
            - name: module-dev-entrypoint
              mountPath: /scripts
              readOnly: true
            {{- else }}
            - name: workspace
              mountPath: /workspaces
            {{- end }}
          {{- if $dev }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.modules.archimate.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: {{ .Values.modules.archimate.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.archimate.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.archimate.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.modules.archimate.resources | nindent 12 }}
      {{- with .Values.modules.archimate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if $dev }}
        - name: workspace-dev
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-workspace-dev
        - name: module-dev-entrypoint
          configMap:
            name: {{ include "druppie.fullname" . }}-module-dev-entrypoint
            defaultMode: 0755
        {{- else }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-workspace
        {{- end }}
{{- end }}
