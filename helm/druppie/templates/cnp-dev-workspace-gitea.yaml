{{- if .Values.devWorkspace.enabled }}
# CiliumNetworkPolicy: allow the dev-workspace pod to reach the external Gitea
# (aigit.waterschap.org) for git fetch/push from the code-server terminal.
#
# The app-net NetworkPolicy blocks egress to private IPs (10/8), but Gitea
# resolves to 10.23.0.101. Without this exception every git operation from the
# workspace terminal times out. Same pattern as cnp-module-coding-gitea.yaml
# and cnp-backend-gitops.yaml (Cilium unions CNP and NP egress).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "druppie.fullname" . }}-workspace-gitea
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dev-workspace
  egress:
    - toFQDNs:
        - matchPattern: "aigit.waterschap.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 10.23.0.101/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}