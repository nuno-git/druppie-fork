{{- if .Values.internalRunner.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "druppie.fullname" . }}-internal-runner
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "druppie.fullname" . }}-internal-runner
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "druppie.fullname" . }}-internal-runner
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "druppie.fullname" . }}-internal-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "druppie.fullname" . }}-internal-runner
    namespace: {{ .Release.Namespace }}
{{- end }}
