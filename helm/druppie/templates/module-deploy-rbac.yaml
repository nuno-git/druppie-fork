# Cluster RBAC for module-deploy (user-app GitOps).
#
# module-deploy deploys user apps by committing a Flux GitRepository+HelmRelease
# to the GitOps repo (ai/k8s) via the Gitea API — Flux does the actual deploys.
# The k8s-native image build works the same way: the build namespace, its
# ExternalSecrets AND the kaniko Job are all committed to git and created by
# Flux. module-deploy only READS their status back (namespaces, pods/logs,
# HelmRelease conditions, ExternalSecret sync status, Job success/failure).
#
# The ONE cluster write this ServiceAccount performs is scaling a Deployment to
# 0 for k8s_stop (apps/deployments: patch). Everything else — every deploy and
# every build — goes through git (Flux), never this ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "druppie.fullname" . }}-module-deploy
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-deploy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "druppie.fullname" . }}-module-deploy
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-deploy
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]   # resolve app ClusterIP for in-cluster health gate
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]   # patch = scale-to-0 for k8s_stop
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list"]   # read-only: gate the build on ESO Ready (no secret reads)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]   # read-only: poll the Flux-created kaniko build Job
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "druppie.fullname" . }}-module-deploy
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-deploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "druppie.fullname" . }}-module-deploy
subjects:
  - kind: ServiceAccount
    name: {{ include "druppie.fullname" . }}-module-deploy
    namespace: {{ .Release.Namespace }}
