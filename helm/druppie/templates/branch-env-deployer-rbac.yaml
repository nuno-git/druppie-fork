{{- if .Values.backend.branchEnvDeployer.enabled }}
# READ-ONLY cluster RBAC for the branch-environments deployer (GitOps model).
#
# The backend no longer deploys anything itself: it commits environment
# manifests to the GitOps repo (ai/k8s) via the Gitea API and FluxCD does the
# deploys/teardowns. The only cluster access the backend needs is reading live
# status: HelmRelease conditions per env namespace, and Namespace objects (to
# show envs that are still terminating after teardown).
#
# Gated by backend.branchEnvDeployer.enabled — enable only on instances that
# manage branch environments. Because git arbitrates concurrent writes, it is
# safe to enable on more than one instance.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "druppie.fullname" . }}-branch-env-deployer
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: branch-env-deployer
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  # Read the optional per-env dev workspace Deployment to report its live
  # status (running once a replica is ready, else deploying), plus all env
  # Deployments for the pipeline's workloads stage.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # Deploy-pipeline stages (all read-only): the branch-envs Kustomization and
  # the env's GitRepository (Flux sync + chart-source nodes) ...
  # PATCH is used to force-reconcile (fluxcd.io/request annotation) right after
  # the backend commits, cutting the 5-min GitRepository poll wait to seconds.
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "patch"]
  # ... ESO sync state (secrets node: missing Vault keys stall the env) ...
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list"]
  # ... and pod container statuses (workloads node: ImagePullBackOff from
  # Harbor, crash loops).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "druppie.fullname" . }}-branch-env-deployer
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: branch-env-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "druppie.fullname" . }}-branch-env-deployer
subjects:
  - kind: ServiceAccount
    {{- if .Values.backend.serviceAccount.create }}
    name: {{ include "druppie.fullname" . }}-backend
    {{- else }}
    name: default
    {{- end }}
    namespace: {{ .Release.Namespace }}
---
# CiliumNetworkPolicy: allow the backend to reach the Kubernetes API for the
# read-only status checks above. The restrictive app-net NetworkPolicy blocks
# private ranges, and the kube API Service VIP is DNATed to control-plane node
# IPs, so a plain ipBlock won't match; Cilium's kube-apiserver entity tracks
# the real API endpoints reliably (same approach as module-coding).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "druppie.fullname" . }}-backend-kubeapi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: branch-env-deployer
spec:
  endpointSelector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
{{- end }}
