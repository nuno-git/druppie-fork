{{- if and .Values.externalSecrets.managed .Values.global.vaultEnv }}
# Entra ID (Azure AD) identity provider credentials synced from Vault.
# Only created for environments with global.vaultEnv set (colab-dev, main).
# Branch environments skip this — they don't have Entra ID configured.
# Vault path: druppie/<vaultEnv>/entra-id (e.g. druppie/colab-dev/entra-id)
# Properties: client-id, client-secret, tenant-id
# The realm-import-configmap.yaml substitutes __ENTRA_*__ placeholders in
# realm-export.json from .Values.entraId.{clientId,clientSecret,tenantId}.
# The HelmRelease in ai/k8s should set these values from this Secret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "druppie.fullname" . }}-entra-id
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-ai-team-k8s
    kind: ClusterSecretStore
  target:
    name: {{ include "druppie.fullname" . }}-entra-id
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: druppie/{{ .Values.global.vaultEnv }}/entra-id
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: druppie/{{ .Values.global.vaultEnv }}/entra-id
        property: client-secret
    - secretKey: tenant-id
      remoteRef:
        key: druppie/{{ .Values.global.vaultEnv }}/entra-id
        property: tenant-id
    - secretKey: allowed-emails
      remoteRef:
        key: druppie/{{ .Values.global.vaultEnv }}/entra-id
        property: allowed-emails
{{- end }}
