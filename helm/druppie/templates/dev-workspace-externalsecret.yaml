{{- if and .Values.devWorkspace.enabled .Values.devWorkspace.oauth.externalSecret.enabled }}
# oauth2-proxy secrets (client-secret + cookie-secret) for the workspace -dev
# subdomain. When devWorkspace.developer is set, read from that developer's own
# path (druppie/developers/<developer>/workspace); otherwise fall back to the
# legacy shared branch-env/workspace-oauth.
{{- $vaultKey := .Values.devWorkspace.oauth.externalSecret.vaultKey }}
{{- if .Values.devWorkspace.developer }}
{{- $vaultKey = printf "druppie/developers/%s/workspace" .Values.devWorkspace.developer }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.devWorkspace.oauth.externalSecret.secretName }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.devWorkspace.oauth.externalSecret.storeRef.name }}
    kind: {{ .Values.devWorkspace.oauth.externalSecret.storeRef.kind }}
  target:
    name: {{ .Values.devWorkspace.oauth.externalSecret.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $vaultKey }}
{{- end }}
