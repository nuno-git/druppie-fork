{{- if and .Values.devWorkspace.enabled .Values.devWorkspace.oauth.externalSecret.enabled }}
# oauth2-proxy secrets (client-secret + cookie-secret) for the workspace
# -dev subdomain. Mirrors the Vault KV path branch-env/workspace-oauth that
# branch environments already provision (see values.yaml comment).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.devWorkspace.oauth.externalSecret.secretName }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.devWorkspace.oauth.externalSecret.storeRef.name }}
    kind: {{ .Values.devWorkspace.oauth.externalSecret.storeRef.kind }}
  target:
    name: {{ .Values.devWorkspace.oauth.externalSecret.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.devWorkspace.oauth.externalSecret.vaultKey }}
{{- end }}
