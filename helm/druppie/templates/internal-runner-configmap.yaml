{{- if .Values.internalRunner.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "druppie.fullname" . }}-internal-runner-config
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-runner
data:
  config.yaml: |
    log:
      level: info
    runner:
      capacity: {{ .Values.internalRunner.capacity }}
      timeout: 1h
      fetch_timeout: 10s
      labels:
        ubuntu-latest: "docker://node:20-bookworm"
    container:
      network: host
      options: "-e SSL_CERT_FILE=/castore/ca-bundle.pem -e CURL_CA_BUNDLE=/castore/ca-bundle.pem"
      valid_volumes:
        - '*'
{{- end }}
