{{- if and .Values.externalSecrets.managed (or .Values.devWorkspace.secretsSource .Values.global.vaultEnv) }}
# Env secrets: sync Vault secrets into the namespace's <instance>-secrets Secret.
# The Vault path prefix is determined by devWorkspace.secretsSource (takes
# precedence) or global.vaultEnv:
#   secretsSource="colab-dev" → druppie/colab-dev/*
#   secretsSource="main"      → druppie/main/*
#   secretsSource="robbe"     → druppie/developers/robbe/*
#   vaultEnv="colab-dev"      → druppie/colab-dev/*
#   vaultEnv="main"           → druppie/main/*
#
# Requires externalSecrets.managed=true (the chart's own secrets.yaml is skipped;
# ESO owns this Secret). The workspace/backend envFrom <instance>-secrets.
{{- $src := .Values.devWorkspace.secretsSource }}
{{- $prefix := "" }}
{{- if $src }}
{{-   if eq $src "colab-dev" }}
{{-     $prefix = "druppie/colab-dev" }}
{{-   else if eq $src "main" }}
{{-     $prefix = "druppie/main" }}
{{-   else }}
{{-     $prefix = printf "druppie/developers/%s" $src }}
{{-   end }}
{{- else if .Values.global.vaultEnv }}
{{-   $prefix = printf "druppie/%s" .Values.global.vaultEnv }}
{{- end }}
{{- $ns := .Release.Namespace }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "druppie.fullname" . }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-ai-team-k8s
    kind: ClusterSecretStore
  target:
    name: {{ include "druppie.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # database
    # NOTE: DATABASE_URL is intentionally NOT synced from Vault — the hostname
    # is instance-specific (druppie-<slug>-druppie-db) and cannot be stored
    # statically. It is constructed dynamically in the deployment template via
    # K8s variable expansion: $(DRUPPIE_DB_PASSWORD) and $(DRUPPIE_INSTANCE).
    - secretKey: DRUPPIE_DB_PASSWORD
      remoteRef: { key: {{ printf "%s/database" $prefix }}, property: password }
    # keycloak
    - secretKey: KEYCLOAK_ADMIN
      remoteRef: { key: {{ printf "%s/keycloak" $prefix }}, property: admin-user }
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef: { key: {{ printf "%s/keycloak" $prefix }}, property: admin-password }
    - secretKey: KEYCLOAK_DB_PASSWORD
      remoteRef: { key: {{ printf "%s/keycloak" $prefix }}, property: db-password }
    # gitea (internal)
    - secretKey: GITEA_ADMIN_PASSWORD
      remoteRef: { key: {{ printf "%s/gitea" $prefix }}, property: admin-password }
    - secretKey: GITEA_DB_PASSWORD
      remoteRef: { key: {{ printf "%s/gitea" $prefix }}, property: db-password }
    - secretKey: GITEA_PASSWORD
      remoteRef: { key: {{ printf "%s/gitea" $prefix }}, property: password }
    - secretKey: GITEA_TOKEN
      remoteRef: { key: {{ printf "%s/gitea" $prefix }}, property: token }
    # app
    - secretKey: INTERNAL_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: internal-api-key }
    - secretKey: DRUPPIE_MODULE_API_TOKEN
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: module-api-token }
    - secretKey: SANDBOX_API_SECRET
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: sandbox-api-secret }
    - secretKey: DEEPSEEK_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: deepseek-api-key }
    - secretKey: DEEPINFRA_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: deepinfra-api-key }
    - secretKey: FOUNDRY_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: foundry-api-key }
    - secretKey: ZAI_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: zai-api-key }
    - secretKey: OPENROUTER_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: openrouter-api-key }
    # External Gitea token (aigit) — shared across envs, not per-developer.
    - secretKey: EXTERNAL_GITEA_TOKEN
      remoteRef: { key: ci/gitea, property: token }
    # Data access MCP sources. Vault path: <prefix>/mcps/data-access
    # (property data-source-N). ESO has no per-ref optional flag, so declare
    # ONLY populated slots — a missing Vault property stalls the whole Secret
    # sync. module.py (_load_data_sources) reads DATA_SOURCE_1..9 at startup.
    # To add a source: seed data-source-N in Vault, then add a remoteRef here.
    - secretKey: DATA_SOURCE_1
      remoteRef: { key: {{ printf "%s/mcps/data-access" $prefix }}, property: data-source-1 }
    - secretKey: DATA_SOURCE_2
      remoteRef: { key: {{ printf "%s/mcps/data-access" $prefix }}, property: data-source-2 }
    # Azure DevOps MCP. Vault path: <prefix>/mcps/azuredevops
    # module.py reads these at startup (fails fast if any are empty).
    - secretKey: AZURE_DEVOPS_ORG_URL
      remoteRef: { key: {{ printf "%s/mcps/azuredevops" $prefix }}, property: org-url }
    - secretKey: AZURE_DEVOPS_PROJECT
      remoteRef: { key: {{ printf "%s/mcps/azuredevops" $prefix }}, property: project }
    - secretKey: AZURE_DEVOPS_TENANT_ID
      remoteRef: { key: {{ printf "%s/mcps/azuredevops" $prefix }}, property: tenant-id }
    - secretKey: AZURE_DEVOPS_CLIENT_ID
      remoteRef: { key: {{ printf "%s/mcps/azuredevops" $prefix }}, property: client-id }
    - secretKey: AZURE_DEVOPS_CLIENT_SECRET
      remoteRef: { key: {{ printf "%s/mcps/azuredevops" $prefix }}, property: client-secret }
    # workspace oauth (oauth2-proxy) — only needed when devWorkspace is enabled
    {{- if .Values.devWorkspace.enabled }}
    - secretKey: client-secret
      remoteRef: { key: {{ printf "%s/workspace" $prefix }}, property: client-secret }
    - secretKey: cookie-secret
      remoteRef: { key: {{ printf "%s/workspace" $prefix }}, property: cookie-secret }
    {{- end }}
{{- end }}
