{{- if and .Values.devWorkspace.enabled .Values.devWorkspace.developer }}
# Developer-env secrets: sync druppie/developers/<developer>/* (Vault) into the
# namespace's <instance>-secrets Secret — the same shape main/colab-dev use, so a
# developer environment owns its own database/keycloak/gitea/app credentials.
#
# Requires externalSecrets.managed=true (the chart's own secrets.yaml is skipped;
# ESO owns this Secret). The workspace/backend envFrom <instance>-secrets.
{{- $dev := .Values.devWorkspace.developer }}
{{- $ns := .Release.Namespace }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "druppie.fullname" . }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-ai-team-k8s
    kind: ClusterSecretStore
  target:
    name: {{ include "druppie.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # database
    - secretKey: DATABASE_URL
      remoteRef: { key: {{ printf "druppie/developers/%s/database" $dev }}, property: url }
    - secretKey: DRUPPIE_DB_PASSWORD
      remoteRef: { key: {{ printf "druppie/developers/%s/database" $dev }}, property: password }
    # keycloak
    - secretKey: KEYCLOAK_ADMIN
      remoteRef: { key: {{ printf "druppie/developers/%s/keycloak" $dev }}, property: admin-user }
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef: { key: {{ printf "druppie/developers/%s/keycloak" $dev }}, property: admin-password }
    - secretKey: KEYCLOAK_DB_PASSWORD
      remoteRef: { key: {{ printf "druppie/developers/%s/keycloak" $dev }}, property: db-password }
    # gitea (internal)
    - secretKey: GITEA_ADMIN_PASSWORD
      remoteRef: { key: {{ printf "druppie/developers/%s/gitea" $dev }}, property: admin-password }
    - secretKey: GITEA_DB_PASSWORD
      remoteRef: { key: {{ printf "druppie/developers/%s/gitea" $dev }}, property: db-password }
    - secretKey: GITEA_PASSWORD
      remoteRef: { key: {{ printf "druppie/developers/%s/gitea" $dev }}, property: password }
    - secretKey: GITEA_TOKEN
      remoteRef: { key: {{ printf "druppie/developers/%s/gitea" $dev }}, property: token }
    # app
    - secretKey: INTERNAL_API_KEY
      remoteRef: { key: {{ printf "druppie/developers/%s/app" $dev }}, property: internal-api-key }
    - secretKey: DRUPPIE_MODULE_API_TOKEN
      remoteRef: { key: {{ printf "druppie/developers/%s/app" $dev }}, property: module-api-token }
    - secretKey: SANDBOX_API_SECRET
      remoteRef: { key: {{ printf "druppie/developers/%s/app" $dev }}, property: sandbox-api-secret }
    - secretKey: DEEPSEEK_API_KEY
      remoteRef: { key: {{ printf "druppie/developers/%s/app" $dev }}, property: deepseek-api-key }
    - secretKey: DEEPINFRA_API_KEY
      remoteRef: { key: {{ printf "druppie/developers/%s/app" $dev }}, property: deepinfra-api-key }
    - secretKey: FOUNDRY_API_KEY
      remoteRef: { key: {{ printf "druppie/developers/%s/app" $dev }}, property: foundry-api-key }
    - secretKey: ZAI_API_KEY
      remoteRef: { key: {{ printf "druppie/developers/%s/app" $dev }}, property: zai-api-key }
    - secretKey: OPENROUTER_API_KEY
      remoteRef: { key: {{ printf "druppie/developers/%s/app" $dev }}, property: openrouter-api-key }
    # External Gitea token (aigit) — shared across envs, not per-developer.
    - secretKey: EXTERNAL_GITEA_TOKEN
      remoteRef: { key: ci/gitea, property: token }
    # workspace oauth (oauth2-proxy)
    - secretKey: client-secret
      remoteRef: { key: {{ printf "druppie/developers/%s/workspace" $dev }}, property: client-secret }
    - secretKey: cookie-secret
      remoteRef: { key: {{ printf "druppie/developers/%s/workspace" $dev }}, property: cookie-secret }
{{- end }}
