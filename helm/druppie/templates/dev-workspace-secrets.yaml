{{- if and .Values.devWorkspace.enabled .Values.devWorkspace.secretsSource }}
# Env secrets: sync Vault secrets into the namespace's <instance>-secrets Secret.
# The Vault path prefix is determined by devWorkspace.secretsSource:
#   "colab-dev"  → druppie/colab-dev/*
#   "robbe"      → druppie/developers/robbe/*
#   "nuno"       → druppie/developers/nuno/*
#   <custom>     → druppie/developers/<custom>/*
#
# Requires externalSecrets.managed=true (the chart's own secrets.yaml is skipped;
# ESO owns this Secret). The workspace/backend envFrom <instance>-secrets.
{{- $src := .Values.devWorkspace.secretsSource }}
{{- $prefix := "" }}
{{- if eq $src "colab-dev" }}
{{-   $prefix = "druppie/colab-dev" }}
{{- else }}
{{-   $prefix = printf "druppie/developers/%s" $src }}
{{- end }}
{{- $ns := .Release.Namespace }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "druppie.fullname" . }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-ai-team-k8s
    kind: ClusterSecretStore
  target:
    name: {{ include "druppie.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # database
    - secretKey: DATABASE_URL
      remoteRef: { key: {{ printf "%s/database" $prefix }}, property: url }
    - secretKey: DRUPPIE_DB_PASSWORD
      remoteRef: { key: {{ printf "%s/database" $prefix }}, property: password }
    # keycloak
    - secretKey: KEYCLOAK_ADMIN
      remoteRef: { key: {{ printf "%s/keycloak" $prefix }}, property: admin-user }
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef: { key: {{ printf "%s/keycloak" $prefix }}, property: admin-password }
    - secretKey: KEYCLOAK_DB_PASSWORD
      remoteRef: { key: {{ printf "%s/keycloak" $prefix }}, property: db-password }
    # gitea (internal)
    - secretKey: GITEA_ADMIN_PASSWORD
      remoteRef: { key: {{ printf "%s/gitea" $prefix }}, property: admin-password }
    - secretKey: GITEA_DB_PASSWORD
      remoteRef: { key: {{ printf "%s/gitea" $prefix }}, property: db-password }
    - secretKey: GITEA_PASSWORD
      remoteRef: { key: {{ printf "%s/gitea" $prefix }}, property: password }
    - secretKey: GITEA_TOKEN
      remoteRef: { key: {{ printf "%s/gitea" $prefix }}, property: token }
    # app
    - secretKey: INTERNAL_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: internal-api-key }
    - secretKey: DRUPPIE_MODULE_API_TOKEN
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: module-api-token }
    - secretKey: SANDBOX_API_SECRET
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: sandbox-api-secret }
    - secretKey: DEEPSEEK_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: deepseek-api-key }
    - secretKey: DEEPINFRA_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: deepinfra-api-key }
    - secretKey: FOUNDRY_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: foundry-api-key }
    - secretKey: ZAI_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: zai-api-key }
    - secretKey: OPENROUTER_API_KEY
      remoteRef: { key: {{ printf "%s/app" $prefix }}, property: openrouter-api-key }
    # External Gitea token (aigit) — shared across envs, not per-developer.
    - secretKey: EXTERNAL_GITEA_TOKEN
      remoteRef: { key: ci/gitea, property: token }
    # workspace oauth (oauth2-proxy)
    - secretKey: client-secret
      remoteRef: { key: {{ printf "%s/workspace" $prefix }}, property: client-secret }
    - secretKey: cookie-secret
      remoteRef: { key: {{ printf "%s/workspace" $prefix }}, property: cookie-secret }
{{- end }}
