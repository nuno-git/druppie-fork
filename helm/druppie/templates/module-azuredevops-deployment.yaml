{{- $dev := include "druppie.moduleDevMode" (dict "root" . "mod" "azuredevops") -}}
{{- if .Values.modules.azuredevops.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-azuredevops
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-azuredevops
spec:
  replicas: {{ .Values.modules.azuredevops.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-azuredevops
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-azuredevops
        {{- if not .Values.persistence.rwx }}
        druppie.io/shared-storage: "true"
        {{- end }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- include "druppie.sharedStorageAffinity" . | nindent 6 }}
      containers:
        - name: module-azuredevops
          {{- if $dev }}
          image: {{ include "druppie.moduleDevImage" (dict "root" . "image" .Values.modules.azuredevops.image) }}
          imagePullPolicy: Always
          command:
            - bash
            - /scripts/module-dev-entrypoint.sh
            - "azuredevops"
            - "module-azuredevops"
            - {{ .Values.modules.azuredevops.port | quote }}
          {{- else }}
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.azuredevops.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- end }}
          env:
            - name: MCP_PORT
              value: {{ .Values.modules.azuredevops.port | quote }}
          envFrom:
            - secretRef:
                name: {{ include "druppie.fullname" . }}-secrets
          ports:
            - name: http
              containerPort: {{ .Values.modules.azuredevops.port }}
              protocol: TCP
          {{- if $dev }}
          volumeMounts:
            - name: workspace-dev
              mountPath: /workspace
            - name: module-dev-entrypoint
              mountPath: /scripts
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: {{ .Values.modules.azuredevops.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: {{ .Values.modules.azuredevops.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.azuredevops.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.azuredevops.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.modules.azuredevops.resources | nindent 12 }}
      {{- with .Values.modules.azuredevops.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $dev }}
      volumes:
        - name: workspace-dev
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-workspace-dev
        - name: module-dev-entrypoint
          configMap:
            name: {{ include "druppie.fullname" . }}-module-dev-entrypoint
            defaultMode: 0755
      {{- end }}
{{- end }}
---
{{- if .Values.modules.azuredevops.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-module-azuredevops
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-azuredevops
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.modules.azuredevops.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: module-azuredevops
{{- end }}
