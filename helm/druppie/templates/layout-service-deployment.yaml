{{- if .Values.modules.layout_service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-layout-service
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: layout-service
spec:
  replicas: {{ .Values.modules.layout_service.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: layout-service
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: layout-service
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerateGpu }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      {{- end }}
      containers:
        - name: layout-service
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.layout_service.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.modules.layout_service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.layout_service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.layout_service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.layout_service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.modules.layout_service.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-layout-service
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: layout-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.modules.layout_service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: layout-service
{{- end }}
