apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgresql.image }}
          command:
            - sh
            - -c
            - |
              {{- if .Values.cnpg.enabled }}
              until pg_isready -h {{ include "druppie.fullname" . }}-keycloak-db-rw -p 5432 -U {{ .Values.postgresql.keycloak.username }}; do
              {{- else }}
              until pg_isready -h {{ include "druppie.fullname" . }}-keycloak-db -p 5432 -U {{ .Values.postgresql.keycloak.username }}; do
              {{- end }}
                echo "Waiting for keycloak-db..."
                sleep 2
              done
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              {{- if .Values.cnpg.enabled }}
              value: "jdbc:postgresql://{{ include "druppie.fullname" . }}-keycloak-db-rw:5432/{{ .Values.postgresql.keycloak.database }}"
              {{- else }}
              value: "jdbc:postgresql://{{ include "druppie.fullname" . }}-keycloak-db:5432/{{ .Values.postgresql.keycloak.database }}"
              {{- end }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.keycloak.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_DB_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            {{- if .Values.global.ingress.tls.enabled }}
            # Force HTTPS frontend URLs via hostname-url (overrides scheme+host+port)
            - name: KC_HOSTNAME_URL
              value: "https://{{ .Values.global.domain }}"
            {{- else if .Values.global.subdomains.keycloak }}
            - name: KC_HOSTNAME
              value: {{ .Values.global.subdomains.keycloak | quote }}
            {{- else }}
            - name: KC_HOSTNAME
              value: {{ .Values.global.domain | quote }}
            {{- end }}
            {{- if not .Values.global.ingress.tls.enabled }}
            {{- if .Values.global.ingress.enabled }}
            - name: KC_HOSTNAME_PORT
              value: {{ .Values.global.ingress.port | quote }}
            {{- else }}
            - name: KC_HOSTNAME_PORT
              value: {{ .Values.keycloak.nodePort | quote }}
            {{- end }}
            {{- end }}
            - name: KC_HOSTNAME_STRICT
              value: {{ .Values.global.ingress.tls.enabled | quote }}
            - name: KC_PROXY
              value: "edge"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_APPEND
              value: "-Xms256m -Xmx512m -XX:MaxGCPauseMillis=100 -Djava.net.preferIPv4Stack=true -Dquarkus.http.proxy.proxy-address-forwarding=true"
            - name: KC_CACHE
              value: "local"
            - name: KC_CACHE_STACK
              value: "udp"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: {{ .Values.keycloak.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.keycloak.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.keycloak.readinessProbe.failureThreshold }}
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: {{ .Values.keycloak.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.keycloak.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.keycloak.livenessProbe.failureThreshold }}
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          {{- if .Values.keycloak.realmImport.enabled }}
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          {{- end }}
      {{- if .Values.keycloak.realmImport.enabled }}
      volumes:
        - name: realm-import
          configMap:
            name: {{ include "druppie.fullname" . }}-realm-export
      {{- end }}
