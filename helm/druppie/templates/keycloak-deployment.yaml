apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
      {{- if .Values.keycloak.realmImport.enabled }}
      annotations:
        checksum/realm-export: {{ .Files.Get "files/realm-export.json" | sha256sum }}
      {{- end }}
    spec:
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgresql.image }}
          command:
            - sh
            - -c
            - |
              {{- if .Values.cnpg.enabled }}
              until pg_isready -h {{ include "druppie.fullname" . }}-keycloak-db-rw -p 5432 -U {{ .Values.postgresql.keycloak.username }}; do
              {{- else }}
              until pg_isready -h {{ include "druppie.fullname" . }}-keycloak-db -p 5432 -U {{ .Values.postgresql.keycloak.username }}; do
              {{- end }}
                echo "Waiting for keycloak-db..."
                sleep 2
              done
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
        {{- if and .Values.keycloak.realmImport.enabled (not .Values.keycloak.dbPersistent) }}
        - name: realm-reset
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Starting Keycloak to reset realm..."
              /opt/keycloak/bin/kc.sh start &
              KC_PID=$!

              echo "Waiting for Keycloak to be ready..."
              for i in $(seq 1 60); do
                if (echo > /dev/tcp/localhost/8080) 2>/dev/null; then
                  break
                fi
                sleep 2
              done

              REALM=$(grep -o '"realm": *"[^"]*"' /opt/keycloak/data/import/*.json | head -1 | sed 's/.*: *"//;s/"//')
              echo "Deleting realm: ${REALM}..."
              /opt/keycloak/bin/kcadm.sh delete realms/"${REALM}" || true

              echo "Stopping Keycloak..."
              kill $KC_PID
              wait $KC_PID 2>/dev/null || true
              echo "Realm reset complete."
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              {{- if .Values.cnpg.enabled }}
              value: "jdbc:postgresql://{{ include "druppie.fullname" . }}-keycloak-db-rw:5432/{{ .Values.postgresql.keycloak.database }}"
              {{- else }}
              value: "jdbc:postgresql://{{ include "druppie.fullname" . }}-keycloak-db:5432/{{ .Values.postgresql.keycloak.database }}"
              {{- end }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.keycloak.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_DB_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            {{- if .Values.global.subdomains.keycloak }}
            - name: KC_HOSTNAME
              value: {{ .Values.global.subdomains.keycloak | quote }}
            {{- else }}
            - name: KC_HOSTNAME
              value: {{ .Values.global.domain | quote }}
            {{- end }}
            - name: KC_HOSTNAME_STRICT
              value: {{ .Values.global.ingress.tls.enabled | quote }}
            - name: KC_PROXY
              value: "edge"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_APPEND
              value: "-Xms256m -Xmx512m -XX:MaxGCPauseMillis=100 -Djava.net.preferIPv4Stack=true -Dquarkus.http.proxy.proxy-address-forwarding=true"
            - name: KC_CACHE
              value: "local"
            - name: KC_CACHE_STACK
              value: "udp"
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
        {{- end }}
      {{- with .Values.global.tolerateGpu }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      {{- end }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["start", "--import-realm"]
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              {{- if .Values.cnpg.enabled }}
              value: "jdbc:postgresql://{{ include "druppie.fullname" . }}-keycloak-db-rw:5432/{{ .Values.postgresql.keycloak.database }}"
              {{- else }}
              value: "jdbc:postgresql://{{ include "druppie.fullname" . }}-keycloak-db:5432/{{ .Values.postgresql.keycloak.database }}"
              {{- end }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.keycloak.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_DB_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            {{- if .Values.global.subdomains.keycloak }}
            - name: KC_HOSTNAME
              value: {{ .Values.global.subdomains.keycloak | quote }}
            {{- else }}
            - name: KC_HOSTNAME
              value: {{ .Values.global.domain | quote }}
            {{- end }}
            {{- if not .Values.global.ingress.tls.enabled }}
            {{- if .Values.global.ingress.enabled }}
            - name: KC_HOSTNAME_PORT
              value: {{ .Values.global.ingress.port | quote }}
            {{- else }}
            - name: KC_HOSTNAME_PORT
              value: {{ .Values.keycloak.nodePort | quote }}
            {{- end }}
            {{- end }}
            - name: KC_HOSTNAME_STRICT
              value: {{ .Values.global.ingress.tls.enabled | quote }}
            - name: KC_PROXY
              value: "edge"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_APPEND
              value: "-Xms256m -Xmx512m -XX:MaxGCPauseMillis=100 -Djava.net.preferIPv4Stack=true -Dquarkus.http.proxy.proxy-address-forwarding=true"
            - name: KC_CACHE
              value: "local"
            - name: KC_CACHE_STACK
              value: "udp"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: {{ .Values.keycloak.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.keycloak.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.keycloak.readinessProbe.failureThreshold }}
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: {{ .Values.keycloak.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.keycloak.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.keycloak.livenessProbe.failureThreshold }}
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          {{- if .Values.keycloak.realmImport.enabled }}
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          {{- end }}
        # Sidecar that keeps the Entra ID identity provider config in sync with
        # the entra-id Secret (populated by ExternalSecrets from Vault).
        # Runs every 5 minutes: reads the Secret, updates the IdP via kcadm.sh.
        # This ensures Vault changes propagate to Keycloak without a pod restart.
        - name: entra-id-sync
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              KC=/opt/keycloak/bin/kcadm.sh
              SECRET_DIR=/etc/entra-id
              IDP_ALIAS=entra-id
              SLEEP_SEC=${SYNC_INTERVAL:-300}

              echo "entra-id-sync: waiting for Keycloak to be ready..."
              until curl -sf http://localhost:8080/health/ready >/dev/null 2>&1; do
                sleep 5
              done
              echo "entra-id-sync: Keycloak is ready."

              # Authenticate once, re-use token
              $KC config credentials \
                --server http://localhost:8080 \
                --realm master \
                --user "${KEYCLOAK_ADMIN}" \
                --password "${KEYCLOAK_ADMIN_PASSWORD}"

              while true; do
                CLIENT_ID=$(cat "${SECRET_DIR}/client-id" 2>/dev/null || echo "")
                CLIENT_SECRET=$(cat "${SECRET_DIR}/client-secret" 2>/dev/null || echo "")
                TENANT_ID=$(cat "${SECRET_DIR}/tenant-id" 2>/dev/null || echo "")

                if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$TENANT_ID" ]; then
                  echo "entra-id-sync: updating IdP '${IDP_ALIAS}'..."
                  $KC update "identity-provider/instances/${IDP_ALIAS}" -r druppie \
                    -s "config.clientId=${CLIENT_ID}" \
                    -s "config.clientSecret=${CLIENT_SECRET}" \
                    -s "config.tenantId=${TENANT_ID}" \
                    -s "config.authorizationUrl=https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize" \
                    -s "config.tokenUrl=https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
                    -s "config.userInfoUrl=https://graph.microsoft.com/oidc/userinfo" \
                    -s "config.logoutUrl=https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/logout" \
                    -s "config.jwksUrl=https://login.microsoftonline.com/${TENANT_ID}/discovery/v2.0/keys" \
                    --format json --quiet || echo "entra-id-sync: update failed (IdP may not exist yet)"
                else
                  echo "entra-id-sync: Entra ID secrets not fully populated yet (clientId=${CLIENT_ID:+(set)}, clientSecret=${CLIENT_SECRET:+(set)}, tenantId=${TENANT_ID:+(set)})"
                fi

                sleep "${SLEEP_SEC}"
              done
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: SYNC_INTERVAL
              value: "300"
          volumeMounts:
            - name: entra-id
              mountPath: /etc/entra-id
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: entra-id
          secret:
            secretName: {{ include "druppie.fullname" . }}-entra-id
            optional: true
        {{- if .Values.keycloak.realmImport.enabled }}
        - name: realm-import
          configMap:
            name: {{ include "druppie.fullname" . }}-realm-export
        {{- end }}
