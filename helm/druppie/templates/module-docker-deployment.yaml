{{- if .Values.modules.docker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-docker
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-docker
spec:
  replicas: {{ .Values.modules.docker.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-docker
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-docker
      annotations:
        reloader.stakater.com/auto: "true"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: module-docker
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.docker.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MCP_PORT
              value: {{ .Values.modules.docker.port | quote }}
            - name: DRUPPIE_URL
              value: "http://{{ include "druppie.fullname" . }}-backend:{{ .Values.backend.port }}"
            {{- if .Values.backend.dockerSocket.enabled }}
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "druppie.fullname" . }}-config
            - secretRef:
                name: {{ include "druppie.fullname" . }}-secrets
            {{- if .Values.global.extraEnvFromSecret }}
            # Branch environments: Vault-sourced overrides (ESO-managed). Listed
            # last so its keys win; optional so pods start while it syncs.
            - secretRef:
                name: {{ .Values.global.extraEnvFromSecret }}
                optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.docker.port }}
              protocol: TCP
          volumeMounts:
            - name: workspace
              mountPath: /workspaces
            {{- if .Values.backend.dockerSocket.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.docker.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.docker.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.modules.docker.resources | nindent 12 }}
      {{- with .Values.modules.docker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      {{- end }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-workspace
        {{- if .Values.backend.dockerSocket.enabled }}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- end }}
{{- end }}
