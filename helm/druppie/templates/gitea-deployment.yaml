apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-gitea
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  replicas: {{ .Values.gitea.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gitea
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gitea
    spec:
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgresql.image }}
          command:
            - sh
            - -c
            - |
              {{- if .Values.cnpg.enabled }}
              until pg_isready -h {{ include "druppie.fullname" . }}-gitea-db-rw -p 5432 -U {{ .Values.postgresql.gitea.username }}; do
              {{- else }}
              until pg_isready -h {{ include "druppie.fullname" . }}-gitea-db -p 5432 -U {{ .Values.postgresql.gitea.username }}; do
              {{- end }}
                echo "Waiting for gitea-db..."
                sleep 2
              done
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
        # Create the gitea admin user locally (no kubectl, no network egress
        # to the API). Runs as the git user via the image entrypoint, connects
        # to the gitea DB directly, and is idempotent — so a fresh/reset gitea
        # always ends up with its admin, while an existing one is left alone.
        - name: init-admin-user
          image: {{ .Values.gitea.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              {{- if .Values.cnpg.enabled }}
              value: "{{ include "druppie.fullname" . }}-gitea-db-rw:5432"
              {{- else }}
              value: "{{ include "druppie.fullname" . }}-gitea-db:5432"
              {{- end }}
            - name: GITEA__database__NAME
              value: {{ .Values.postgresql.gitea.database | quote }}
            - name: GITEA__database__USER
              value: {{ .Values.postgresql.gitea.username | quote }}
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: GITEA_DB_PASSWORD
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA_ADMIN_USER
              value: {{ .Values.gitea.adminUser | quote }}
            - name: GITEA_ADMIN_EMAIL
              value: {{ .Values.gitea.adminEmail | quote }}
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: GITEA_ADMIN_PASSWORD
          # Runs as root (container default): chown /data so the git user can
          # write on a fresh PVC, then run the gitea CLI as git via su-exec
          # (the gitea binary refuses to run as root). Fully idempotent.
          command:
            - sh
            - -c
            - |
              set -e
              chown -R 1000:1000 /data 2>/dev/null || true
              if su-exec git gitea admin user list | grep -q "$$GITEA_ADMIN_USER"; then
                echo "admin user '$$GITEA_ADMIN_USER' already exists"
              else
                su-exec git gitea admin user create \
                  --username "$$GITEA_ADMIN_USER" \
                  --password "$$GITEA_ADMIN_PASSWORD" \
                  --email "$$GITEA_ADMIN_EMAIL" \
                  --admin --must-change-password=false
              fi
          volumeMounts:
            - name: gitea-data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      containers:
        - name: gitea
          image: {{ .Values.gitea.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              {{- if .Values.cnpg.enabled }}
              value: "{{ include "druppie.fullname" . }}-gitea-db-rw:5432"
              {{- else }}
              value: "{{ include "druppie.fullname" . }}-gitea-db:5432"
              {{- end }}
            - name: GITEA__database__NAME
              value: {{ .Values.postgresql.gitea.database | quote }}
            - name: GITEA__database__USER
              value: {{ .Values.postgresql.gitea.username | quote }}
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: GITEA_DB_PASSWORD
            - name: GITEA__server__ROOT_URL
              value: "{{ include "druppie.giteaExternalUrl" . }}/"
            - name: GITEA__server__HTTP_PORT
              value: {{ .Values.gitea.httpPort | quote }}
            {{- if .Values.global.subdomains.gitea }}
            - name: GITEA__server__DOMAIN
              value: {{ .Values.global.subdomains.gitea | quote }}
            {{- else }}
            - name: GITEA__server__DOMAIN
              value: {{ .Values.global.domain | quote }}
            {{- end }}
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            - name: GITEA__oauth2_client__ACCOUNT_LINKING
              value: "auto"
            - name: GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION
              value: "true"
            - name: GITEA__oauth2_client__USERNAME
              value: "email"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          volumeMounts:
            - name: gitea-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.gitea.resources | nindent 12 }}
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-gitea-data
