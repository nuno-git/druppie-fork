apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-gitea
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gitea
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gitea
    spec:
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgresql.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "druppie.fullname" . }}-gitea-db -p 5432 -U {{ .Values.postgresql.gitea.username }}; do
                echo "Waiting for gitea-db..."
                sleep 2
              done
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: gitea
          image: {{ .Values.gitea.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              value: "{{ include "druppie.fullname" . }}-gitea-db:5432"
            - name: GITEA__database__NAME
              value: {{ .Values.postgresql.gitea.database | quote }}
            - name: GITEA__database__USER
              value: {{ .Values.postgresql.gitea.username | quote }}
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: GITEA_DB_PASSWORD
            - name: GITEA__server__ROOT_URL
              value: "http://localhost:9080/git/"
            - name: GITEA__server__HTTP_PORT
              value: {{ .Values.gitea.httpPort | quote }}
            - name: GITEA__server__DOMAIN
              value: "localhost"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            - name: GITEA__oauth2_client__ACCOUNT_LINKING
              value: "auto"
            - name: GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION
              value: "true"
            - name: GITEA__oauth2_client__USERNAME
              value: "email"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          volumeMounts:
            - name: gitea-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-gitea-data
