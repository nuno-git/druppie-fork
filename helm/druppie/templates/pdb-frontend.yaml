{{- if .Values.highAvailability.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "druppie.fullname" . }}-frontend-pdb
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  minAvailable: {{ .Values.highAvailability.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
{{- end }}
