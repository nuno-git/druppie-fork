{{- if and .Values.externalSecrets.managed .Values.modules.docker.userApps.gitops.tokenSecret.name }}
# Gitea token for the module-deploy pod (clone/push to ai/k8s GitOps repo).
# Also used by the backend's branch-env deployer when creating branch envs.
# Vault path ci/gitea is shared across all environments.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.modules.docker.userApps.gitops.tokenSecret.name }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-ai-team-k8s
    kind: ClusterSecretStore
  target:
    name: {{ .Values.modules.docker.userApps.gitops.tokenSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.modules.docker.userApps.gitops.tokenSecret.key | default "token" }}
      remoteRef:
        key: ci/gitea
        property: token
{{- end }}
