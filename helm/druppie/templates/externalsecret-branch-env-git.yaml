{{- /*
  =============================================================================
  ExternalSecret: GitOps Gitea token (ci/gitea#token from Vault).

  Used by:
    - backend.branchEnvDeployer (commits branch-env manifests to ai/k8s)
    - modules.docker.userApps (module-deploy commits user-app manifests to ai/k8s)

  Both reuse the same Vault path (ci/gitea#token) and the same Secret name
  (druppie-branch-env-git). Rendered when either feature is enabled.
  =============================================================================
*/ -}}
{{- if or .Values.backend.branchEnvDeployer.enabled .Values.modules.docker.userApps.gitops }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "druppie.fullname" . }}-branch-env-git
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-ai-team-k8s
    kind: ClusterSecretStore
  target:
    name: druppie-branch-env-git
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ci/gitea
        property: token
{{- end }}