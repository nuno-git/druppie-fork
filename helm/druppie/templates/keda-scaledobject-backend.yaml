{{- if and .Values.keda.enabled .Values.autoscaling.backend.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "druppie.fullname" . }}-backend
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "druppie.fullname" . }}-backend
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.autoscaling.backend.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.backend.maxReplicas }}
  triggers:
    # Trigger 1: CPU-based — scales on read-heavy load (GET endpoints don't create agent_runs)
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.keda.backend.targetCPUUtilization | default "60" }}"
    # Trigger 2: PostgreSQL — scales based on active agent runs (write/chat load)
    - type: postgresql
      metadata:
        {{- if .Values.cnpg.enabled }}
        host: "{{ include "druppie.fullname" . }}-druppie-db-rw.{{ .Release.Namespace }}.svc.cluster.local"
        {{- else }}
        host: "{{ include "druppie.fullname" . }}-druppie-db.{{ .Release.Namespace }}.svc.cluster.local"
        {{- end }}
        port: "{{ .Values.postgresql.druppie.port }}"
        dbName: {{ .Values.postgresql.druppie.database }}
        userName: {{ .Values.postgresql.druppie.username }}
        sslmode: {{ .Values.keda.sslmode | quote }}
        query: {{ .Values.keda.backend.query | quote }}
        targetQueryValue: {{ .Values.keda.backend.targetQueryValue | quote }}
        activationTargetQueryValue: {{ .Values.keda.backend.activationTargetQueryValue | quote }}
      authenticationRef:
        name: {{ include "druppie.fullname" . }}-keda-db-auth
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 30
            - type: Percent
              value: 200
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 180  # 3 min before scale-down
          policies:
            - type: Pods
              value: 1                     # Remove 1 pod at a time (gentle)
              periodSeconds: 120           # Every 2 min — prevents oscillation
{{- end }}
