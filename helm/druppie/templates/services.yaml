# Database Services
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-druppie-db
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: druppie-db
spec:
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: druppie-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak-db
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
spec:
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-gitea-db
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-db
spec:
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Keycloak Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: NodePort
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30002
---
# Gitea Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-gitea
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  type: NodePort
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30003
    - name: ssh
      port: 2222
      targetPort: ssh
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-backend
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      nodePort: 30000
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-frontend
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      nodePort: 30001
{{- if .Values.modules.coding.enabled }}
