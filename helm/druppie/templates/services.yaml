{{- if not .Values.cnpg.enabled }}
# Database Services
{{- if not .Values.recoveryMode }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-druppie-db
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: druppie-db
spec:
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: druppie-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak-db
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
spec:
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- if not .Values.recoveryMode }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-gitea-db
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-db
spec:
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
{{- end }}
---
# Keycloak Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: {{ .Values.keycloak.service.type | default "NodePort" }}
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if eq (.Values.keycloak.service.type | default "NodePort") "NodePort" }}
      nodePort: {{ .Values.keycloak.service.nodePort | default 30002 }}
      {{- end }}
{{- if not .Values.recoveryMode }}
---
# Gitea Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-gitea
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
spec:
  type: {{ .Values.gitea.service.type | default "NodePort" }}
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- if eq (.Values.gitea.service.type | default "NodePort") "NodePort" }}
      nodePort: {{ .Values.gitea.service.nodePort | default 30003 }}
      {{- end }}
    - name: ssh
      port: 2222
      targetPort: ssh
{{- end }}
---
# Backend Service
# When devWorkspace.enabled this routes to the workspace pod's hot-reload
# backend (container port "backend"), instead of the baked backend Deployment.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-backend
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if .Values.devWorkspace.enabled }}
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: backend
  {{- else }}
  type: {{ .Values.backend.service.type | default "NodePort" }}
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      {{- if eq (.Values.backend.service.type | default "NodePort") "NodePort" }}
      nodePort: {{ .Values.backend.service.nodePort | default 30000 }}
      {{- end }}
  {{- end }}
---
# Frontend Service
# When devWorkspace.enabled this routes to the workspace pod's Vite HMR
# frontend (container port "frontend"), instead of the baked frontend Deployment.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-frontend
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if .Values.devWorkspace.enabled }}
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: frontend
  {{- else }}
  type: {{ .Values.frontend.service.type | default "NodePort" }}
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      {{- if eq (.Values.frontend.service.type | default "NodePort") "NodePort" }}
      nodePort: {{ .Values.frontend.service.nodePort | default 30001 }}
      {{- end }}
  {{- end }}
{{- if .Values.devWorkspace.enabled }}
---
# Dev workspace Service — oauth2-proxy fronting code-server on the -dev subdomain.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-workspace
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
spec:
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
  ports:
    - name: http
      port: 80
      targetPort: proxy
{{- end }}
{{- if .Values.modules.coding.enabled }}
---
# Module Coding Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "druppie.fullname" . }}-module-coding
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-coding
spec:
  type: ClusterIP
  selector:
    {{- include "druppie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ if include "druppie.moduleEmbedded" (dict "root" . "mod" "coding") }}dev-workspace{{ else }}module-coding{{ end }}
  ports:
    - name: http
      port: {{ .Values.modules.coding.port }}
      targetPort: {{ if include "druppie.moduleEmbedded" (dict "root" . "mod" "coding") }}mcp-coding{{ else }}http{{ end }}
{{- end }}
