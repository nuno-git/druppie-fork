apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "druppie.fullname" . }}-gitea-init
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitea-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gitea-init
    spec:
      restartPolicy: Never
      containers:
        - name: gitea-init
          image: {{ .Values.gitea.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              {{- if .Values.cnpg.enabled }}
              value: "{{ include "druppie.fullname" . }}-gitea-db-rw:5432"
              {{- else }}
              value: "{{ include "druppie.fullname" . }}-gitea-db:5432"
              {{- end }}
            - name: GITEA__database__NAME
              value: {{ .Values.postgresql.gitea.database | quote }}
            - name: GITEA__database__USER
              value: {{ .Values.postgresql.gitea.username | quote }}
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: GITEA_DB_PASSWORD
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA_ADMIN_USER
              value: {{ .Values.gitea.adminUser | quote }}
            - name: GITEA_ADMIN_EMAIL
              value: {{ .Values.gitea.adminEmail | quote }}
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "druppie.fullname" . }}-secrets
                  key: GITEA_ADMIN_PASSWORD
            - name: GITEA_ORG
              value: {{ .Values.gitea.org | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for Gitea to be ready..."
              until wget -qO- http://{{ include "druppie.fullname" . }}-gitea:{{ .Values.gitea.httpPort }}/api/healthz >/dev/null 2>&1; do
                echo "Gitea not ready yet, retrying..."
                sleep 5
              done
              echo "Gitea is ready!"

              echo "Checking for existing admin user..."
              if gitea admin user list | grep -q "$GITEA_ADMIN_USER"; then
                echo "Admin user '$GITEA_ADMIN_USER' already exists"
              else
                echo "Creating admin user '$GITEA_ADMIN_USER'..."
                gitea admin user create \
                  --username "$GITEA_ADMIN_USER" \
                  --password "$GITEA_ADMIN_PASSWORD" \
                  --email "$GITEA_ADMIN_EMAIL" \
                  --admin --must-change-password=false
                echo "Admin user created."
              fi

              echo "Checking for organization '$GITEA_ORG'..."
              if gitea admin org list | grep -q "$GITEA_ORG"; then
                echo "Organization '$GITEA_ORG' already exists"
              else
                echo "Creating organization '$GITEA_ORG'..."
                gitea admin org create "$GITEA_ORG"
                echo "Organization created."
              fi

              echo "Gitea initialization complete."
          volumeMounts:
            - name: gitea-data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-gitea-data
