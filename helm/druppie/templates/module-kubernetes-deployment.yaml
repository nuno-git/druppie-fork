{{- if and .Values.modules.kubernetes.enabled (not (include "druppie.moduleEmbedded" (dict "root" . "mod" "kubernetes"))) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-kubernetes
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-kubernetes
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-kubernetes
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: {{ include "druppie.fullname" . }}-module-kubernetes
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerateGpu }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      {{- end }}
      containers:
        - name: module-kubernetes
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.kubernetes.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MCP_PORT
              value: {{ .Values.modules.kubernetes.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.kubernetes.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.kubernetes.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.kubernetes.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
{{- end }}
