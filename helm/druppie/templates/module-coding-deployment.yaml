{{- $dev := include "druppie.moduleDevMode" (dict "root" . "mod" "coding") -}}
{{- if .Values.modules.coding.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-coding
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-coding
spec:
  replicas: {{ .Values.modules.coding.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-coding
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-coding
        {{- if not .Values.persistence.rwx }}
        druppie.io/shared-storage: "true"
        {{- end }}
      annotations:
        reloader.stakater.com/auto: "true"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "druppie.fullname" . }}-module-coding
      {{- include "druppie.sharedStorageAffinity" . | nindent 6 }}
      initContainers:
        - name: wait-for-gitea
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -sf http://{{ include "druppie.fullname" . }}-gitea:3000/api/healthz; do
                echo "Waiting for gitea..."
                sleep 5
              done
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: module-coding
          {{- if $dev }}
          image: {{ include "druppie.moduleDevImage" (dict "root" . "image" .Values.modules.coding.image) }}
          imagePullPolicy: Always
          command:
            - bash
            - /scripts/module-dev-entrypoint.sh
            - "coding"
            - "module-coding"
            - {{ .Values.modules.coding.port | quote }}
          {{- else }}
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.coding.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- end }}
          env:
            - name: MCP_PORT
              value: {{ .Values.modules.coding.port | quote }}
            
          envFrom:
            - configMapRef:
                name: {{ include "druppie.fullname" . }}-config
            - secretRef:
                name: {{ include "druppie.fullname" . }}-secrets
            {{- if .Values.global.extraEnvFromSecret }}
            # Branch environments: Vault-sourced overrides (ESO-managed). Listed
            # last so its keys win; optional so pods start while it syncs.
            - secretRef:
                name: {{ .Values.global.extraEnvFromSecret }}
                optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.coding.port }}
              protocol: TCP
          volumeMounts:
            {{- if $dev }}
            - name: workspace-dev
              mountPath: /workspace
            - name: module-dev-entrypoint
              mountPath: /scripts
              readOnly: true
            {{- else }}
            - name: workspace
              mountPath: /workspaces
            {{- end }}
            {{- if .Values.prReview.caConfigMap }}
            # Private Waterschap CA (chain.pem) so the scheduled PR reviewer's
            # aigit HTTPS calls verify (PRREVIEW_SSL_CA_BUNDLE in the ConfigMap
            # points here). Same aigit-ca pattern module-deploy uses for GitOps.
            - name: prreview-ca
              mountPath: /etc/prreview-ca
              readOnly: true
            {{- end }}
          {{- if $dev }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.modules.coding.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: {{ .Values.modules.coding.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.coding.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.coding.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.modules.coding.resources | nindent 12 }}
      {{- with .Values.modules.coding.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      {{- end }}
      volumes:
        {{- if $dev }}
        - name: workspace-dev
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-workspace-dev
        - name: module-dev-entrypoint
          configMap:
            name: {{ include "druppie.fullname" . }}-module-dev-entrypoint
            defaultMode: 0755
        {{- else }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-workspace
        {{- end }}
        {{- if .Values.prReview.caConfigMap }}
        - name: prreview-ca
          configMap:
            name: {{ .Values.prReview.caConfigMap }}
        {{- end }}
{{- end }}
