{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: backend-llm
    creationPolicy: Owner
  data:
    - secretKey: ZAI_API_KEY
      remoteRef:
        key: backend/llm
        property: zai_api_key
    - secretKey: DEEPINFRA_API_KEY
      remoteRef:
        key: backend/llm
        property: deepinfra_api_key
    - secretKey: LLM_PROVIDER
      remoteRef:
        key: backend/llm
        property: llm_provider
{{- end }}
