{{- if .Values.global.ingress.enabled }}
# Main Ingress: frontend catch-all + /api backend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "druppie.fullname" . }}-main
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
  {{- if or .Values.global.ingress.annotations .Values.certManager.enabled (eq (.Values.global.ingress.className | default "nginx") "traefik") }}
  annotations:
    {{- if eq (.Values.global.ingress.className | default "nginx") "traefik" }}
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-treafik-default-headers@kubernetescrd
    {{- end }}
    {{- if .Values.certManager.enabled }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
    {{- with .Values.global.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className | default "nginx" }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.global.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          {{- if not .Values.global.subdomains.keycloak }}
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /js
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /welcome
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- if .Values.global.subdomains.keycloak }}
---
# Keycloak Ingress: dedicated subdomain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
  annotations:
    {{- if eq ( .Values.global.ingress.className | default "nginx" ) "nginx" }}
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    {{- end }}
    {{- if .Values.certManager.enabled }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
    {{- with .Values.global.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className | default "nginx" }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.subdomains.keycloak }}
      secretName: {{ include "druppie.fullname" . }}-auth-tls
  {{- end }}
  rules:
    - host: {{ .Values.global.subdomains.keycloak }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
{{- end }}
{{- if .Values.global.subdomains.gitea }}
---
# Gitea Ingress: dedicated subdomain (no path stripping needed)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "druppie.fullname" . }}-gitea
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
    {{- with .Values.global.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className | default "nginx" }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.subdomains.gitea }}
      secretName: {{ include "druppie.fullname" . }}-git-tls
  {{- end }}
  rules:
    - host: {{ .Values.global.subdomains.gitea }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-gitea
                port:
                  number: {{ .Values.gitea.httpPort }}
{{- else }}
---
# Gitea Ingress: path-based routing (fallback when no subdomain)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "druppie.fullname" . }}-gitea
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
  annotations:
    {{- if eq ( .Values.global.ingress.className | default "nginx" ) "nginx" }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- else if eq .Values.global.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "druppie.fullname" . }}-git-stripprefix@kubernetescrd
    {{- end }}
    {{- if .Values.certManager.enabled }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
    {{- with .Values.global.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className | default "nginx" }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.global.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          {{- if eq ( .Values.global.ingress.className | default "nginx" ) "nginx" }}
          - path: /git(/|$)(.*)
            pathType: ImplementationSpecific
          {{- else }}
          - path: /git
            pathType: Prefix
          {{- end }}
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-gitea
                port:
                  number: {{ .Values.gitea.httpPort }}
{{- end }}
{{- end }}
