{{- if .Values.global.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "druppie.fullname" . }}-main
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
  {{- with .Values.global.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className | default "nginx" }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.global.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          # Backend API — backend already has /api prefix on all routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          # Keycloak — serves its own paths natively (/realms, /resources, /admin, /js, /welcome)
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /js
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /welcome
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-keycloak
                port:
                  number: 8080
          # Frontend (catch-all — must be last)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
---
# Gitea needs path rewrite (/git/foo → /foo)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "druppie.fullname" . }}-gitea
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- with .Values.global.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className | default "nginx" }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.global.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /git(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "druppie.fullname" . }}-gitea
                port:
                  number: {{ .Values.gitea.httpPort }}
{{- end }}
