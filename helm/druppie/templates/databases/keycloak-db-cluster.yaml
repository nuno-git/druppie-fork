{{- if .Values.cnpg.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "druppie.fullname" . }}-keycloak-db
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
spec:
  instances: {{ .Values.cnpg.keycloak.instances | default 3 }}
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "100"
  storage:
    size: {{ .Values.cnpg.keycloak.storage | default "5Gi" }}
    {{- if .Values.persistence.storageClass }}
    storageClass: {{ .Values.persistence.storageClass | quote }}
    {{- end }}
  monitoring:
    enablePodMonitor: {{ .Values.cnpg.monitoring.enabled | default false }}
{{- end }}
