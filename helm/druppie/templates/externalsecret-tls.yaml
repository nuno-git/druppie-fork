{{- if .Values.externalSecrets.managed }}
# Mirrors the *.rijnland.dev wildcard TLS cert from the druppie namespace
# via the druppie-tls-mirror ClusterSecretStore (ESO kubernetes provider).
# The chart's own ingress templates reference druppie-tls by name.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: druppie-tls
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: druppie-tls-mirror
    kind: ClusterSecretStore
  target:
    name: druppie-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: druppie-tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: druppie-tls
        property: tls.key
{{- end }}
