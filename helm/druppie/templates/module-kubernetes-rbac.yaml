{{- if .Values.modules.kubernetes.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "druppie.fullname" . }}-module-kubernetes
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-kubernetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "druppie.fullname" . }}-kubernetes-readonly
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "druppie.fullname" . }}-kubernetes-readonly
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "druppie.fullname" . }}-kubernetes-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "druppie.fullname" . }}-module-kubernetes
    namespace: {{ .Release.Namespace }}
{{- end }}
