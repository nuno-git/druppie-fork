{{- if and .Values.devWorkspace.enabled .Values.devWorkspace.secretsSource }}
# Kubeconfig for read-only cluster access: sync from Vault into the namespace.
# Vault path: ai-team-k8s/kubernetes-access (property: kubeconfig)
# Mounted at /root/.kube/config in the workspace pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "druppie.fullname" . }}-kubeconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-workspace
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-ai-team-k8s
    kind: ClusterSecretStore
  target:
    name: {{ include "druppie.fullname" . }}-kubeconfig
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: kubeconfig
      remoteRef:
        key: kubernetes-access
        property: kubeconfig
{{- end }}