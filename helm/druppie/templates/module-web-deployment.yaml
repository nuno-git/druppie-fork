{{- if .Values.modules.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "druppie.fullname" . }}-module-web
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: module-web
spec:
  replicas: {{ .Values.modules.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "druppie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: module-web
  template:
    metadata:
      labels:
        {{- include "druppie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: module-web
    spec:
      containers:
        - name: module-web
          image: {{ include "druppie.image" (dict "Values" .Values "image" .Values.modules.web.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: SEARCH_ROOT
              value: "/dataset"
            - name: MCP_PORT
              value: {{ .Values.modules.web.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.modules.web.port }}
              protocol: TCP
          volumeMounts:
            - name: dataset
              mountPath: /dataset
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.web.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.modules.web.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.modules.web.resources | nindent 12 }}
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: {{ include "druppie.fullname" . }}-dataset
{{- end }}
