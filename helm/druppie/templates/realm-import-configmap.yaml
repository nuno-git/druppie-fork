{{- if .Values.keycloak.realmImport.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "druppie.fullname" . }}-realm-export
  labels:
    {{- include "druppie.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-realm
data:
  druppie-realm.json: |-
{{- $realm := .Files.Get "files/realm-export.json" | replace "__FRONTEND_URL__" (include "druppie.frontendExternalUrl" .) | replace "__GITEA_URL__" (include "druppie.giteaExternalUrl" .) -}}
{{- $realmJson := $realm | fromYaml -}}
{{- $attrs := merge (dict "frontendUrl" (printf "https://%s" .Values.global.domain)) $realmJson.attributes -}}
{{ merge (dict "attributes" $attrs) $realmJson | toJson | nindent 4 }}
{{- end }}
