      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
init:
  enabled: true
  image:
    repository: druppie-init
    tag: latest
sandbox:
  runtime: sysbox-runc
  image: druppie-sandbox:latest
  memoryLimit: 4g
  cpuLimit: '2'
sandboxImageBuilder:
  enabled: false
persistence:
  enabled: true
  storageClass: ''
  rwx: false
  workspace:
    size: 10Gi
  dataset:
    size: 5Gi
  sandboxBundles:
    size: 5Gi
nfs:
  enabled: false
  storageClassName: nfs-workspace
  storageClass: ''
  storageSize: 30Gi
  nodeSelector: {}
secrets:
  zaiApiKey: ''
  deepseekApiKey: ''
  deepinfraApiKey: ''
  foundryApiKey: ''
  internalApiKey: ''
  keycloakClientSecret: ''
  giteaToken: ''
  moduleApiToken: ''
  # Dedicated PR-review bot token (read + PR-comment). Empty = the module falls
  # back to EXTERNAL_GITEA_TOKEN. See templates/secrets.yaml.
  prreviewGiteaToken: ''
autoscaling:
  backend:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  frontend:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
keda:
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 300
  sslmode: disable
  backend:
    query: SELECT COUNT(*) FROM agent_runs WHERE status = 'running'
    targetQueryValue: '50'
    activationTargetQueryValue: '0'
cnpg:
  enabled: false
  monitoring:
    enabled: false
  druppie:
    instances: 3
    storage: 20Gi
  keycloak:
    instances: 3
    storage: 5Gi
  gitea:
    instances: 3
    storage: 5Gi
highAvailability:
  pdb:
    enabled: false
    minAvailable: 1
  antiAffinity:
    enabled: false
certManager:
  enabled: false
  email: ''
externalSecrets:
  enabled: false
  # When true, secrets are owned by ExternalSecrets (ai/k8s vault-eso layer) and
  # this chart's templates/secrets.yaml is NOT rendered — avoids a dual-owner
  # race where Helm and ESO both reconcile the same Secret. Prod/dev set this.
  managed: false
  vaultAddress: http://vault.vault.svc.cluster.local:8200
  vaultRole: external-secrets
  serviceAccount: external-secrets
agentSandbox:
  enabled: false
  coding:
    cpuLimit: '2'
    memoryLimit: 4Gi
    workspaceSize: 10Gi
  devEnv:
    workspaceSize: 20Gi
  warmPool:
    replicas: 5
# Scheduled PR-review agent (runs in the module-coding pod). Empty repos =
# disabled: no PRREVIEW_* config is rendered and cnp-module-coding-gitea is not
# created. Per-env values (repos, jobEnabled) are set in the ai/k8s HelmRelease.
prReview:
  # Space-separated Gitea repo allowlist, e.g. "ai/druppie". Empty = disabled.
  repos: ''
  maxPrsPerRun: 5
  maxDiffLines: 2000
  # Enables the pr_review_job cron for this environment (JOB_PR_REVIEW_JOB_ENABLED).
  jobEnabled: false
  # Optional cron override (JOB_PR_REVIEW_JOB_SCHEDULE); empty = job YAML default.
  jobSchedule: ''
  # Optional ConfigMap holding the private Waterschap CA (chain.pem) mounted into
  # module-coding so the reviewer's aigit HTTPS calls verify. Empty = system trust.
  caConfigMap: ''
