# Recovery mode: deploy workspace + Keycloak only (skip gitea, druppie-db, all modules)
recoveryMode: false

global:
  instance: druppie
  # Vault path segment for this environment (e.g. "colab-dev", "main").
  # Falls back to .instance if empty.
  vaultEnv: ''
  imagePullPolicy: IfNotPresent
  imageRegistry: ''
  imageTag: ''
  imagePullSecrets: []
  # Name of an extra Secret appended (optional: true) to envFrom on the backend
  # and secret-consuming modules, AFTER <instance>-secrets so its keys override
  # the chart defaults. Branch environments set this to their ESO-managed
  # Vault-sourced secret (see BranchEnvironmentService); leave empty otherwise.
  extraEnvFromSecret: ''
  domain: localhost
  subdomains:
    keycloak: ''
    gitea: ''
  ingress:
    enabled: true
    className: nginx
    port: 9080
    controllerNamespace: kube-system
    tls:
      enabled: false
      secretName: ''
    annotations: {}
postgresql:
  image: postgres:15-alpine
  druppie:
    database: druppie
    username: druppie
    # Empty by default: set explicitly or enable externalSecrets.managed (ESO).
    password: ""
    port: 5432
    storage: 5Gi
  keycloak:
    database: keycloak
    username: keycloak
    password: ""
    port: 5432
    storage: 5Gi
  gitea:
    database: gitea
    username: gitea
    password: ""
    port: 5432
    storage: 5Gi
keycloak:
  image: quay.io/keycloak/keycloak:24.0
  adminUser: admin
  adminPassword: ""
  hostname: ''
  nodePort: 8080
  service:
    type: NodePort
    nodePort: 30002
  replicaCount: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 2000m
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 15
  livenessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 90
    periodSeconds: 30
    failureThreshold: 10
  realmImport:
    enabled: true
  dbPersistent: true
gitea:
  image: gitea/gitea:1.21
  adminUser: gitea_admin
  adminPassword: ""
  adminEmail: admin@druppie.local
  org: druppie
  # External Gitea (aigit.waterschap.org) — used for CNP egress rules when
  # pods need to reach the corporate Gitea server. The IP is a fallback for
  # Cilium's FQDN matching (DNS proxy dependency). Update if Gitea moves.
  external:
    url: "https://aigit.waterschap.org"
    ip: "10.23.0.101"
  sshPort: 2222
  httpPort: 3000
  nodePort: 3000
  service:
    type: NodePort
    nodePort: 30003
  storage: 5Gi
  replicaCount: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m
backend:
  image:
    repository: druppie-backend
    tag: latest
  port: 8000
  nodePort: 8000
  service:
    type: NodePort
    nodePort: 30000
  replicaCount: 1
  nodeSelector: {}
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 2000m
  devMode: false
  dockerSocket:
    enabled: false
  serviceAccount:
    create: true
    name: ''
  # Branch-environments deployer (GitOps). When enabled, the backend commits
  # per-env manifest directories to <gitops.repo>/<gitops.path> via the Gitea
  # API and FluxCD (Kustomization/branch-envs in that repo) does the actual
  # deploys/teardowns. The backend itself only needs read-only cluster access
  # for status (see templates/branch-env-deployer-rbac.yaml). Safe to enable
  # on multiple instances: git arbitrates concurrent writes.
  branchEnvDeployer:
    enabled: false
    gitops:
      url: https://aigit.waterschap.org
      repo: ai/k8s
      branch: main
      path: clusters/branch-envs
      chartRepoUrl: https://aigit.waterschap.org/ai/druppie.git
      # Secret holding a Gitea token (key below) with push access to the GitOps repo.
      tokenSecret:
        name: druppie-branch-env-git
        key: token
      # Optional ConfigMap (key chain.pem) with the private CA of the Gitea
      # server; mounted and used for TLS verification when set.
      caConfigMap: ''
    # Node pin for branch envs (RWO PVC co-location) + image source + domain.
    node: ka-k8s-ai-workers-skbh7-d4qwl
    registry: harbor.rijnland.dev/druppie
    domainSuffix: rijnland.dev
    # Optional per-env dev workspace (code-server behind a Keycloak oauth2-proxy),
    # committed as workspace.yaml when enabled from the UI. It is served at
    # druppie-<slug>-dev.<domainSuffix> and authenticates against the env's own
    # Keycloak realm 'druppie' (issuer https://druppie-<slug>.<domainSuffix>/realms/druppie).
    # REQUIRED one-time cluster-side setup (the backend creates neither; see
    # docs/FEATURES.md "Dev Workspace"):
    #   1. Vault secret 'branch-env/workspace-oauth' (in the vault-ai-team-k8s
    #      store's KV mount) with keys client-secret + cookie-secret. The env's
    #      workspace.yaml ExternalSecret mirrors it into the 'workspace-oauth' Secret.
    #   2. A confidential Keycloak client 'workspace' per environment, redirect URI
    #      https://druppie-<slug>-dev.<domainSuffix>/oauth2/callback, whose secret
    #      matches Vault branch-env/workspace-oauth#client-secret.
    # Overridable via env on the backend: BRANCH_ENV_WORKSPACE_IMAGE,
    # BRANCH_ENV_OAUTH2_PROXY_IMAGE, BRANCH_ENV_WORKSPACE_STORAGE_CLASS.
  llm:
    provider: zai
    forceProvider: ''
    forceModel: ''
  zai:
    model: glm-4.7
    baseUrl: https://api.z.ai/api/coding/paas/v4
  deepseek:
    model: deepseek-chat
    baseUrl: https://api.deepseek.com/v1
  deepinfra:
    model: Qwen/Qwen3-32B
    baseUrl: https://api.deepinfra.com/v1
  # LLMKube / in-cluster vLLM (OpenAI-compatible, no API key required).
  # Points to the model router which handles all models and auto-switches modes.
  llmkube:
    model: qwen3.6-27b
    baseUrl: http://model-server.llm.svc.cluster.local:8001/v1
  foundry:
    model: GPT-5-MINI
    apiUrl: ''
frontend:
  image:
    repository: druppie-frontend
    tag: latest
  port: 5173
  nodePort: 5173
  service:
    type: NodePort
    nodePort: 30001
  replicaCount: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 1000m
  vite:
    keycloakRealm: druppie
    keycloakClientId: druppie-frontend
# Dev workspace — when enabled, a single pod (code-server + hot-reload backend
# via `uvicorn --reload` + Vite HMR frontend + optional desktop) REPLACES the
# baked backend/frontend Deployments. The existing <instance>-backend and
# <instance>-frontend Services are repointed at this pod, so the branch
# namespace has exactly one backend and one frontend — and they hot-reload.
#
# stackMode:
#   real      = backend consumes the deployed Keycloak/Postgres/MCP (prod-parity)
#   degraded  = SQLite + mock auth (fast, offline-friendly). Default; intended as
#               the future default selectable at dev-env creation time.
#
# Branch environments set enabled:true + stackMode:real. Prod/colab-dev leave
# this disabled and keep the baked backend/frontend.
devWorkspace:
  enabled: false
  stackMode: degraded
  # embedModules: list of MCP module keys that should run from source on the
  # workspace PVC (uvicorn --reload, hot-reload on edit) instead of as
  # baked-image Deployments. When a module is listed here AND
  # devWorkspace.enabled=true, its Deployment pod uses the dev-workspace image,
  # mounts the workspace-dev PVC at /workspace, and runs the
  # module-dev-entrypoint.sh script which seeds a venv and launches uvicorn.
  # All modules always run as separate pods — none are embedded in the
  # workspace container.
  # Valid keys: coding docker filesearch web archimate registry llm kubernetes
  #   vision searxng browser data_access azuredevops
  embedModules: []
  # secretsSource: Vault path prefix for env secrets. Accepted values:
  #   "colab-dev" → druppie/colab-dev/*  (shared LLM keys, etc.)
  #   "robbe"     → druppie/developers/robbe/*
  #   "nuno"      → druppie/developers/nuno/*
  #   <custom>    → druppie/developers/<custom>/*
  # When set, the chart renders ExternalSecrets that sync
  # database/keycloak/gitea/app/workspace into the namespace. Leave empty to
  # skip ExternalSecrets (no secrets — the env won't start without them).
  secretsSource: ""
  developer: ""
  image:
    repository: dev-workspace
    # When empty, falls back to global.imageTag then "latest". CI sets this
    # to the deploy tag only when Dockerfile.dev-workspace changes — so
    # code-only pushes don't trigger a workspace restart.
    tag: ""
  imagePullPolicy: Always
  gitBranch: ""                       # DRUPPIE_GIT_BRANCH (set per branch)
  repoUrl: https://aigit.waterschap.org/ai/druppie.git
  gitSslNoVerify: true
  # Optional K8s Secret (with key git-token) injected as DRUPPIE_GIT_TOKEN.
  gitTokenSecret: {}                  # {name: ..., key: git-token}
  # Optional ConfigMap containing the corporate CA chain (key: chain.pem).
  # When set, the workspace pod mounts it and sets CURL_CA_BUNDLE / SSL_CERT_FILE
  # so curl, httpx, and other tools can reach aigit.waterschap.org without
  # --insecure / GIT_SSL_NO_VERIFY.
  caConfigMap: ""
  desktop:
    enabled: true
  workspace:
    size: 20Gi
    # Empty → resolved by the template via the persistence.storageClass helper
    # (same as all other PVCs). Set explicitly only to override.
    storageClassName: ""
  nodeSelector: {}
  # Traefik ingress controller's in-cluster ClusterIP (e.g. the rke2-traefik-lb
  # service ClusterIP). When set, a hostAlias maps global.domain to it so the pod
  # reaches Keycloak (OIDC discovery/token redeem) via the public hostname but on
  # the internal IP — pods can't hairpin to the LoadBalancer external IP, and
  # KC_HOSTNAME_STRICT rejects any other Host header.
  ingressVIP: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 6Gi
  # code-server IDE is exposed on its own -dev subdomain behind oauth2-proxy.
  codeServer:
    devHost: ""                       # e.g. druppie-<slug>-dev.rijnland.dev
    tlsSecretName: druppie-tls
  oauth:
    clientId: workspace
    issuerUrl: ""                     # e.g. https://druppie-<slug>.rijnland.dev/realms/druppie
    # oauth2-proxy client/cookie secrets are sourced from Vault via ESO
    # (keys: client-secret, cookie-secret) into this Secret.
    externalSecret:
      enabled: true
      storeRef:
        name: vault-ai-team-k8s
        kind: ClusterSecretStore
      vaultKey: branch-env/workspace-oauth
      secretName: workspace-oauth
modules:
  coding:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-coding
      tag: latest
    port: 9001
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 2Gi
        cpu: 2000m
  docker:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-deploy
      tag: latest
    port: 9002
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 2Gi
        cpu: 2000m
    # User-application GitOps deployer. module-deploy deploys user apps by
    # committing a Flux GitRepository+HelmRelease to the GitOps repo
    # (clusters/user-apps/<slug>/); Flux reconciles. The module only needs
    # a Gitea token (push to ai/k8s) + read-only cluster access for status.
    userApps:
      gitops:
        url: https://aigit.waterschap.org
        repo: ai/k8s
        branch: main
        path: clusters/user-apps
        appRepoOrg: ai
        # Secret holding a Gitea token (key below) with push to the GitOps repo.
        # Reuses the ci/gitea token (same as the branch-env deployer).
        tokenSecret:
          name: druppie-branch-env-git
          key: token
        caConfigMap: ''
      domain: rijnland.dev   # host scheme: <slug>-apps.<domain> (covered by *.<domain> cert)
      harbor:
        registry: harbor.rijnland.dev
        project: druppie
  filesearch:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-filesearch
      tag: latest
    port: 9004
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  web:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-web
      tag: latest
    port: 9005
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  searxng:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-searxng
      tag: latest
    port: 9014
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  browser:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-browser
      tag: latest
    port: 9015
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 1000m
  archimate:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-archimate
      tag: latest
    port: 9006
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  registry:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-registry
      tag: latest
    port: 9007
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  llm:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-llm
      tag: latest
    port: 9008
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  kubernetes:
    enabled: true
    image:
      repository: druppie-module-kubernetes
      tag: latest
    port: 9013
  vision:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-vision
      tag: latest
    port: 9011
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  data_access:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-data-access
      tag: latest
    port: 9010
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  layout_service:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-layout-service
      tag: latest
    port: 8090
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 500m
  azuredevops:
    enabled: false
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-azuredevops
      tag: latest
    port: 9012
