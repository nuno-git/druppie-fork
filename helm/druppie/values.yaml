global:
  instance: druppie
  imagePullPolicy: IfNotPresent
  imageRegistry: ''
  imageTag: ''
  imagePullSecrets: []
  domain: localhost
  subdomains:
    keycloak: ''
    gitea: ''
  ingress:
    enabled: true
    className: nginx
    port: 9080
    controllerNamespace: kube-system
    tls:
      enabled: false
      secretName: ''
    annotations: {}
postgresql:
  image: postgres:15-alpine
  druppie:
    database: druppie
    username: druppie
    password: druppie_secret
    port: 5432
    storage: 5Gi
  keycloak:
    database: keycloak
    username: keycloak
    password: keycloak_secret
    port: 5432
    storage: 5Gi
  gitea:
    database: gitea
    username: gitea
    password: gitea_secret
    port: 5432
    storage: 5Gi
keycloak:
  image: quay.io/keycloak/keycloak:24.0
  adminUser: admin
  adminPassword: admin
  hostname: ''
  nodePort: 8080
  service:
    type: NodePort
    nodePort: 30002
  replicaCount: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 2000m
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 15
  livenessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 90
    periodSeconds: 30
    failureThreshold: 10
  realmImport:
    enabled: true
  dbPersistent: true
gitea:
  image: gitea/gitea:1.21
  adminUser: gitea_admin
  adminPassword: GiteaAdmin123
  adminEmail: admin@druppie.local
  org: druppie
  sshPort: 2222
  httpPort: 3000
  nodePort: 3000
  service:
    type: NodePort
    nodePort: 30003
  storage: 5Gi
  replicaCount: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m
backend:
  image:
    repository: druppie-backend
    tag: latest
  port: 8000
  nodePort: 8000
  service:
    type: NodePort
    nodePort: 30000
  replicaCount: 1
  nodeSelector: {}
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 2000m
  devMode: false
  dockerSocket:
    enabled: false
  serviceAccount:
    create: true
    name: ''
  guacamoleUrl: http://guacamole.remote-access.svc.cluster.local:8080
  guacamolePublicUrl: http://localhost:30020
  llm:
    provider: zai
    forceProvider: ''
    forceModel: ''
  zai:
    model: glm-4.7
    baseUrl: https://api.z.ai/api/coding/paas/v4
  deepseek:
    model: deepseek-chat
    baseUrl: https://api.deepseek.com/v1
  deepinfra:
    model: Qwen/Qwen3-32B
    baseUrl: https://api.deepinfra.com/v1
  foundry:
    model: GPT-5-MINI
    apiUrl: ''
  github:
    appId: ''
    appPrivateKeyPath: ''
    appInstallationId: ''
    repoOwner: ''
    repoName: ''
frontend:
  image:
    repository: druppie-frontend
    tag: latest
  port: 5173
  nodePort: 5173
  service:
    type: NodePort
    nodePort: 30001
  replicaCount: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 1000m
  vite:
    keycloakRealm: druppie
    keycloakClientId: druppie-frontend
modules:
  coding:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-coding
      tag: latest
    port: 9001
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 2Gi
        cpu: 2000m
  docker:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-docker
      tag: latest
    port: 9002
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 2Gi
        cpu: 2000m
  filesearch:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-filesearch
      tag: latest
    port: 9004
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  web:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-web
      tag: latest
    port: 9005
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  archimate:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-archimate
      tag: latest
    port: 9006
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  registry:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-registry
      tag: latest
    port: 9007
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  llm:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-llm
      tag: latest
    port: 9008
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  kubernetes:
    enabled: true
    image:
      repository: druppie-module-kubernetes
      tag: latest
    port: 9013
  vision:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-module-vision
      tag: latest
    port: 9011
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  data_access:
    enabled: true
    replicaCount: 1
    nodeSelector: {}
    image:
      repository: druppie-module-data-access
      tag: latest
    port: 9010
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1000m
  layout_service:
    enabled: true
    replicaCount: 1
    image:
      repository: druppie-layout-service
      tag: latest
    port: 8090
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 500m
init:
  enabled: true
  image:
    repository: druppie-init
    tag: latest
sandbox:
  runtime: sysbox-runc
  image: druppie-sandbox:latest
  memoryLimit: 4g
  cpuLimit: '2'
sandboxImageBuilder:
  enabled: false
persistence:
  enabled: true
  storageClass: ''
  rwx: false
  workspace:
    size: 10Gi
  dataset:
    size: 5Gi
  sandboxBundles:
    size: 5Gi
nfs:
  enabled: false
  storageClassName: nfs-workspace
  storageClass: ''
  storageSize: 30Gi
  nodeSelector: {}
secrets:
  zaiApiKey: ''
  deepseekApiKey: ''
  deepinfraApiKey: ''
  foundryApiKey: ''
  internalApiKey: druppie-internal-secret-key
  keycloakClientSecret: ''
  giteaClientSecret: ''
  giteaSecretKey: ''
  giteaToken: ''
  moduleApiToken: ''
  githubAppPrivateKey: ''
autoscaling:
  backend:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  frontend:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
keda:
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 300
  sslmode: disable
  backend:
    query: SELECT COUNT(*) FROM agent_runs WHERE status = 'running'
    targetQueryValue: '50'
    activationTargetQueryValue: '0'
cnpg:
  enabled: false
  monitoring:
    enabled: false
  druppie:
    instances: 3
    storage: 20Gi
  keycloak:
    instances: 3
    storage: 5Gi
  gitea:
    instances: 3
    storage: 5Gi
highAvailability:
  pdb:
    enabled: false
    minAvailable: 1
  antiAffinity:
    enabled: false
certManager:
  enabled: false
  email: ''
externalSecrets:
  enabled: false
  vaultAddress: http://vault.vault.svc.cluster.local:8200
  vaultRole: external-secrets
  serviceAccount: external-secrets
agentSandbox:
  enabled: false
  coding:
    cpuLimit: '2'
    memoryLimit: 4Gi
    workspaceSize: 10Gi
  devEnv:
    workspaceSize: 20Gi
  warmPool:
    replicas: 5
