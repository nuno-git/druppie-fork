# Default values for druppie-secrets.
# These must be overridden per-environment (same values as the main chart's
# externalSecrets.*, global.vaultEnv, devWorkspace.secretsSource, etc.).
global:
  vaultEnv: ""
  instance: ""
  caChain: ""
externalSecrets:
  managed: true
devWorkspace:
  secretsSource: ""
  enabled: false
modules:
  docker:
    userApps:
      gitops:
        tokenSecret:
          name: ""
          key: token
