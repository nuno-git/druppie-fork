# LLM Profiles — shared provider chains for agents.
#
# Each profile is an ordered list of {provider, model} entries.
# The resolver picks the first entry whose API key is available,
# and optionally sets up the second as a FallbackLLM.
#
# Agents reference a profile by name in their YAML: llm_profile: standard

profiles:
  standard:
    - provider: zai
      model: glm-5
    - provider: zai
      model: glm-4.7
    - provider: deepinfra
      model: deepseek-ai/DeepSeek-V4-Flash
    - provider: ollama
      model: gpt-oss:120b
    - provider: azure_foundry
      model: GPT-5-MINI
      reasoning_effort: low

  cheap:
    - provider: zai
      model: glm-5
    - provider: zai
      model: glm-4.7
    - provider: deepinfra
      model: deepseek-ai/DeepSeek-V4-Flash
    - provider: ollama
      model: gpt-oss:20b
    - provider: azure_foundry
      model: GPT-5-MINI
      reasoning_effort: low


  ollama:
    - provider: ollama
      model: gpt-oss:120b
    - provider: ollama
      model: gpt-oss:20b
    - provider: ollama
      model: qwen3-coder:30b
    - provider: ollama
      model: deepseek-r1:32b
    - provider: ollama
      model: gemma3:27b

  # In-cluster LLMKube/vLLM via model router (OpenAI-compatible, no API key required).
  # The router auto-switches between modes: DeepSeek (TP=2) or Qwen (27B+35B).
  # DeepSeek is first (primary), Qwen 35B is fallback, Qwen 27B is last resort.
  llmkube:
    - provider: llmkube
      model: deepseek-v4-flash
    - provider: llmkube
      model: qwen3.6-35b-a3b
    - provider: llmkube
      model: qwen3.6-27b
