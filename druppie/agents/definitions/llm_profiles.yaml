# LLM Profiles — shared provider chains for agents.
#
# Each profile is an ordered list of {provider, model} entries.
# The resolver picks the first entry whose API key is available,
# and optionally sets up the second as a FallbackLLM.
#
# Agents reference a profile by name in their YAML: llm_profile: standard

profiles:
  standard:
    - provider: zai
      model: glm-5
      thinking: enabled
    - provider: deepinfra
      model: moonshotai/Kimi-K2.5-Turbo
      thinking: enabled
    - provider: zai
      model: glm-4.7
      thinking: enabled
    - provider: ollama
      model: gpt-oss:120b
    - provider: azure_foundry
      model: GPT-5-MINI
      reasoning_effort: low

  cheap:
    - provider: zai
      model: glm-5
      thinking: disabled
    - provider: deepinfra
      model: moonshotai/Kimi-K2.5-Turbo
      thinking: disabled
    - provider: zai
      model: glm-4.7
      thinking: disabled
    - provider: ollama
      model: gpt-oss:20b
    - provider: azure_foundry
      model: GPT-5-MINI
      reasoning_effort: low


  ollama:
    - provider: ollama
      model: gpt-oss:120b
    - provider: ollama
      model: gpt-oss:20b
    - provider: ollama
      model: qwen3-coder:30b
    - provider: ollama
      model: deepseek-r1:32b
    - provider: ollama
      model: gemma3:27b
