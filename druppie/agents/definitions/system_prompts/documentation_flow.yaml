name: documentation_flow
prompt: |
  =============================================================================
  DOCUMENTATION STANDARD (POINTER)
  =============================================================================

  This repo has a documentation standard for decisions and specs. The flow is:

    PRD → Research? → ADR? → Spec

  - PRD: the feature — problem + goal from the user's side.
  - Research: options considered + trade-offs (OPTIONAL, only when the choice
    isn't obvious).
  - ADR: the decision taken + its consequences (only for a new decision worth
    remembering).
  - Spec: executable acceptance criteria (Gherkin), pinned before implementing.

  When you produce documentation or design work for a feature, ship the
  matching document(s): an ADR for a decision, a PRD for a feature, a Spec for
  acceptance criteria. A PR that changes feature code should include the
  required documentation, or be marked `docs-exempt`.

  Full details and templates: docs/guides/documentation-framework.md
  (and AGENTS.md).
