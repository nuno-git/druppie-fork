# MCP Server Configuration
# Defines all MCPs, their URLs, and tool approval requirements
#
# LAYERED APPROVAL SYSTEM (per goal.md):
# - This file defines GLOBAL DEFAULTS for all agents
# - Agents can OVERRIDE these defaults in their YAML files via approval_overrides
# - Use "required_role" (singular string) instead of "required_roles" (array)
# - danger_level has been removed (was never used)
#
# Example override in agent YAML:
#   approval_overrides:
#     coding:write_file:
#       requires_approval: true
#       required_role: architect

mcps:
  coding:
    url: ${MCP_CODING_URL:-http://module-coding:9001}
    type: core
    # Declarative injection rules - auto-inject these params from context
    # Parameters marked hidden: true are removed from LLM-visible schemas
    inject:
      session_id:
        from: session.id
        hidden: true
        # Not injected into project discovery tools (list_projects, read_project_file, list_project_files)
        # — those use Gitea API directly, not workspaces
        tools: [read_file, write_file, edit_file, bash, grep, find, ls, list_dir, batch_write_files, delete_file, make_design, push_changes, create_pr, git_fetch, git_pull, run_tests, get_test_framework, get_coverage_report, install_test_dependencies, validate_tdd, get_git_status, get_file_info, search_files]
      project_id:
        from: project.id
        hidden: true
        tools: [read_file, write_file, edit_file, bash, grep, find, ls, list_dir, batch_write_files, delete_file, make_design, push_changes, create_pr, git_fetch, git_pull, run_tests, get_test_framework, get_coverage_report, install_test_dependencies, validate_tdd, get_git_status, get_file_info, search_files]
      repo_name:
        from: project.repo_name
        hidden: true
        tools: [read_file, write_file, edit_file, bash, grep, find, ls, list_dir, batch_write_files, delete_file, make_design, push_changes, create_pr, git_fetch, git_pull, get_file_info, search_files]
      repo_owner:
        from: project.repo_owner
        hidden: true
        tools: [read_file, write_file, edit_file, bash, grep, find, ls, list_dir, batch_write_files, delete_file, make_design, push_changes, create_pr, git_fetch, git_pull, get_file_info, search_files]
      git_scope:
        from: agent.git_scope
        hidden: true
        tools: [read_file, write_file, edit_file, bash, grep, find, ls, list_dir, batch_write_files, delete_file, make_design, push_changes, create_pr, git_fetch, git_pull, run_tests, get_test_framework, get_coverage_report, install_test_dependencies, validate_tdd, get_git_status, get_file_info, search_files]
      sandbox_networks:
        from: agent.coding_networks
        hidden: true
        tools: [read_file, write_file, edit_file, bash, grep, find, ls, list_dir, batch_write_files, delete_file, make_design, push_changes, create_pr, git_fetch, git_pull, run_tests, get_test_framework, get_coverage_report, install_test_dependencies, validate_tdd, get_git_status, get_file_info, search_files]
    tools:
      - name: read_file
        requires_approval: false

      - name: write_file
        # DEFAULT: No approval needed for write_file
        # Agents can OVERRIDE this (e.g., architect requires architect approval)
        requires_approval: false

      - name: make_design
        requires_approval: false

      - name: batch_write_files
        # DEFAULT: No approval needed for batch writes
        # Agents can OVERRIDE this (e.g., architect requires architect approval)
        requires_approval: false

      - name: list_dir
        requires_approval: false

      - name: delete_file
        requires_approval: false

      - name: run_tests
        requires_approval: false

      - name: get_test_framework
        requires_approval: false

      - name: get_coverage_report
        requires_approval: false

      - name: push_changes, create_pr
        requires_approval: false

      - name: git_fetch
        requires_approval: false

      - name: git_pull
        requires_approval: false

      - name: install_test_dependencies
        requires_approval: false

      - name: validate_tdd
        requires_approval: false

      - name: get_git_status
        requires_approval: false

      - name: bash
        # Shell command execution — agents can run commands directly
        requires_approval: false

      - name: edit_file
        # Precise search-and-replace edits — lower risk than full write_file
        requires_approval: false

      - name: grep
        requires_approval: false

      - name: find
        requires_approval: false

      - name: ls
        requires_approval: false

      - name: get_file_info
        requires_approval: false

      - name: search_files
        requires_approval: false

      # Project discovery tools (cross-project read-only via Gitea API)
      - name: list_projects
        requires_approval: false
      - name: read_project_file
        requires_approval: false
      - name: list_project_files
        requires_approval: false

      # Scheduled PR review (fixed Gitea repo allowlist via PRREVIEW_REPOS).
      # Instance/token/allowlist are server-side config, never tool arguments.
      # Dedup is decided in code (head SHA vs sticky-comment marker) and
      # post_pr_review edits one sticky comment per PR, so reviews never
      # stack. Ungated: they run from a scheduled job with no session owner.
      - name: list_prs_needing_review
        requires_approval: false
      - name: get_pr_diff
        requires_approval: false
      - name: post_pr_review
        requires_approval: false

      # Internal tools (not visible to agents, callable by backend)
      - name: validate_design
        requires_approval: false
      - name: _internal_revert_to_commit
        requires_approval: false
      - name: _internal_close_pull_request
        requires_approval: false

  deploy:
    url: ${MCP_DEPLOY_URL:-http://module-deploy:9002}
    type: core
    # Declarative injection rules for deploy MCP
    inject:
      session_id:
        from: session.id
        hidden: true
        tools: [build, deploy]
      repo_name:
        from: project.repo_name
        hidden: true
        tools: [build, deploy]
      repo_owner:
        from: project.repo_owner
        hidden: true
        tools: [build, deploy]
      user_id:
        from: session.user_id
        hidden: true
        tools: [deploy]
      project_id:
        from: session.project_id
        hidden: true
        tools: [deploy]
    tools:
      - name: build
        requires_approval: true
        required_role: developer

      - name: deploy
        requires_approval: true
        required_role: developer

      - name: teardown
        requires_approval: true
        required_role: developer

      - name: stop
        requires_approval: false

      - name: logs
        requires_approval: false

      - name: list_apps
        requires_approval: false

      - name: inspect
        requires_approval: false

  # NOTE: HITL tools (hitl_ask_question, hitl_ask_multiple_choice_question) are
  # builtin tools defined in druppie/agents/builtin_tools.py, NOT an MCP server.
  # There is no HITL module — HITL is handled entirely in-process because it
  # needs to pause/resume the agent loop directly.

  filesearch:
    url: ${MCP_FILESEARCH_URL:-http://module-filesearch:9004}
    type: core
    tools:
      - name: search_files
        requires_approval: false
      - name: list_directory
        requires_approval: false
      - name: read_file
        requires_approval: false
      - name: get_search_stats
        requires_approval: false

  web:
    url: ${MCP_WEB_URL:-http://module-web:9005}
    type: both
    tools:
      - name: search_files
        requires_approval: false

      - name: list_directory
        requires_approval: false

      - name: read_file
        requires_approval: false

      - name: fetch_url
        requires_approval: false

      - name: get_page_info
        requires_approval: false

  # Privacy-friendly web search via a self-hosted SearXNG instance (engine
  # deployed at ai/k8s clusters/ka-k8s-ai/infra/searxng). The module is a
  # thin client over SearXNG's /search JSON API.
  searxng:
    url: ${MCP_SEARXNG_URL:-http://module-searxng:9014}
    type: module
    tools:
      - name: search
        requires_approval: false

      - name: fetch
        requires_approval: false

  # Headless Chromium automation (Playwright). Lets agents navigate and
  # interact with JS-rendered pages (booking engines, SPAs, dashboards) that
  # searxng_fetch cannot read (httpx runs no JS). Single shared browser
  # session per module instance — see module.py.
  browser:
    url: ${MCP_BROWSER_URL:-http://module-browser:9015}
    type: module
    tools:
      - name: navigate
        requires_approval: false
      - name: click
        requires_approval: false
      - name: type
        requires_approval: false
      - name: select_option
        requires_approval: false
      - name: press_key
        requires_approval: false
      - name: get_text
        requires_approval: false
      - name: get_html
        requires_approval: false
      - name: snapshot
        requires_approval: false
      - name: screenshot
        requires_approval: false
      - name: wait_for
        requires_approval: false
      - name: evaluate
        requires_approval: false
      - name: go_back
        requires_approval: false
      - name: get_url_title
        requires_approval: false
      - name: close
        requires_approval: false

  archimate:
    url: ${MCP_ARCHIMATE_URL:-http://module-archimate:9006}
    type: core
    # Write-tools operate on per-project archimate files in the session workspace.
    # Inject session_id so the MCP can resolve the workspace path.
    inject:
      session_id:
        from: session.id
        hidden: true
        tools:
          - create_element
          - update_element
          - delete_element
          - create_relationship
          - update_relationship
          - delete_relationship
          - add_to_view
          - add_connection_to_view
          - remove_from_view
          - get_or_create_wilma_reference
          - save_model
          - request_full_relayout
          - assess_layout
          - validate_view
          - add_layered_view
          - add_cooperation_view
    tools:
      # --- Read-only WILMA reference tools ---
      - name: list_models
        requires_approval: false

      - name: get_statistics
        requires_approval: false

      - name: list_elements
        requires_approval: false

      - name: get_element
        requires_approval: false

      - name: list_views
        requires_approval: false

      - name: get_view
        requires_approval: false

      - name: search_model
        requires_approval: false

      - name: get_impact
        requires_approval: false

      # --- Read-only introspection on project model ---
      - name: assess_layout
        requires_approval: false

      - name: validate_view
        requires_approval: false

      # --- Composite viewpoint builders ---
      # One call builds a whole view (elements + relationships + add_to_view +
      # add_connection_to_view). Ungated like the underlying primitives —
      # the architect's review point is the TD itself.
      - name: add_layered_view
        requires_approval: false

      - name: add_cooperation_view
        requires_approval: false

      # --- WRITE tools on per-project architecture.archimate ---
      # Intentionally UNGATED. The architect builds up the plate freely
      # (create_*, add_*, save_model). The single human review point is
      # the coding:make_design gate on docs/technical-design.md — at
      # that moment the reviewer sees the markdown + the embedded
      # ```archimate block that renders the just-saved view. Approving
      # one MCP call at a time is meaningless because the reviewer
      # cannot visualise the cumulative result; approving the TD shows
      # the plate inline.
      - name: create_element
        requires_approval: false

      - name: update_element
        requires_approval: false

      - name: delete_element
        requires_approval: false

      - name: create_relationship
        requires_approval: false

      - name: update_relationship
        requires_approval: false

      - name: delete_relationship
        requires_approval: false

      - name: add_to_view
        requires_approval: false

      - name: add_connection_to_view
        requires_approval: false

      - name: remove_from_view
        requires_approval: false

      - name: get_or_create_wilma_reference
        requires_approval: false

      - name: save_model
        requires_approval: false

      - name: request_full_relayout
        requires_approval: false

  llm:
    url: ${MCP_LLM_URL:-http://module-llm:9008}
    type: both
    tools:
      - name: chat
        requires_approval: false
      - name: embed
        requires_approval: false

  vision:
    url: ${MCP_VISION_URL:-http://module-vision:9011}
    type: module
    tools:
      - name: ocr
        requires_approval: false
      - name: analyze
        requires_approval: false

  registry:
    url: ${MCP_REGISTRY_URL:-http://module-registry:9007}
    type: core
    tools:
      - name: list_modules
        requires_approval: false

      - name: get_module
        requires_approval: false

      - name: search_modules
        requires_approval: false

      - name: list_components
        requires_approval: false

      - name: get_agent
        requires_approval: false

      - name: get_skill
        requires_approval: false

  dataaccess:
    url: ${MCP_DATA_ACCESS_URL:-http://module-data-access:9010}
    type: module
    entra_scope: "https://database.windows.net/.default"
    inject:
      session_id:
        from: session.id
        hidden: true
        tools: [download_data]
      project_id:
        from: project.id
        hidden: true
        tools: [download_data]
      user_token:
        from: user.entra_token
        hidden: true
        tools: [test_connection, list_available_data, get_schema, read_data, execute_query, download_data, create_chart_from_source]
    tools:
      - name: list_sources
        requires_approval: false

      - name: test_connection
        requires_approval: false

      - name: list_available_data
        requires_approval: false

      - name: get_schema
        requires_approval: false

      - name: read_data
        requires_approval: false

      - name: execute_query
        requires_approval: false

      - name: download_data
        requires_approval: false

      - name: create_chart
        requires_approval: false

      - name: create_chart_from_source
        requires_approval: false

  # Kubernetes cluster status — read-only introspection.
  # No write/delete/scale/exec operations. Uses a ServiceAccount with
  # get+list+watch-only ClusterRole when running in-cluster.
  kubernetes:
    url: ${MCP_KUBERNETES_URL:-http://module-kubernetes:9013}
    type: module
    tools:
      - name: list_pods
        requires_approval: false
      - name: list_nodes
        requires_approval: false
      - name: list_services
        requires_approval: false
      - name: get_cluster_health
        requires_approval: false

  # Azure DevOps backlog for ONE configured project (AZURE_DEVOPS_PROJECT).
  # No cross-project access — the project is fixed server-side.
  # Write tools require session_owner approval (the user who started the chat).
  azuredevops:
    url: ${MCP_AZUREDEVOPS_URL:-http://module-azuredevops:9012}
    type: module
    entra_scope: "499b84ac-1321-427f-aa17-267ca6975798/.default"
    inject:
      user_token:
        from: user.entra_token
        hidden: true
        tools: [list_backlog_items, get_work_item, search_work_items, get_current_sprint, get_sprint_summary, get_work_item_comments, add_work_item_comment, create_work_item, update_work_item]
    tools:
      - name: list_backlog_items
        requires_approval: false
      - name: get_work_item
        requires_approval: false
      - name: search_work_items
        requires_approval: false
      - name: get_current_sprint
        requires_approval: false
      - name: get_sprint_summary
        requires_approval: false
      - name: get_work_item_comments
        requires_approval: false
      - name: add_work_item_comment
        requires_approval: true
        required_role: session_owner
      - name: create_work_item
        requires_approval: true
        required_role: session_owner
      - name: update_work_item
        requires_approval: true
        required_role: session_owner
