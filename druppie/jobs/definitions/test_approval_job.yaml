id: test_approval_job
name: Test Approval Pipeline
description: A test job that requires approval before execution. Use this to verify the job approval flow works end-to-end.
# Feb 29 (leap day) — fires at most once every ~4 years, i.e. effectively
# never on its own; this test job is meant to be run manually via
# POST /api/jobs/{definition_id}/trigger. Must be a REAL date: an impossible
# one like "31 2" makes croniter raise CroniterBadDateError every scheduler tick.
schedule: "0 0 29 2 *"
agent_id: summarizer
prompt: |
  This is a test of the job approval pipeline.

  Please create a friendly message confirming that the approval-based
  job execution pipeline is working correctly.
approval_required: true
required_role: admin
enabled: true
