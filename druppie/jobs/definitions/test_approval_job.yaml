id: test_approval_job
name: Test Approval Pipeline
description: A test job that requires approval before execution. Use this to verify the job approval flow works end-to-end.
# Disabled so it never auto-fires: this test job is meant to be run manually
# via POST /api/jobs/{definition_id}/trigger (trigger_job ignores `enabled`).
# NB: a never-run enabled job with any past occurrence fires once immediately
# on first deploy (see JobService._should_run), so a "far future" schedule is
# NOT enough — the job must be disabled. Schedule must still be a REAL date;
# an impossible one like "31 2" raises CroniterBadDateError every scheduler tick.
schedule: "0 0 29 2 *"
agent_id: summarizer
prompt: |
  This is a test of the job approval pipeline.

  Please create a friendly message confirming that the approval-based
  job execution pipeline is working correctly.
approval_required: true
required_role: admin
enabled: false
