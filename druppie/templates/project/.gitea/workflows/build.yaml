# Per-app CI/CD pipeline for a Druppie-generated application.
#
# Uses kaniko (daemonless, non-privileged) to build and push images.
# No Docker daemon or privileged sidecar needed.
#
# Secrets (org-level on the `druppie-apps` org):
#   HARBOR_REGISTRY, HARBOR_USERNAME, HARBOR_PASSWORD  (Harbor robot, push+pull)
#   CI_GIT_TOKEN  (write to ai/k8s — scoped to clusters/user-apps/<slug>/)
name: Build and Deploy

on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}

# Serialize per-branch so two pushes don't race the ai/k8s imageTag bump.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive names + tag
        id: names
        env:
          REPO: ${{ github.repository }}
        run: |
          REPO_NAME="$(basename "$REPO")"
          IMAGE_NAME="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          SLUG="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')"
          BRANCH="${{ github.ref_name }}"
          BRANCH_SLUG="$(echo "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-8)"
          TIMESTAMP="$(date -u +%Y%m%d%H%M%S)"
          TAG="${BRANCH_SLUG}-${TIMESTAMP}-${SHORT_SHA}"
          {
            echo "image_name=$IMAGE_NAME"
            echo "slug=$SLUG"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Image: $REGISTRY/druppie/$IMAGE_NAME:$TAG"
          echo "ai/k8s path: clusters/user-apps/$SLUG/helmrelease.yaml"

      - name: Install kaniko
        run: |
          curl -fsSL -o /usr/local/bin/kaniko \
            https://github.com/GoogleContainerTools/kaniko/releases/download/v1.23.2/kaniko-linux-amd64
          chmod +x /usr/local/bin/kaniko

      - name: Install yq (robust HelmRelease patching)
        run: |
          curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Build and push image (kaniko)
        env:
          IMAGE: ${{ steps.names.outputs.image_name }}
          TAG: ${{ steps.names.outputs.tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          USER="${HARBOR_USER:-robot\$druppie+druppie-ci}"
          AUTH="$(printf '%s:%s' "$USER" "$HARBOR_PASS" | base64 -w0)"
          mkdir -p /kaniko/.docker
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" \
            > /kaniko/.docker/config.json

          /usr/local/bin/kaniko \
            --context "$(pwd)" \
            --dockerfile Dockerfile \
            --destination "$REGISTRY/druppie/$IMAGE:$TAG" \
            --cache=true \
            --cache-repo "$REGISTRY/druppie/$IMAGE/cache" \
            --build-arg CACHEBUST="$SHA" \
            --skip-tls-verify-pull \
            --skip-tls-verify-push

      - name: Bump image.tag in ai/k8s HelmRelease
        env:
          SLUG: ${{ steps.names.outputs.slug }}
          TAG: ${{ steps.names.outputs.tag }}
          GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          HR_FILE="clusters/user-apps/${SLUG}/helmrelease.yaml"
          AUTH="$(printf 'druppie-ci:%s' "$GIT_TOKEN" | base64 -w0)"
          git config --global http.https://aigit.waterschap.org/.extraheader "AUTHORIZATION: basic $AUTH"
          git clone https://aigit.waterschap.org/ai/k8s.git /tmp/k8s
          cd /tmp/k8s

          if [ ! -f "$HR_FILE" ]; then
            echo "No HelmRelease at $HR_FILE (app not deployed yet) — skipping"
            exit 0
          fi

          # Validate that only the app's own path is being modified
          git diff --cached --name-only 2>/dev/null || true
          case "$HR_FILE" in
            clusters/user-apps/${SLUG}/*) ;;
            *)
              echo "ERROR: Attempting to modify '$HR_FILE' which is outside"
              echo "       clusters/user-apps/${SLUG}/ — rejected."
              exit 1
              ;;
          esac

          git config user.name "druppie-ci"
          git config user.email "druppie-ci@users.noreply.rijnland.dev"
          export TAG
          yq -i '.spec.values.image.tag = strenv(TAG)' "$HR_FILE"

          if git diff --quiet; then
            echo "No changes — tag already up to date"
          else
            git add "$HR_FILE"
            git commit -m "ci: auto-update $SLUG image tag to ${TAG}"
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                echo "Pushed image tag: ${TAG}"
                exit 0
              fi
              echo "Push failed (attempt $attempt/5); rebasing and retrying..."
              git pull --rebase origin main
              sleep 5
            done
            echo "ERROR: could not push image tag update after 5 attempts" >&2
            exit 1
          fi
