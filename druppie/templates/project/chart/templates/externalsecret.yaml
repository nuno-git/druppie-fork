{{- if and .Values.externalSecret.enabled .Values.externalSecret.vaultPath }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}-db
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "app.fullname" . }}-db
    creationPolicy: Owner
  data:
    - remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: {{ .Values.externalSecret.passwordKey }}
      secretKey: {{ .Values.externalSecret.passwordKey }}
{{- end }}
