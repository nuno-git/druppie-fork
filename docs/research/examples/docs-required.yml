name: docs-required

# Mandatory-documentation gate for pull requests.
# IMPORTANT: no top-level `paths:` filter on the trigger. The job must ALWAYS run,
# otherwise a required status check hangs on "Expected - Waiting for status to be
# reported" and the PR can never merge.
on: pull_request

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'druppie/**'
              - 'frontend/src/**'
            docs:
              - 'docs/**'

      - name: Does the PR reference an ADR or PRD?
        id: ref
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s %s' "$TITLE" "$BODY" | grep -Eq '(ADR|PRD)-[0-9]+'; then
            echo "referenced=true" >> "$GITHUB_OUTPUT"
          else
            echo "referenced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require documentation for code changes
        if: >
          steps.filter.outputs.code == 'true' &&
          steps.filter.outputs.docs == 'false' &&
          steps.ref.outputs.referenced == 'false' &&
          !contains(github.event.pull_request.labels.*.name, 'docs-exempt')
        run: |
          echo "::error::This PR changes code but ships no documentation."
          echo "Add/update a doc under docs/, reference an existing ADR/PRD in the PR title or body,"
          echo "or apply the 'docs-exempt' label for genuinely doc-irrelevant changes."
          exit 1

      - name: Validate included docs (ADR status + links)
        if: steps.filter.outputs.docs == 'true'
        run: |
          python scripts/validate_adr_status.py
          python scripts/validate_doc_links.py
