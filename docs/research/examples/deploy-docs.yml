name: deploy-docs

# Auto-publish the docs site on every push to colab-dev.
# Modern GitHub Pages pattern: build -> upload artifact -> deploy (no gh-pages branch).
on:
  push:
    branches: [colab-dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material mkdocs-llmstxt-md
      # Regenerate derived pages BEFORE building so the published site is always current.
      - run: python scripts/generate_index.py   # writes docs/decisions/index.md from ADR frontmatter
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
