# LLM Performance Benchmark Configuration
# Endpoints and models for benchmarking on Nutanix/Kubernetes infrastructure.

endpoints:
  azure_foundry:
    base_url: "https://druppie-resource.openai.azure.com/openai/v1"
    api_key: "${FOUNDRY_API_KEY}"
    ssl_verify: true
    auth_type: "bearer"

  # Ollama — momenteel offline
  # ollama:
  #   base_url: "https://ollama.waterschap.org/v1"
  #   api_key: ""
  #   ssl_verify: false

  # Toekomstige endpoints op Nutanix/K8s:
  # vllm:
  #   base_url: "https://vllm.nutanix.internal/v1"
  #   api_key: "${VLLM_API_KEY}"
  #   ssl_verify: true

models:
  - endpoint: azure_foundry
    model: GPT-5-MINI
    display_name: "GPT-5 Mini"
    max_context: 131072
    parameters: "unknown"
    quantization: null
    kv_cache_quant: null
    flash_attention: false
    gpu_layers: -1
    notes: "Azure AI Foundry hosted, temperature forced to 1.0"

