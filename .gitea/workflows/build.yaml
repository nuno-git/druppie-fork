name: Build and Push Images

on:
  push:
    branches: [colab-dev, main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  TAG: ${{ github.sha }}
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker CLI and Buildx
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /tmp
          install -m 755 /tmp/docker/docker /usr/local/bin/docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.20.1/buildx-v0.20.1.linux-amd64 \
            -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          docker version --format '{{.Client.Version}}'

      - name: Configure Harbor credentials
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
          HARBOR_REG: ${{ secrets.HARBOR_REGISTRY }}
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s' "$HARBOR_USER:$HARBOR_PASS" | base64 -w0)
          cat > ~/.docker/config.json <<JSON
          {"auths":{"$HARBOR_REG":{"auth":"$AUTH"}}}
          JSON

      - name: Build and push backend
        run: |
          docker build -t "$REGISTRY/druppie/druppie-backend:$TAG" .
          docker tag  "$REGISTRY/druppie/druppie-backend:$TAG" "$REGISTRY/druppie/druppie-backend:latest"
          docker push --all-tags "$REGISTRY/druppie/druppie-backend"

      - name: Build and push frontend
        run: |
          docker build -t "$REGISTRY/druppie/druppie-frontend:$TAG" ./frontend
          docker tag  "$REGISTRY/druppie/druppie-frontend:$TAG" "$REGISTRY/druppie/druppie-frontend:latest"
          docker push --all-tags "$REGISTRY/druppie/druppie-frontend"

      - name: Build and push init image
        run: |
          if [ -f Dockerfile.init ]; then
            docker build -t "$REGISTRY/druppie/druppie-init:$TAG" -f Dockerfile.init .
            docker tag  "$REGISTRY/druppie/druppie-init:$TAG" "$REGISTRY/druppie/druppie-init:latest"
            docker push --all-tags "$REGISTRY/druppie/druppie-init"
          fi

      - name: Build and push layout-service
        run: |
          docker build -t "$REGISTRY/druppie/druppie-layout-service:$TAG" ./druppie/mcp-servers/layout-service
          docker tag  "$REGISTRY/druppie/druppie-layout-service:$TAG" "$REGISTRY/druppie/druppie-layout-service:latest"
          docker push --all-tags "$REGISTRY/druppie/druppie-layout-service"

      - name: Build and push MCP modules
        run: |
          for module in module-coding module-docker module-web module-vision \
                        module-archimate module-data-access module-registry \
                        module-filesearch module-kubernetes module-llm; do
            DF="./druppie/mcp-servers/$module/Dockerfile"
            if [ -f "$DF" ]; then
              if grep -q "^COPY mcp-servers/" "$DF"; then
                CONTEXT="."
              else
                CONTEXT="./druppie/mcp-servers/"
              fi
              echo "Building $module (context=$CONTEXT)..."
              docker build -t "$REGISTRY/druppie/druppie-$module:$TAG" -f "$DF" "$CONTEXT"
              docker tag  "$REGISTRY/druppie/druppie-$module:$TAG" "$REGISTRY/druppie/druppie-$module:latest"
              docker push --all-tags "$REGISTRY/druppie/druppie-$module"
            fi
          done

      - name: Build and push sandbox-k8s image
        run: |
          if [ -f "./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s" ]; then
            docker build -t "$REGISTRY/druppie/druppie-sandbox-k8s:$TAG" \
              -f ./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s ./druppie/mcp-servers/module-coding
            docker tag  "$REGISTRY/druppie/druppie-sandbox-k8s:$TAG" "$REGISTRY/druppie/druppie-sandbox-k8s:latest"
            docker push --all-tags "$REGISTRY/druppie/druppie-sandbox-k8s"
          fi

      - name: Summary
        run: |
          echo "### Build Complete ###"
          echo "Images pushed to $REGISTRY/druppie/ with tags: $TAG, latest"
