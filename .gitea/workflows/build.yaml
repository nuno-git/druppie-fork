name: Build and Push Images

on:
  push:
    branches: [colab-dev, main, 'feature/**']
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          BRANCH="${{ github.ref_name }}"
          # Sanitize the branch into a valid Docker tag component: slashes and any
          # other characters outside [A-Za-z0-9._-] become '-'. This keeps main /
          # colab-dev tags unchanged while making feature/foo -> feature-foo.
          BRANCH_SLUG=$(echo "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          DEPLOY_TAG="${BRANCH_SLUG}-${TIMESTAMP}-${SHORT_SHA}"
          echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          echo "Deploy tag: $DEPLOY_TAG"

      - name: Install Docker CLI and Buildx
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /tmp
          install -m 755 /tmp/docker/docker /usr/local/bin/docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.20.1/buildx-v0.20.1.linux-amd64 \
            -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          docker version --format '{{.Client.Version}}'

      - name: Configure Harbor credentials
        env:
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          mkdir -p /tmp/docker
          AUTH=$(printf 'robot$druppie+druppie-ci:%s' "$HARBOR_PASS" | base64 -w0)
          printf '{"auths":{"harbor.rijnland.dev":{"auth":"%s"}}}\n' "$AUTH" > /tmp/docker/config.json
          echo "DOCKER_CONFIG=/tmp/docker" >> $GITHUB_ENV
          cat /tmp/docker/config.json

      - name: Build and push backend
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          docker --config /tmp/docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-backend:$TAG" .
          docker --config /tmp/docker push "$REGISTRY/druppie/druppie-backend:$TAG"

      - name: Build and push frontend
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-frontend:$TAG" ./frontend
          docker push "$REGISTRY/druppie/druppie-frontend:$TAG"

      - name: Build and push init image
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -f Dockerfile.init ]; then
            docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-init:$TAG" -f Dockerfile.init .
            docker push "$REGISTRY/druppie/druppie-init:$TAG"
          fi

      - name: Build and push layout-service
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-layout-service:$TAG" ./druppie/mcp-servers/layout-service
          docker push "$REGISTRY/druppie/druppie-layout-service:$TAG"

      - name: Build and push MCP modules
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          for module in module-coding module-docker module-web module-vision \
                        module-archimate module-data-access module-registry \
                        module-filesearch module-kubernetes module-llm; do
            DF="./druppie/mcp-servers/$module/Dockerfile"
            if [ -f "$DF" ]; then
              if grep -q "^COPY mcp-servers/" "$DF"; then
                CONTEXT="./druppie/"
              else
                CONTEXT="./druppie/mcp-servers/"
              fi
              echo "Building $module (context=$CONTEXT)..."
              docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-$module:$TAG" -f "$DF" "$CONTEXT"
              docker push "$REGISTRY/druppie/druppie-$module:$TAG"
            fi
          done

      - name: Build and push sandbox-k8s image
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -f "./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s" ]; then
            docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-sandbox-k8s:$TAG" \
              -f ./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s ./druppie/mcp-servers/module-coding
            docker push "$REGISTRY/druppie/druppie-sandbox-k8s:$TAG"
          fi

      - name: Build and push dev-workspace image
        # Branch environments check out their branch at runtime from the SAME
        # shared image, so this only needs building on the two long-lived
        # branches. Feature-branch pushes skip it (the workspace pod pulls
        # dev-workspace:latest and `git checkout`s the feature branch itself).
        if: github.ref_name == 'colab-dev' || github.ref_name == 'main'
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          docker build --build-arg CACHEBUST="$SHA" \
            -t "$REGISTRY/druppie/dev-workspace:$TAG" \
            -t "$REGISTRY/druppie/dev-workspace:latest" \
            -f Dockerfile.dev-workspace .
          docker push "$REGISTRY/druppie/dev-workspace:$TAG"
          docker push "$REGISTRY/druppie/dev-workspace:latest"

      - name: Summary
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
        run: |
          echo "### Build Complete ###"
          echo "Tag: $TAG"
          echo "Images pushed to $REGISTRY/druppie/"

      - name: Update HelmRelease image tag in ai/k8s
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          BRANCH: ${{ github.ref_name }}
          GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          # main/colab-dev: their HelmRelease lives under clusters/ka-k8s-ai/apps/.
          # Feature branches: a branch environment (deployed from the Druppie UI)
          # has a machine-managed HelmRelease under clusters/branch-envs/ — update
          # its imageTag so the env auto-upgrades. No env dir -> nothing to do.
          if [ "$BRANCH" = "main" ]; then
            HR_FILE="clusters/ka-k8s-ai/apps/druppie/helmrelease.yaml"
          elif [ "$BRANCH" = "colab-dev" ]; then
            HR_FILE="clusters/ka-k8s-ai/apps/druppie-colab-dev/helmrelease.yaml"
          else
            # Same slugify as the backend: lowercase, non-[a-z0-9-] -> '-',
            # collapse dashes, trim.
            SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
            HR_FILE="clusters/branch-envs/druppie-${SLUG}/helmrelease.yaml"
          fi

          git clone "https://druppie-ci:${GIT_TOKEN}@aigit.waterschap.org/ai/k8s.git" /tmp/k8s
          cd /tmp/k8s

          if [ ! -f "$HR_FILE" ]; then
            echo "No HelmRelease at $HR_FILE (no branch environment deployed) — skipping"
            exit 0
          fi

          git config user.name "druppie-ci"
          git config user.email "druppie-ci@users.noreply.rijnland.dev"

          # Replace any imageTag (quoted or not, any indent); also the init tag.
          sed -i -E "s|^([[:space:]]*)imageTag:.*|\1imageTag: \"${TAG}\"|; s|(tag:[[:space:]]*)[a-z-]*[0-9]*-[a-f0-9]*.*|\1${TAG}|g" "$HR_FILE"
          # Branch envs deployed without an explicit tag have no imageTag key
          # yet — insert it under global (same indent as instance:).
          if ! grep -qE '^[[:space:]]*imageTag:' "$HR_FILE"; then
            sed -i -E "s|^([[:space:]]*)instance:(.*)|\1instance:\2\n\1imageTag: \"${TAG}\"|" "$HR_FILE"
          fi

          if git diff --quiet; then
            echo "No changes — tag already up to date"
          else
            git add "$HR_FILE"
            git commit -m "ci: auto-update image tag to ${TAG} (${BRANCH})"
            git push origin main
            echo "Pushed image tag update: ${TAG}"
          fi
