name: Build and Push Images

on:
  push:
    branches: [colab-dev, main]
  workflow_dispatch:

env:
  REGISTRY: harbor.rijnland.dev
  GIT_SSL_NO_VERIFY: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/buildah/stable:v1.40
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        env:
          GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          git config --global http.sslVerify false
          git config --global --add safe.directory '*'
          git clone "https://druppie-ci:${GIT_TOKEN}@aigit.waterschap.org/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Set image tags
        id: tags
        run: |
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          DEPLOY_TAG="${BRANCH}-${TIMESTAMP}-${SHORT_SHA}"
          echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          echo "cache_tag=${BRANCH}-cache" >> $GITHUB_OUTPUT
          echo "Deploy tag: $DEPLOY_TAG"

      - name: Build and push backend
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          CACHE_TAG: ${{ steps.tags.outputs.cache_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          IMAGE="$REGISTRY/druppie/druppie-backend"
          CREDS="robot\$druppie+druppie-ci:$HARBOR_PASS"
          echo "=== Pulling cache: $IMAGE:$CACHE_TAG ==="
          buildah --storage-driver=vfs pull --tls-verify=false --creds "$CREDS" \
            "docker://$IMAGE:$CACHE_TAG" 2>/dev/null && echo "Cache hit" || echo "No cache yet"
          echo "=== Building backend ==="
          buildah --storage-driver=vfs bud --isolation=chroot \
            --cache-from "$IMAGE:$CACHE_TAG" \
            --build-arg CACHEBUST="$SHA" \
            -t "$IMAGE:$TAG" .
          echo "=== Pushing deploy tag: $TAG ==="
          buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
            "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
          echo "=== Pushing cache tag: $CACHE_TAG ==="
          buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
            "$IMAGE:$TAG" "docker://$IMAGE:$CACHE_TAG"

      - name: Build and push frontend
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          CACHE_TAG: ${{ steps.tags.outputs.cache_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          IMAGE="$REGISTRY/druppie/druppie-frontend"
          CREDS="robot\$druppie+druppie-ci:$HARBOR_PASS"
          echo "=== Pulling cache: $IMAGE:$CACHE_TAG ==="
          buildah --storage-driver=vfs pull --tls-verify=false --creds "$CREDS" \
            "docker://$IMAGE:$CACHE_TAG" 2>/dev/null && echo "Cache hit" || echo "No cache yet"
          echo "=== Building frontend ==="
          buildah --storage-driver=vfs bud --isolation=chroot \
            --cache-from "$IMAGE:$CACHE_TAG" \
            --build-arg CACHEBUST="$SHA" \
            -t "$IMAGE:$TAG" ./frontend
          echo "=== Pushing deploy tag: $TAG ==="
          buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
            "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
          echo "=== Pushing cache tag: $CACHE_TAG ==="
          buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
            "$IMAGE:$TAG" "docker://$IMAGE:$CACHE_TAG"

      - name: Build and push layout-service
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          CACHE_TAG: ${{ steps.tags.outputs.cache_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          IMAGE="$REGISTRY/druppie/druppie-layout-service"
          CREDS="robot\$druppie+druppie-ci:$HARBOR_PASS"
          echo "=== Pulling cache: $IMAGE:$CACHE_TAG ==="
          buildah --storage-driver=vfs pull --tls-verify=false --creds "$CREDS" \
            "docker://$IMAGE:$CACHE_TAG" 2>/dev/null && echo "Cache hit" || echo "No cache yet"
          echo "=== Building layout-service ==="
          buildah --storage-driver=vfs bud --isolation=chroot \
            --cache-from "$IMAGE:$CACHE_TAG" \
            --build-arg CACHEBUST="$SHA" \
            -t "$IMAGE:$TAG" ./druppie/mcp-servers/layout-service
          echo "=== Pushing deploy tag: $TAG ==="
          buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
            "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
          echo "=== Pushing cache tag: $CACHE_TAG ==="
          buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
            "$IMAGE:$TAG" "docker://$IMAGE:$CACHE_TAG"

      - name: Build and push MCP modules
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          CACHE_TAG: ${{ steps.tags.outputs.cache_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          CREDS="robot\$druppie+druppie-ci:$HARBOR_PASS"
          for module in module-coding module-docker module-web module-vision \
                        module-archimate module-data-access module-registry \
                        module-filesearch module-kubernetes module-llm; do
            DF="./druppie/mcp-servers/$module/Dockerfile"
            if [ -f "$DF" ]; then
              if grep -q "^COPY mcp-servers/" "$DF"; then
                CONTEXT="./druppie/"
              else
                CONTEXT="./druppie/mcp-servers/"
              fi
              IMAGE="$REGISTRY/druppie/druppie-$module"
              echo "=== Pulling cache: $IMAGE:$CACHE_TAG ==="
              buildah --storage-driver=vfs pull --tls-verify=false --creds "$CREDS" \
                "docker://$IMAGE:$CACHE_TAG" 2>/dev/null && echo "Cache hit" || echo "No cache yet"
              echo "=== Building $module (context=$CONTEXT) ==="
              buildah --storage-driver=vfs bud --isolation=chroot \
                --cache-from "$IMAGE:$CACHE_TAG" \
                --build-arg CACHEBUST="$SHA" \
                -t "$IMAGE:$TAG" \
                -f "$DF" "$CONTEXT"
              echo "=== Pushing deploy tag: $TAG ==="
              buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
                "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
              echo "=== Pushing cache tag: $CACHE_TAG ==="
              buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
                "$IMAGE:$TAG" "docker://$IMAGE:$CACHE_TAG"
            fi
          done

      - name: Build and push sandbox-k8s image
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          CACHE_TAG: ${{ steps.tags.outputs.cache_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          if [ -f "./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s" ]; then
            IMAGE="$REGISTRY/druppie/druppie-sandbox-k8s"
            CREDS="robot\$druppie+druppie-ci:$HARBOR_PASS"
            echo "=== Pulling cache: $IMAGE:$CACHE_TAG ==="
            buildah --storage-driver=vfs pull --tls-verify=false --creds "$CREDS" \
              "docker://$IMAGE:$CACHE_TAG" 2>/dev/null && echo "Cache hit" || echo "No cache yet"
            echo "=== Building sandbox-k8s ==="
            buildah --storage-driver=vfs bud --isolation=chroot \
              --cache-from "$IMAGE:$CACHE_TAG" \
              --build-arg CACHEBUST="$SHA" \
              -t "$IMAGE:$TAG" \
              -f ./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s \
              ./druppie/mcp-servers/module-coding
            echo "=== Pushing deploy tag: $TAG ==="
            buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
              "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
            echo "=== Pushing cache tag: $CACHE_TAG ==="
            buildah --storage-driver=vfs push --tls-verify=false --creds "$CREDS" \
              "$IMAGE:$TAG" "docker://$IMAGE:$CACHE_TAG"
          fi

      - name: Summary
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
        run: |
          echo "### Build Complete ###"
          echo "Tag: $TAG"
          echo "Images pushed to $REGISTRY/druppie/"

      - name: Update HelmRelease image tag in ai/k8s
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          BRANCH: ${{ github.ref_name }}
          GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            HR_FILE="clusters/ka-k8s-ai/apps/druppie/helmrelease.yaml"
            OLD_PATTERN='main-[0-9]*-[a-f0-9]*'
          else
            HR_FILE="clusters/ka-k8s-ai/apps/druppie-colab-dev/helmrelease.yaml"
            OLD_PATTERN='colab-dev-[0-9]*-[a-f0-9]*'
          fi

          git clone "https://druppie-ci:${GIT_TOKEN}@aigit.waterschap.org/ai/k8s.git" /tmp/k8s
          cd /tmp/k8s
          git config user.name "druppie-ci"
          git config user.email "druppie-ci@users.noreply.rijnland.dev"

          sed -i "s|${OLD_PATTERN}|${TAG}|g" "$HR_FILE"

          if git diff --quiet; then
            echo "No changes — tag already up to date"
          else
            git add "$HR_FILE"
            git commit -m "ci: auto-update image tag to ${TAG}"
            git push origin main
            echo "Pushed image tag update: ${TAG}"
          fi
