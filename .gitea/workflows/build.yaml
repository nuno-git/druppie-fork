name: Build and Push Images

on:
  push:
    branches: [colab-dev, main]
  workflow_dispatch:

env:
  REGISTRY: harbor.rijnland.dev

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/buildah/stable:v1.40
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          DEPLOY_TAG="${BRANCH}-${TIMESTAMP}-${SHORT_SHA}"
          echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          echo "Deploy tag: $DEPLOY_TAG"

      - name: Build and push backend
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          buildah --storage-driver=vfs bud --isolation=chroot \
            --build-arg CACHEBUST="$SHA" \
            -t "$REGISTRY/druppie/druppie-backend:$TAG" .
          buildah --storage-driver=vfs push --tls-verify=false \
            --creds "robot\$druppie+druppie-ci:$HARBOR_PASS" \
            "$REGISTRY/druppie/druppie-backend:$TAG" \
            "docker://$REGISTRY/druppie/druppie-backend:$TAG"

      - name: Verify backend code freshness
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          buildah --storage-driver=vfs pull --tls-verify=false \
            --creds "robot\$druppie+druppie-ci:$HARBOR_PASS" \
            "$REGISTRY/druppie/druppie-backend:$TAG"
          buildah --storage-driver=vfs run "$REGISTRY/druppie/druppie-backend:$TAG" -- python3 -c "
          from druppie.repositories.user_repository import UserRepository
          import inspect
          src = inspect.getsource(UserRepository.get_or_create)
          if 'filter_by(username=' in src:
              raise SystemExit('FAIL: stale code')
          print('VERIFY OK')
          "

      - name: Build and push frontend
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          buildah --storage-driver=vfs bud --isolation=chroot \
            --build-arg CACHEBUST="$SHA" \
            -t "$REGISTRY/druppie/druppie-frontend:$TAG" ./frontend
          buildah --storage-driver=vfs push --tls-verify=false \
            --creds "robot\$druppie+druppie-ci:$HARBOR_PASS" \
            "$REGISTRY/druppie/druppie-frontend:$TAG" \
            "docker://$REGISTRY/druppie/druppie-frontend:$TAG"

      - name: Build and push layout-service
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          buildah --storage-driver=vfs bud --isolation=chroot \
            --build-arg CACHEBUST="$SHA" \
            -t "$REGISTRY/druppie/druppie-layout-service:$TAG" ./druppie/mcp-servers/layout-service
          buildah --storage-driver=vfs push --tls-verify=false \
            --creds "robot\$druppie+druppie-ci:$HARBOR_PASS" \
            "$REGISTRY/druppie/druppie-layout-service:$TAG" \
            "docker://$REGISTRY/druppie/druppie-layout-service:$TAG"

      - name: Build and push MCP modules
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          CREDS="robot\$druppie+druppie-ci:$HARBOR_PASS"
          for module in module-coding module-docker module-web module-vision \
                        module-archimate module-data-access module-registry \
                        module-filesearch module-kubernetes module-llm; do
            DF="./druppie/mcp-servers/$module/Dockerfile"
            if [ -f "$DF" ]; then
              if grep -q "^COPY mcp-servers/" "$DF"; then
                CONTEXT="./druppie/"
              else
                CONTEXT="./druppie/mcp-servers/"
              fi
              echo "Building $module (context=$CONTEXT)..."
              buildah --storage-driver=vfs bud --isolation=chroot \
                --build-arg CACHEBUST="$SHA" \
                -t "$REGISTRY/druppie/druppie-$module:$TAG" \
                -f "$DF" "$CONTEXT"
              buildah --storage-driver=vfs push --tls-verify=false \
                --creds "$CREDS" \
                "$REGISTRY/druppie/druppie-$module:$TAG" \
                "docker://$REGISTRY/druppie/druppie-$module:$TAG"
            fi
          done

      - name: Build and push sandbox-k8s image
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          if [ -f "./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s" ]; then
            buildah --storage-driver=vfs bud --isolation=chroot \
              --build-arg CACHEBUST="$SHA" \
              -t "$REGISTRY/druppie/druppie-sandbox-k8s:$TAG" \
              -f ./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s \
              ./druppie/mcp-servers/module-coding
            buildah --storage-driver=vfs push --tls-verify=false \
              --creds "robot\$druppie+druppie-ci:$HARBOR_PASS" \
              "$REGISTRY/druppie/druppie-sandbox-k8s:$TAG" \
              "docker://$REGISTRY/druppie/druppie-sandbox-k8s:$TAG"
          fi

      - name: Summary
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
        run: |
          echo "### Build Complete ###"
          echo "Tag: $TAG"
          echo "Images pushed to $REGISTRY/druppie/"

      - name: Update HelmRelease image tag in ai/k8s
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          BRANCH: ${{ github.ref_name }}
          GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            HR_FILE="clusters/ka-k8s-ai/apps/druppie/helmrelease.yaml"
            OLD_PATTERN='main-[0-9]*-[a-f0-9]*'
          else
            HR_FILE="clusters/ka-k8s-ai/apps/druppie-colab-dev/helmrelease.yaml"
            OLD_PATTERN='colab-dev-[0-9]*-[a-f0-9]*'
          fi

          git clone "https://druppie-ci:${GIT_TOKEN}@aigit.waterschap.org/ai/k8s.git" /tmp/k8s
          cd /tmp/k8s
          git config user.name "druppie-ci"
          git config user.email "druppie-ci@users.noreply.rijnland.dev"

          sed -i "s|${OLD_PATTERN}|${TAG}|g" "$HR_FILE"

          if git diff --quiet; then
            echo "No changes — tag already up to date"
          else
            git add "$HR_FILE"
            git commit -m "ci: auto-update image tag to ${TAG}"
            git push origin main
            echo "Pushed image tag update: ${TAG}"
          fi
