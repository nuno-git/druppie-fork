name: Build and Push Images

on:
  push:
    branches: [colab-dev, main, 'feature/**']
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  # Harbor robot username. Stored as a secret so the auth string stays out of the
  # log; falls back to the known robot account when the secret is unset.
  HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
  DOCKER_BUILDKIT: "1"

# Serialize builds per ref so two pushes to the same branch don't race. Cross-
# branch collisions on `git push origin main` (ai/k8s) are handled by the push
# retry/rebase loop in the deploy step. cancel-in-progress: false lets an
# in-flight build finish instead of throwing away (potentially long) work.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # test: lint + unit tests. Reporting-only for now (continue-on-error) because
  # the tree is not yet lint-clean. To make this a hard gate, drop
  # `continue-on-error: true` below and add `needs: [test]` to the build job.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker CLI
        # The runner image has no docker in PATH; install just the CLI to talk
        # to the shared DinD daemon for running tests in containers.
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /tmp
          install -m 755 /tmp/docker/docker /usr/local/bin/docker

      - name: Backend lint (ruff) + tests (pytest)
        # Reporting-only: every command and the docker run itself are
        # best-effort. The tree is not yet lint-clean, so this must never fail
        # the run (build/deploy must stay green). Output lands in the log.
        run: |
          docker run --rm -v "$PWD":/src -w /src python:3.11-slim bash -lc '
            pip install --no-cache-dir -q -r druppie/requirements.txt || true
            pip install --no-cache-dir -q ruff pytest pytest-asyncio || true
            ruff check druppie || true
            (cd druppie && pytest -q) || true
          ' || true

      - name: Frontend lint + tests
        run: |
          docker run --rm -v "$PWD/frontend":/fe -w /fe node:20-slim bash -lc '
            npm ci || npm install
            npm run lint || true
            (npm test -- --run) || true
          ' || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set image tags
        id: tags
        run: |
          BRANCH="${{ github.ref_name }}"
          # Sanitize the branch into a valid Docker tag component: slashes and any
          # other characters outside [A-Za-z0-9._-] become '-'. This keeps main /
          # colab-dev tags unchanged while making feature/foo -> feature-foo.
          BRANCH_SLUG=$(echo "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          DEPLOY_TAG="${BRANCH_SLUG}-${TIMESTAMP}-${SHORT_SHA}"
          echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          echo "Deploy tag: $DEPLOY_TAG"

      - name: Install Docker CLI and Buildx
        # BuildKit is enabled (DOCKER_BUILDKIT=1) because the Dockerfiles use
        # `RUN --mount=type=cache`, so the buildx plugin is required even though
        # we call `docker build` (not `docker buildx build`) explicitly.
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /tmp
          install -m 755 /tmp/docker/docker /usr/local/bin/docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.20.1/buildx-v0.20.1.linux-amd64 \
            -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          docker version --format '{{.Client.Version}}'

      - name: Install yq (for robust HelmRelease imageTag patching)
        # Pinned version; used instead of sed so JSON-vs-YAML key quoting and
        # accidental global `tag:` matches can no longer corrupt the HelmRelease.
        run: |
          curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Configure Harbor credentials
        # Writes DOCKER_CONFIG once; every later `docker` call reads it via the
        # env var (no per-command --config). Registry + username come from
        # secrets/env so they can't drift out of sync with the image paths.
        env:
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          USER="${HARBOR_USER:-robot\$druppie+druppie-ci}"
          mkdir -p /tmp/docker
          AUTH=$(printf '%s:%s' "$USER" "$HARBOR_PASS" | base64 -w0)
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > /tmp/docker/config.json
          echo "DOCKER_CONFIG=/tmp/docker" >> $GITHUB_ENV

      - name: Build and push backend
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-backend:$TAG" .
          docker push "$REGISTRY/druppie/druppie-backend:$TAG"

      - name: Build and push frontend
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-frontend:$TAG" ./frontend
          docker push "$REGISTRY/druppie/druppie-frontend:$TAG"

      - name: Build and push init image
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -f Dockerfile.init ]; then
            docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-init:$TAG" -f Dockerfile.init .
            docker push "$REGISTRY/druppie/druppie-init:$TAG"
          fi

      - name: Build and push layout-service
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-layout-service:$TAG" ./druppie/mcp-servers/layout-service
          docker push "$REGISTRY/druppie/druppie-layout-service:$TAG"

      - name: Build and push MCP modules
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          for module in module-coding module-docker module-web module-vision \
                        module-archimate module-data-access module-registry \
                        module-filesearch module-kubernetes module-llm \
                        module-azuredevops module-searxng module-browser; do
            DF="./druppie/mcp-servers/$module/Dockerfile"
            if [ -f "$DF" ]; then
              if grep -q "^COPY mcp-servers/" "$DF"; then
                CONTEXT="./druppie/"
              else
                CONTEXT="./druppie/mcp-servers/"
              fi
              echo "Building $module (context=$CONTEXT)..."
              docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-$module:$TAG" -f "$DF" "$CONTEXT"
              docker push "$REGISTRY/druppie/druppie-$module:$TAG"
            fi
          done

      - name: Build and push sandbox-k8s image
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -f "./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s" ]; then
            docker build --build-arg CACHEBUST="$SHA" -t "$REGISTRY/druppie/druppie-sandbox-k8s:$TAG" \
              -f ./druppie/mcp-servers/module-coding/Dockerfile.sandbox.k8s ./druppie/mcp-servers/module-coding
            docker push "$REGISTRY/druppie/druppie-sandbox-k8s:$TAG"
          fi

      - name: Check workspace changes
        # Detects whether workspace-related files changed in this push. The
        # dev-workspace image is only rebuilt when they do — code-only pushes
        # skip the ~1.5 min build and don't restart the workspace pod.
        id: ws_changes
        run: |
          if [ ! -f Dockerfile.dev-workspace ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Long-lived branches always build (keeps :latest fresh).
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "colab-dev" ] || [ "$BRANCH" = "main" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Feature branches: only if workspace files changed since last commit.
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- \
            Dockerfile.dev-workspace \
            scripts/dev-workspace-entrypoint.sh \
            scripts/dev-workspace-desktop-index.html \
            2>/dev/null | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No workspace file changes — skipping dev-workspace build"
          fi

      - name: Build and push dev-workspace image
        # Only built when workspace files changed (or on long-lived branches).
        # The workspace gets code from git fetch at runtime, so code-only pushes
        # don't need an image rebuild. Non-blocking: a flaky build here must not
        # block the core app deploy.
        if: steps.ws_changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          docker build --build-arg CACHEBUST="$SHA" \
            -t "$REGISTRY/druppie/dev-workspace:$TAG" \
            -f Dockerfile.dev-workspace .
          docker push "$REGISTRY/druppie/dev-workspace:$TAG"
          # Push :latest only from long-lived branches
          if [ "$BRANCH" = "colab-dev" ] || [ "$BRANCH" = "main" ]; then
            docker tag "$REGISTRY/druppie/dev-workspace:$TAG" "$REGISTRY/druppie/dev-workspace:latest"
            docker push "$REGISTRY/druppie/dev-workspace:latest"
          fi

      - name: Summary
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
        run: |
          echo "### Build Complete ###"
          echo "Tag: $TAG"
          echo "Images pushed to $REGISTRY/druppie/"

      - name: Update HelmRelease image tag in ai/k8s
        # SECURITY NOTE (review point 2): on push events Gitea runs the workflow
        # file from the pushed branch, so anyone with push rights to a feature/**
        # branch can submit a workflow that reads HARBOR_PASSWORD / CI_GIT_TOKEN
        # (the latter can push ai/k8s main). The durable fix is operational, not
        # in-repo: (1) restrict CI_GIT_TOKEN to ai/k8s only (no admin), and
        # (2) use Gitea "environments" tied to main/colab-dev for these secrets
        # so feature branches can't reference them, plus branch protection on
        # .gitea/workflows/ for the long-lived branches. The token is injected
        # ONLY into this step's env (never a global job/env secret).
        env:
          TAG: ${{ steps.tags.outputs.deploy_tag }}
          BRANCH: ${{ github.ref_name }}
          GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          # main/colab-dev: their HelmRelease lives under clusters/ka-k8s-ai/apps/.
          # Feature branches: a branch environment (deployed from the Druppie UI)
          # has a machine-managed HelmRelease under clusters/branch-envs/ — update
          # its imageTag so the env auto-upgrades. No env dir -> nothing to do.
          if [ "$BRANCH" = "main" ]; then
            HR_FILE="clusters/ka-k8s-ai/apps/druppie/helmrelease.yaml"
          elif [ "$BRANCH" = "colab-dev" ]; then
            HR_FILE="clusters/ka-k8s-ai/apps/druppie-colab-dev/helmrelease.yaml"
          else
            # Same slugify as the backend: lowercase, non-[a-z0-9-] -> '-',
            # collapse dashes, trim.
            SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-*//' -e 's/-*$//')
            HR_FILE="clusters/branch-envs/druppie-${SLUG}/helmrelease.yaml"
          fi

          # Authenticate via an HTTP extra header instead of embedding the token
          # in the clone URL (which would leak into .git/config and error msgs).
          AUTH=$(printf 'druppie-ci:%s' "$GIT_TOKEN" | base64 -w0)
          git config --global http.https://aigit.waterschap.org/.extraheader "AUTHORIZATION: basic $AUTH"
          git clone https://aigit.waterschap.org/ai/k8s.git /tmp/k8s
          cd /tmp/k8s

          if [ ! -f "$HR_FILE" ]; then
            echo "No HelmRelease at $HR_FILE (no branch environment deployed) — skipping"
            exit 0
          fi

          git config user.name "druppie-ci"
          git config user.email "druppie-ci@users.noreply.rijnland.dev"

          # Patch imageTag with yq (robust against JSON/YAML quoting). Only touch
          # init.image.tag when that key already exists (don't create stray keys
          # on branch-env HelmReleases that have no init section).
          #
          # dev-workspace image tag logic (3 cases):
          #   1. Workspace rebuilt (Dockerfile changed): set to new deploy tag
          #   2. Workspace not built, tag empty (first push): latch to the OLD
          #      global tag (it has a workspace image from the parent's CI)
          #   3. Workspace not built, tag already set: leave it untouched
          #              → workspace pod is NOT restarted on code-only pushes.
          OLD_TAG=$(yq '.spec.values.global.imageTag // ""' "$HR_FILE")
          CURRENT_WS_TAG=$(yq '.spec.values.devWorkspace.image.tag // ""' "$HR_FILE")
          export TAG
          yq -i '.spec.values.global.imageTag = strenv(TAG)' "$HR_FILE"
          if yq -e '.spec.values.init.image.tag' "$HR_FILE" >/dev/null 2>&1; then
            yq -i '.spec.values.init.image.tag = strenv(TAG)' "$HR_FILE"
          fi
          if [ "${{ steps.ws_changes.outputs.changed }}" = "true" ]; then
            yq -i '.spec.values.devWorkspace.image.tag = strenv(TAG)' "$HR_FILE"
          elif [ -z "$CURRENT_WS_TAG" ]; then
            export OLD_TAG
            yq -i '.spec.values.devWorkspace.image.tag = strenv(OLD_TAG)' "$HR_FILE"
          fi

          if git diff --quiet; then
            echo "No changes — tag already up to date"
          else
            git add "$HR_FILE"
            git commit -m "ci: auto-update image tag to ${TAG} (${BRANCH})"
            # Retry the push with a rebase: another branch's build may push to
            # ai/k8s main concurrently. Without this, the loser fails non-fast-
            # forward and the deploy silently never happens (images are in Harbor
            # but Flux never sees the new tag).
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                echo "Pushed image tag update: ${TAG}"
                exit 0
              fi
              echo "Push failed (attempt $attempt/5); rebasing and retrying..."
              git pull --rebase origin main
              sleep 5
            done
            echo "ERROR: could not push image tag update after 5 attempts" >&2
            exit 1
          fi
