# Druppie CI/CD - Gitea Actions
#
# Builds the backend + frontend Docker images and pushes them to Harbor
# (localhost:30010/druppie), then triggers a k3s rollout restart so the new
# images are pulled by the running deployments.
#
# Trigger: every push to `colab-dev` (also runnable manually via workflow_dispatch).
#
# Prerequisites (already configured on this host):
#   * act-runner registered against the k3s Gitea (NodePort 30003), host-networked
#     with the host docker socket + host kubeconfig mounted into job containers.
#   * Docker daemon has `localhost:30010` in insecure-registries (Harbor is HTTP).
#
# Secrets (set in Gitea → repo → Settings → Actions → Secrets):
#   HARBOR_PASSWORD - Harbor admin password (default dev: Harbor12345)

name: Build and Deploy

on:
  push:
    branches: [colab-dev]
  workflow_dispatch: {}

env:
  REGISTRY: localhost:30010
  HARBOR_USER: admin
  BACKEND_IMAGE: localhost:30010/druppie/druppie-backend:latest
  FRONTEND_IMAGE: localhost:30010/druppie/druppie-frontend:latest
  DEPLOY_NAMESPACE: druppie

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

      - name: Login to Harbor
        run: |
          HARBOR_PASS="${{ secrets.HARBOR_PASSWORD }}"
          HARBOR_PASS="${HARBOR_PASS:-Harbor12345}"
          echo "$HARBOR_PASS" | docker login ${REGISTRY} \
            -u ${HARBOR_USER} --password-stdin

      - name: Build & push backend image
        run: |
          docker build -t ${BACKEND_IMAGE} -f Dockerfile .
          docker push ${BACKEND_IMAGE}

      - name: Build & push frontend image
        run: |
          docker build -t ${FRONTEND_IMAGE} -f frontend/Dockerfile frontend/
          docker push ${FRONTEND_IMAGE}

  deploy:
    name: Rollout restart (k3s)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Install kubectl (absent from runtime image)
        run: |
          curl -fsSL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          kubectl version --client
      # act-runner mounts the host kubeconfig to /root/.kube/config; the job
      # container runs on the host network so kubectl reaches the k3s API at
      # https://127.0.0.1:6443 directly.
      - name: Rollout restart deployments
        run: |
          set -e
          echo "Restarting druppie-backend (pulls from Harbor)..."
          kubectl rollout restart deployment/druppie-backend -n ${DEPLOY_NAMESPACE}
          kubectl rollout status deployment/druppie-backend -n ${DEPLOY_NAMESPACE} --timeout=240s

          echo "Restarting druppie-frontend..."
          kubectl rollout restart deployment/druppie-frontend -n ${DEPLOY_NAMESPACE} || true
          kubectl rollout status deployment/druppie-frontend -n ${DEPLOY_NAMESPACE} --timeout=120s || \
            echo "::warning::frontend rollout did not complete (it may use a non-Harbor image path)"

