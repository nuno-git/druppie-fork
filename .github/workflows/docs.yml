name: Docs check

# No top-level `paths:` filter on purpose: a required check that is skipped by a
# path filter stays "pending forever". The job always runs and always reports.
on:
  pull_request:

jobs:
  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validator deps
        run: pip install -r scripts/requirements-docs.txt

      # Regression tests for the validator/gate logic. This one MUST fail the
      # build (no continue-on-error) — a broken validator would silently let
      # bad docs through. pyyaml+jsonschema come from requirements-docs.txt above.
      - name: Validator regression tests (blocking)
        run: |
          pip install pytest
          python -m pytest scripts/tests -q

      # Check A — mandatory-docs gate (PR level). If code changed but no docs did,
      # FAIL the build — unless the PR is exempt via the `docs-exempt` label OR a
      # `docs-exempt` line in the PR description. Blocking: the baseline is clean and
      # the team has accepted ADR 001. Mark this check required in branch protection
      # so it must pass before merge.
      # The gate/exempt logic lives in the testable scripts/check_mandatory_docs.py,
      # which prints its own ::error:: with the guide link + the 3 exempt ways.
      - name: Mandatory-docs gate (Check A)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" | python scripts/check_mandatory_docs.py

      # Check B — validity of the docs that exist. Blocking.
      - name: Validate docs (Check B)
        run: |
          python scripts/validate_docs.py || {
            echo "::error::Documentation validation failed. See docs/guides/documentation-framework.md for the standard (frontmatter, ids, links, CAS)."
            exit 1
          }
