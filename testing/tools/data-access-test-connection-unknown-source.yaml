## Tool Test: Data Access MCP - test_connection
## test_connection against a source_id that isn't configured must
## surface {success: false, error: ...} rather than raising.

tool-test:
  name: data-access-test-connection-unknown-source
  description: "test_connection against an unknown source returns {success: false, error}"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: dataaccess:test_connection
      arguments:
        source_id: "nonexistent-source"
      assert:
        result:
          - json_parseable
          - {matches: "\"success\"\\s*:\\s*false"}
          - {contains: "error"}
