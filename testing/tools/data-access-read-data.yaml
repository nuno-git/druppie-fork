## Tool Test: Data Access MCP - Read Data Unknown
## Tests error handling for unknown source

tool-test:
  name: data-access-read-data-unknown
  description: "Read data from unknown source returns error"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: data_access:read_data
      arguments:
        source_id: "nonexistent-source"
        data_id: "some.table"
      assert:
        result:
          - json_parseable
          - {contains: "error"}