          ## Aanbeveling

          * **Gekozen benadering:** B — Modulair met MCP-modules voor integraties + polling voor status
          * **Rationale:** Benadering B biedt de beste balans tussen herbruikbaarheid, complexiteit en risico. De MCP-modules (DSP, notificatie, PDOK, object-opslag) maken de integraties herbruikbaar voor toekomstige waterschapsprojecten, wat aansluit bij principe 11 (standaard voor maatwerk) en principe 16 (services-ondersteuning). Benadering C (webhooks) is superieur voor status-updates bij hoog volume, maar introduceert aanzienlijke complexiteit (retry-logica, event-volgorde, inkomend endpoint) waarvan de meerwaarde bij het verwachte volume (enkele honderden meldingen per dag) beperkt is. Bovendien is niet zeker of de DSP-instance webhooks ondersteunt. De polling-aanpak (elke 60 seconden bij status-pagina-verzoek) is eenvoudiger en voldoet aan NFR-03 (status binnen 60 seconden). Als het volume stijgt of DSP webhooks ondersteunt, kan in een volgende iteratie naar Benadering C worden gemigreerd.
          * **Afgeleide beslissingen voor TD:**
            - Vier nieuwe MCP-modules worden gecreëerd (BUILD_PATH=CORE_UPDATE)
            - Polling-interval voor status-updates: maximaal 60 seconden (TR-xx)
            - Zaaktype-mapping is een configuratie-item, geen hard-coded mapping
            - Duplicaatdetectie (BR-04) wordt geïmplementeerd in de project-backend met Postgres-query (500m + 4h +zelfde type)
            - Pseudonimisatie (BR-03) wordt uitgevoerd door een achtergrondtaak in de project-backend
          * **Afgeleide Technical Requirements:**
            - TR-01: Polling-interval status-updates ≤ 60 seconden (cache TTL in backend)
            - TR-02: Foto-resize naar max 1920px voordat upload naar object-opslag
            - TR-03: Duplicaatdetectie-query: zoek bestaande melding binnen 500m radius + 4 uur + zelfde type
            - TR-04: Pseudonimisatie-taak: hash e-mailadres 7 dagen na zaaksluiting
            - TR-05: Alle module-aanroepen via Druppie SDK (niet direct HTTP)
            - TR-06: Zaaktype-mapping configuratie in YAML/env, niet in code
            - TR-07: Form-submit verwerking binnen 2 seconden (P95) bij normaal meldvolume
          * **Openstaande aannames/risico's:**
            - DSP ondersteunt ZGW-API's (Zaken API 1.0+). Te valideren bij eerste integratie-test.
            - PDOK BAG/BGT reverse-geocoding levert betrouwbaar adressen binnen het beheergebied. Edge-case: watergebieden zonder BAG-adres → fallback naar coördinatenweergave.
            - Notificatieservice-endpoint voor e-mail is beschikbaar binnen de waterschapsinfrastructuur. Alternatief: directe SMTP via de module.
            - Object-opslag (S3-compatibel) is beschikbaar als service binnen het waterschap. Drempelwaarde: foto-upload max 10 MB per bestand.
            - Polling bij hoog volume: als het aantal actieve status-pagina-verzoeken stijgt, kan caching in Postgres de DSP-belasting beperken. Migratie naar webhooks (Benadering C) is het escalatiepad.
