tool-test:
  name: test-sandbox-bash-curl
  description: |
    Tests internet access via curl in the coding sandbox via router→planner→developer pipeline.
  tags: [sandbox, bash, curl, e2e, agent-runtime]

  chain:
    # Router — create project
    - agent: router
      tool: builtin:set_intent
      arguments:
        intent: create_project
        project_name: sandbox-curl-test
        description: "Test project for sandbox curl verification"
      assert:
        result:
          - not_empty

    - agent: router
      tool: builtin:done
      arguments:
        summary: "Agent router: Classified as create_project"

    # Planner → Developer
    - agent: planner
      tool: builtin:make_plan
      arguments:
        steps:
          - agent_id: developer
            prompt: "Test curl availability and internet access in the sandbox"

    - agent: planner
      tool: builtin:done
      arguments:
        summary: "Agent planner: Planned developer for sandbox curl test"

    # Developer — check curl is available
    - agent: developer
      tool: coding:bash
      arguments:
        command: "which curl && curl --version | head -1"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "curl" }

    # Developer — test actual internet access via http (verify response body, not just status)
    - agent: developer
      tool: coding:bash
      arguments:
        command: "curl -s https://pypi.org/simple/ | head -5"
        timeout: 60
        git_scope: "current_project"
        sandbox_networks: ["internet"]
      assert:
        result:
          - { contains: "html" }
