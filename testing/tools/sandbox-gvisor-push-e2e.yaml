## Test: gVisor sandbox end-to-end — clone → edit → push_changes → commit on Gitea
##
## Proves acceptance criterion #1 of the sandbox story: the full flow
##   clone → bestand aanpassen → push_changes → commit zichtbaar op Gitea
## works in one clean run, and does so through the *real* sandbox.
##
## Why this is the AC1 proof:
##   - In the branch environment the coding MCP server runs with
##     DRUPPIE_SANDBOX_MODE=k8s (helm configmap.yaml), so every coding: tool
##     call below executes inside a gVisor-isolated sandbox pod. The gVisor
##     netstack cannot reach Gitea's ClusterIP, so the clone (host-side) and
##     the push (host-side, via git bundle) are the exact code paths the story
##     is about (k8s_sandbox._host_side_clone + tools.push_changes).
##   - The verify: block queries the Gitea API directly
##     (druppie/testing/verifiers.py -> /api/v1/repos/.../contents/...), so a
##     PASS means the edited file genuinely landed on Gitea — not just in the
##     local workspace. That is what "commit zichtbaar op Gitea" requires.
##
## In docker mode this same test exercises the Docker sandbox path, so it is a
## single repeatable regression guard for both backends.
##
## Chain: router (create_project) -> planner -> developer
##   1. confirm the host-side clone delivered a real git work tree into the sandbox
##   2. write a marker file with a unique token via coding:write_file  (the "edit")
##   3. read it back inside the sandbox to prove the write took effect
##   4. push_changes  (host-side bundle push to Gitea, no creds in sandbox)
##
## Run: POST /api/evaluations/run-tests {"test_name": "sandbox-gvisor-push-e2e"}

tool-test:
  name: sandbox-gvisor-push-e2e
  description: |
    E2E proof for sandbox AC1: clone → edit → push_changes → commit visible on
    Gitea, exercised through the real (gVisor in k8s mode) sandbox. Verifies the
    pushed file on Gitea via the API, not just the local workspace.
  tags: [sandbox, gvisor, e2e, push, gitea]

  chain:
    # =========================================================================
    # Router — create a fresh project (seeds a Gitea repo + sandbox context)
    # =========================================================================
    - agent: router
      tool: builtin:set_intent
      arguments:
        intent: create_project
        project_name: sandbox-gvisor-push-e2e
        description: "E2E project proving the sandbox can clone, edit and push to Gitea"
      assert:
        result:
          - not_empty

    - agent: router
      tool: builtin:done
      arguments:
        summary: "Agent router: Classified as create_project for sandbox-gvisor-push-e2e"

    # =========================================================================
    # Planner — plan the developer
    # =========================================================================
    - agent: planner
      tool: builtin:make_plan
      arguments:
        steps:
          - agent_id: developer
            prompt: "Verify the clone landed, edit a file, and push it to Gitea."

    - agent: planner
      tool: builtin:done
      arguments:
        summary: "Agent planner: Planned developer for the sandbox push E2E"

    # =========================================================================
    # Developer — the actual clone → edit → push flow inside the sandbox
    # =========================================================================

    # 1. CLONE leg: the host-side clone must have delivered a real git work tree
    #    into /workspace inside the (gVisor) sandbox. Prove it before editing.
    - agent: developer
      tool: coding:bash
      arguments:
        command: "git -C /workspace rev-parse --is-inside-work-tree && echo REMOTE=$(git -C /workspace remote get-url origin 2>/dev/null)"
        timeout: 30
      assert:
        result:
          - { contains: "true" }

    # 2. EDIT leg: write a marker file with a token unique to this test so the
    #    Gitea verify below cannot pass on pre-existing content.
    - agent: developer
      tool: coding:write_file
      arguments:
        path: SANDBOX_E2E.md
        content: |
          # Sandbox gVisor E2E marker

          This file was written inside the sandbox and pushed to Gitea via
          push_changes (host-side git bundle). If you can read this on Gitea,
          the full clone -> edit -> push flow works end-to-end.

          token: SANDBOX-GVISOR-E2E-OK-4f2a9c
      assert:
        result:
          - no_error

    # 3. Read the file back *inside the sandbox* to prove the write took effect
    #    before we push (isolates a write failure from a push failure).
    - agent: developer
      tool: coding:bash
      arguments:
        command: "cat /workspace/SANDBOX_E2E.md"
        timeout: 15
      assert:
        result:
          - { contains: "SANDBOX-GVISOR-E2E-OK-4f2a9c" }

    # 4. PUSH leg: host-side bundle push to Gitea (sandbox holds no credentials).
    - agent: developer
      tool: coding:push_changes

    - agent: developer
      tool: builtin:done
      arguments:
        summary: "Agent developer: wrote SANDBOX_E2E.md in the sandbox and pushed it to Gitea via push_changes."
      assert:
        completed: true

  # =========================================================================
  # Verify — query Gitea directly: the edit must be visible on the remote.
  # This is the AC1 assertion ("commit zichtbaar op Gitea").
  # =========================================================================
  verify:
    - gitea_repo_exists: true
    - file_exists: SANDBOX_E2E.md
    - file_contains:
        path: SANDBOX_E2E.md
        content: "SANDBOX-GVISOR-E2E-OK-4f2a9c"
