## Tool Test: Data Access MCP - Download Data Unknown
## Tests error handling for unknown source

tool-test:
  name: data-access-download-data-unknown
  description: "Download data from unknown source returns error"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: data_access:download_data
      arguments:
        source_id: "nonexistent-source"
        data_id: "some.table"
        destination: "test-output.csv"
      assert:
        result:
          - json_parseable
          - {contains: "error"}