## Tool Test: Data Access MCP - Get Schema Unknown
## Tests error handling for unknown source

tool-test:
  name: data-access-get-schema-unknown
  description: "Get schema from unknown source returns error"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: data_access:get_schema
      arguments:
        source_id: "nonexistent-source"
        data_id: "some.table"
      assert:
        result:
          - json_parseable
          - {contains: "error"}