          # Builder Plan: Vergunningzoeker

          ## Solution Strategy
          FastAPI backend (conform Druppie-template) met React frontend. Gebruik van Druppie SDK voor OCR en LLM.
          PostgreSQL met full-text search (tsvector). Upload verwerkt ZIP archieven. Asynchrone documentverwerking
          met status pending_review. Medewerker keurt metadata goed (approved). Audit logging voor alle acties.
          Autorisatie op afdelingsniveau via headers.

          ## Module Integration
          - `module-vision` → `druppie.call("vision", "ocr", ...)`
          - `module-llm` → `druppie.call("llm", "chat", ...)` met selectielijst-context
          - Geen hardcoded API keys, gebruik alléén de SDK.

          ## Code Standards
          - Python 3.11, FastAPI
          - React 18, TypeScript, Vite
          - SQLAlchemy 2.0 (async?), maar voor nu sync met background threads.
          - Selectielijst gedefinieerd in `app/archive_rules.py`, hergebruikt in backend en frontend (als API).

          ## Test Framework
          pytest met FastAPI TestClient, SQLite in-memory.

          ## Files to Create/Modify
          - `app/models.py` — Permit, AuditLog, UploadBatch met volledige kolommen, search_vector, GIN index
          - `app/database.py` — engine, session, init_db met create_all
          - `app/routes.py` — alle endpoints inclusief ZIP upload, document download, goedkeuring, audit logging, autorisatie dependency
          - `app/archive_rules.py` — SELECTIELIJST en helper functies
          - `app/agent.py` — chat agent (search + synthesize)
          - `Dockerfile` — multi-stage build
          - `frontend/src/App.tsx` — volledige UI met tabs: zoeken (geavanceerd filter), upload (ZIP ondersteuning), chat, detail/approval weergave
          - `tests/test_routes.py` — uitgebreide tests

