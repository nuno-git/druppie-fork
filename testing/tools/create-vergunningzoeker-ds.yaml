          - path: app/archive_rules.py
            content: |
              SELECTIELIJST = {
                  "watervergunning_lozing": {"nominatie": "vernietigen", "jaren": 20},
                  "watervergunning_onttrekking": {"nominatie": "vernietigen", "jaren": 20},
                  "keurvergunning": {"nominatie": "vernietigen", "jaren": 10},
                  "omgevingsvergunning": {"nominatie": "bewaren", "jaren": None},
                  "lozingsvergunning": {"nominatie": "vernietigen", "jaren": 20},
                  "onttrekkingsvergunning": {"nominatie": "vernietigen", "jaren": 15},
                  "projectplan": {"nominatie": "bewaren", "jaren": None},
                  "peilbesluit": {"nominatie": "bewaren", "jaren": None},
                  "leggerwijziging": {"nominatie": "bewaren", "jaren": None},
              }

              def resolve_selectielijst_key(permit_type, permit_subtype, extracted_text=None):
                  """Bepaal de beste sleutel uit de selectielijst op basis van type/subtype/tekst."""
                  subtype = (permit_subtype or "").strip().lower().replace(" ", "_")
                  ptype = (permit_type or "").strip().lower().replace(" ", "_")
                  if subtype in SELECTIELIJST:
                      return subtype
                  if ptype in SELECTIELIJST:
                      return ptype
                  # fallback: prefix match
                  for key in SELECTIELIJST:
                      if key.startswith(ptype) or ptype.startswith(key):
                          return key
                  return None

              def compute_archive_details(selectielijst_key, issue_date_str):
                  """Bereken archiefnominatie, retentie en status tekst."""
                  if not selectielijst_key:
                      return {"nominatie": "onbekend", "jaren": None, "status_tekst": "onbekend"}
                  entry = SELECTIELIJST.get(selectielijst_key)
                  if not entry:
                      return {"nominatie": "onbekend", "jaren": None, "status_tekst": "onbekend"}
                  nominatie = entry["nominatie"]
                  jaren = entry["jaren"]
                  status_tekst = "onbekend"
                  if nominatie == "bewaren":
                      status_tekst = "te bewaren (oneindig)"
                  elif nominatie == "vernietigen" and jaren and issue_date_str:
                      try:
                          from datetime import date
                          issue = date.fromisoformat(issue_date_str)
                          destroy_date = issue.replace(year=issue.year + jaren)
                          today = date.today()
                          if today >= destroy_date:
                              status_tekst = "te vernietigen"
                          else:
                              status_tekst = f"te bewaren tot {destroy_date.isoformat()}"
                      except Exception:
                          status_tekst = f"te bewaren ({jaren} jaar na uitgifte)"
                  else:
                      status_tekst = f"te bewaren ({jaren} jaar na uitgifte)" if jaren else "onbekend"
                  return {"nominatie": nominatie, "jaren": jaren, "status_tekst": status_tekst}

          - path: app/authorization.py
            content: |
              from fastapi import Header, HTTPException, Depends

              ALLOWED_GROUPS = {"vergunningen", "planning"}

              def verify_department(x_forwarded_groups: str = Header(None)):
                  if not x_forwarded_groups:
                      raise HTTPException(status_code=401, detail="Niet geautoriseerd (geen groepen header)")
                  groups = set(g.strip() for g in x_forwarded_groups.split(","))
                  if not groups.intersection(ALLOWED_GROUPS):
                      raise HTTPException(status_code=403, detail="Toegang geweigerd: afdeling niet geautoriseerd")
                  return groups

