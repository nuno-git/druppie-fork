        content: |
          # Technical Design — Vergunningzoeker

          > Platform standards: conforms to [docs/platform-technical-standards.md](./platform-technical-standards.md) rev 2026-04-20.

          ## Introduction

          ### Subject
          De vergunningzoeker is een webtoepassing voor waterschap-medewerkers die vergunningen uit historische bronnen
          (PDF's, gescande documenten, andere bestanden) verzamelt via upload, automatisch verwerkt met OCR en LLM-extractie,
          doorzoekbaar maakt, en na menselijke validatie opslaat.

          ### Problem Summary
          Vergunningdata bestaat uit verspreide PDF's, gescande documenten en andere bestanden met verschillende
          nummeringssystemen. Medewerkers kunnen oude vergunningen niet uniform doorzoeken en archiefstatussen zijn onbekend.

          ### Functional Question
          Hoe kunnen we alle vergunningbestanden centraal verzamelen, automatisch verwerken tot doorzoekbare metadata,
          met archiefstatus-inzicht en een goedkeuringsflow, toegankelijk voor geautoriseerde medewerkers van specifieke afdelingen?

          ## Solution

          ### Applied Principles (NORA)
          - Foundations: Archiefwet, selectielijst waterschappen 2012, duurzame toegankelijkheid.
          - Organization: Waterschap eigenaar van data.
          - Information: OCR+LLM extractie, PostgreSQL full-text search, selectielijst als context.
          - Application: Druppie-template (React, FastAPI, PostgreSQL). Services: upload, documentverwerking, zoek, goedkeuring, autorisatie, auditlog.
          - Security & Privacy: PII beschermd via afdelingsautorisatie (Keycloak headers), geen binaries in DB, auditlogging.

          ### Requirements (subset)
          - FR-01 t/m FR-11: zoeken, filteren, metadata weergave, archiefinfo, document download.
          - NFR-01 t/m NFR-06: performance, load, usability, PII, auditlog.
          - TR-01 t/m TR-15: technische eisen (tsvector, ZIP upload, asynchrone verwerking, pending_review, goedkeuring, autorisatie, auditlog, documentopslag).

          ### Component Structure
          - **Uploadservice**: individuele bestanden en ZIP upload, uitpakken, opslaan in lokale storage, start asynchrone verwerking.
          - **Documentverwerkingsservice**: asynchrone pipeline: module-vision.ocr → module-llm.chat (met selectielijst-context) → opslag metadata met status pending_review.
          - **Zoekservice**: full-text search via tsvector, filter op status en alle metadata-velden, markeert niet-goedgekeurde resultaten.
          - **Goedkeuringsservice**: medewerker bewerkt metadata en keurt goed. Status wordt approved, ready_for_migration wordt true.
          - **Autorisatieservice**: check op afdelingsheaders (Keycloak).
          - **Auditlogservice**: logt uploads, zoekacties, goedkeuringen.

          ### Data Model
          - **permit**: kernentiteit met kolommen id, permit_number, applicant_name, permit_holder_name, issuer_name, location,
            issue_date, validity_date, applicable_law, work_type, surface_water_type, water_barrier_type,
            source_system, document_path, search_vector (tsvector, GIN index), archive_nomination, retention_period_years,
            status (pending_review / approved), ready_for_migration (bool), ocr_text, created_at, updated_at, reviewed_at, reviewed_by.
          - **audit_log**: id, user_id, action_type, action_details, timestamp.
          - **upload_batch**: id, user_id, file_count, status (processing/completed/failed), created_at.

          ### Integration
          - OCR: reuse module-vision
          - LLM: reuse module-llm
          - Authenticatie: Keycloak headers (X-Forwarded-Groups)
          - Zaaksysteem: out of scope v1, voorbereid met ready_for_migration flag

          ### Visualization
          (diagrams included in separate diagrams.md)

