          - path: frontend/src/App.tsx
            content: |
              import { useState, useEffect, useRef, useCallback } from "react"
              import { Button } from "@/components/ui/button"
              import { Card, CardContent, CardHeader, CardTitle, CardDescription } from "@/components/ui/card"
              import { Input } from "@/components/ui/input"
              import { ChatPanel } from "@/components/chat"

              interface PermitSummary {
                id: number; permit_number: string; applicant_name: string
                permit_type: string; location: string; source_system: string
                status: string; ready_for_migration: boolean
                archive_statustext: string; issue_date: string; validity_date: string; created_at: string
              }

              interface PermitDetail extends PermitSummary {
                permit_holder_name: string; issuer_name: string
                applicable_law: string; work_type: string
                surface_water_type: string; water_barrier_type: string
                archive_nomination: string; retention_period_years: number | null
                ocr_text: string | null; document_path: string
                reviewed_at: string | null; reviewed_by: string | null
              }

              function App() {
                const [tab, setTab] = useState<"search" | "upload" | "chat">("search")
                const [permits, setPermits] = useState<PermitSummary[]>([])
                const [query, setQuery] = useState("")
                const [filters, setFilters] = useState<Record<string,string>>({})
                const [detail, setDetail] = useState<PermitDetail | null>(null)
                const [loading, setLoading] = useState(true)
                // Upload
                const [file, setFile] = useState<File | null>(null)
                const [uploading, setUploading] = useState(false)
                const [uploadErr, setUploadErr] = useState<string | null>(null)
                const fileRef = useRef<HTMLInputElement>(null)
                // Chat handled by ChatPanel

                const load = useCallback(async () => {
                  const params = new URLSearchParams()
                  if (query) params.set("q", query)
                  Object.entries(filters).forEach(([k,v]) => { if(v) params.set(k, v) })
                  const url = params.toString() ? `/api/permits/search?${params}` : "/api/permits"
                  try {
                    const r = await fetch(url, { headers: { "X-Forwarded-Groups": "vergunningen" } })
                    if (r.ok) setPermits(await r.json())
                  } finally { setLoading(false) }
                }, [query, filters])

                useEffect(() => { load() }, [load])
                useEffect(() => {
                  if (!permits.some(p => p.status === "processing" || p.status === "pending_review")) return
                  const id = setInterval(() => load(), 5000)
                  return () => clearInterval(id)
                }, [permits, load])

                const uploadFile = async () => {
                  if (!file) return
                  setUploading(true); setUploadErr(null)
                  const fd = new FormData()
                  fd.append("file", file)
                  try {
                    const r = await fetch("/api/permits/upload", {
                      method: "POST", body: fd,
                      headers: { "X-Forwarded-Groups": "vergunningen" },
                    })
                    const d = await r.json()
                    if (!r.ok) { setUploadErr(d.detail || d.error); return }
                    setFile(null)
                    if (fileRef.current) fileRef.current.value = ""
                    load()
                    setTab("search")
                  } catch { setUploadErr("Verbindingsfout") } finally { setUploading(false) }
                }

                const openDetail = async (id: number) => {
                  const r = await fetch(`/api/permits/${id}`, { headers: { "X-Forwarded-Groups": "vergunningen" } })
                  if (r.ok) setDetail(await r.json())
                }

                const approvePermit = async (id: number, updates: Record<string, string>) => {
                  const r = await fetch(`/api/permits/${id}/approve`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-Forwarded-Groups": "vergunningen" },
                    body: JSON.stringify(updates),
                  })
                  if (r.ok) {
                    setDetail(await r.json())
                    load()
                  }
                }

                const downloadDocument = (id: number) => {
                  window.open(`/api/permits/${id}/document`, "_blank")
                }

                return (
                  <div className="min-h-screen bg-background">
                    <header className="border-b bg-card">
                      <div className="container mx-auto flex h-14 items-center justify-between px-4">
                        <h1 className="text-lg font-bold">Vergunningzoeker</h1>
                        <div className="flex gap-1">
                          {(["search", "upload", "chat"] as const).map(t => (
                            <Button key={t} variant={tab === t ? "default" : "ghost"} size="sm" onClick={() => setTab(t)}>
                              {t === "search" ? `Zoeken (${permits.length})` : t === "upload" ? "Uploaden" : "Assistent"}
                            </Button>
                          ))}
                        </div>
                      </div>
                    </header>
                    <main className="container mx-auto px-4 py-6 max-w-4xl space-y-4">
                      {tab === "search" && <>
                        <Card>
                          <CardContent className="pt-5 space-y-2">
                            <div className="flex gap-2">
                              <Input value={query} onChange={e => setQuery(e.target.value)} placeholder="Volledige tekst zoeken..." />
                              <Button onClick={load}>Zoek</Button>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                              <Input placeholder="Aanvrager" value={filters.applicant_name || ""}
                                onChange={e => setFilters(f => ({...f, applicant_name: e.target.value}))} />
                              <Input placeholder="Vergunningnummer" value={filters.permit_number || ""}
                                onChange={e => setFilters(f => ({...f, permit_number: e.target.value}))} />
                              <Input placeholder="Locatie" value={filters.location || ""}
                                onChange={e => setFilters(f => ({...f, location: e.target.value}))} />
                              <Input placeholder="Status (pending_review/approved)" value={filters.status || ""}
                                onChange={e => setFilters(f => ({...f, status: e.target.value}))} />
                            </div>
                          </CardContent>
                        </Card>
                        <Card>
                          <CardContent className="pt-5">
                            {loading ? <p className="text-center py-4">Laden...</p>
                            : permits.length === 0 ? <p className="text-center py-4">Geen resultaten.</p>
                            : <div className="divide-y">{permits.map(p => (
                              <div key={p.id} className="flex items-center gap-3 py-3 cursor-pointer hover:bg-muted/50 rounded px-2"
                                   onClick={() => openDetail(p.id)}>
                                <div className="flex-1 min-w-0">
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <span className="font-medium">{p.permit_number || "onbekend"}</span>
                                    <span className={`text-xs px-1.5 py-0.5 rounded ${
                                      p.status === "approved" ? "bg-green-100 text-green-800" :
                                      "bg-yellow-100 text-yellow-800"}`}>
                                      {p.status === "approved" ? "Goedgekeurd" : "Nog niet gecontroleerd"}
                                    </span>
                                    {p.ready_for_migration && <span className="text-xs bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded">Klaar voor migratie</span>}
                                    <span className="text-xs bg-gray-100 text-gray-800 px-1.5 py-0.5 rounded">{p.archive_statustext}</span>
                                  </div>
                                  <div className="text-xs text-muted-foreground mt-0.5">
                                    {p.applicant_name && <span>{p.applicant_name} · </span>}
                                    {p.location && <span>{p.location} · </span>}
                                    {p.permit_type && <span>{p.permit_type}</span>}
                                  </div>
                                </div>
                              </div>
                            ))}</div>}
                          </CardContent>
                        </Card>
                      </>}
                      {tab === "upload" && <Card>
                        <CardHeader><CardTitle>Document(en) uploaden</CardTitle>
                        <CardDescription>Upload een bestand (PDF, JPG, PNG, TIFF) of een ZIP-bestand met meerdere documenten.</CardDescription></CardHeader>
                        <CardContent className="space-y-3">
                          <div className="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer"
                               onClick={() => fileRef.current?.click()}>
                            <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.tiff,.bmp,.webp,.zip" className="hidden"
                                   onChange={e => e.target.files?.[0] && setFile(e.target.files[0])} />
                            {file ? <div><p className="font-medium">{file.name}</p><p className="text-sm text-muted-foreground">{(file.size/1024).toFixed(0)} KB</p></div>
                            : <p className="text-muted-foreground">Sleep een bestand of klik om te selecteren</p>}
                          </div>
                          <Button onClick={uploadFile} disabled={uploading || !file} className="w-full">
                            {uploading ? "Bezig met uploaden en analyseren..." : "Upload & Verwerken"}
                          </Button>
                          {uploadErr && <div className="text-sm text-red-600 bg-red-50 p-3 rounded">{uploadErr}</div>}
                        </CardContent>
                      </Card>}
                      {tab === "chat" && <div className="h-[calc(100vh-8rem)]"><ChatPanel /></div>}
                      {detail && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={() => setDetail(null)}>
                        <Card className="w-full max-w-3xl max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                          <CardHeader>
                            <div className="flex items-center justify-between">
                              <CardTitle>{detail.permit_number || detail.id}</CardTitle>
                              <div className="flex gap-2">
                                {detail.status !== "approved" && <Button size="sm" onClick={() => {
                                  const update = {
                                    permit_number: detail.permit_number || "",
                                    applicant_name: detail.applicant_name || "",
                                    location: detail.location || "",
                                    issue_date: detail.issue_date || "",
                                    validity_date: detail.validity_date || "",
                                  }
                                  approvePermit(detail.id, update)
                                }}>Goedkeuren</Button>}
                                {detail.document_path && <Button variant="outline" size="sm" onClick={() => downloadDocument(detail.id)}>Document downloaden</Button>}
                                <Button variant="ghost" size="sm" onClick={() => setDetail(null)}>Sluiten</Button>
                              </div>
                            </div>
                          </CardHeader>
                          <CardContent className="space-y-4">
                            <div className="grid grid-cols-2 gap-3">
                              {detail.permit_number && <MetaRow label="Vergunningnummer" value={detail.permit_number} />}
                              {detail.applicant_name && <MetaRow label="Aanvrager" value={detail.applicant_name} />}
                              {detail.permit_holder_name && <MetaRow label="Houder" value={detail.permit_holder_name} />}
                              {detail.issuer_name && <MetaRow label="Uitgever" value={detail.issuer_name} />}
                              {detail.location && <MetaRow label="Locatie" value={detail.location} />}
                              {detail.applicable_law && <MetaRow label="Toepasselijke wet" value={detail.applicable_law} />}
                              {detail.work_type && <MetaRow label="Type werk" value={detail.work_type} />}
                              {detail.surface_water_type && <MetaRow label="Type oppervlaktewater" value={detail.surface_water_type} />}
                              {detail.water_barrier_type && <MetaRow label="Type waterkering" value={detail.water_barrier_type} />}
                              <MetaRow label="Archiefnominatie" value={detail.archive_nomination} />
                              <MetaRow label="Retentie (jaren)" value={detail.retention_period_years?.toString() || ""} />
                              <MetaRow label="Archiefstatus" value={detail.archive_statustext} />
                              <MetaRow label="Status" value={detail.status} />
                              <MetaRow label="Klaar voor migratie" value={detail.ready_for_migration ? "Ja" : "Nee"} />
                            </div>
                            {detail.ocr_text && <div>
                              <p className="text-xs font-medium uppercase">Geëxtraheerde tekst</p>
                              <pre className="p-3 bg-muted rounded text-xs whitespace-pre-wrap max-h-48 overflow-y-auto">{detail.ocr_text}</pre>
                            </div>}
                          </CardContent>
                        </Card>
                      </div>}
                    </main>
                  </div>
                )
              }

              function MetaRow({ label, value }: { label: string; value: string }) {
                return value ? <div><p className="text-xs uppercase text-muted-foreground">{label}</p><p className="text-sm">{value}</p></div> : null
              }

              export default App

    - agent: builder
      tool: builtin:done
      arguments:
        summary: "Agent builder: BUILD_COMPLETE. Implemented complete vergunningzoeker with OCR, LLM, approval, full-text search, ZIP handling, audit logging."

    # =========================================================================
    # Planner → Test Executor
    # =========================================================================
    - agent: planner
      tool: builtin:make_plan
      arguments:
        steps:
          - agent_id: test_executor
            prompt: "Run all tests"
          - agent_id: planner
            prompt: "Re-evaluate after test_executor completes"

    - agent: planner
      tool: builtin:done
      arguments:
        summary: "Agent planner: Planned test_executor"

    # =========================================================================
    # Test Executor (mocked — tests pass)
    # =========================================================================
    - agent: test_executor
      tool: coding:run_tests
      mock: true
      mock_result: '{"success": true, "output": "8 passed, 0 failed", "exit_code": 0}'

    - agent: test_executor
      tool: coding:get_coverage_report
      mock: true
      mock_result: '{"coverage": 82, "lines_covered": 140, "lines_total": 171}'

    - agent: test_executor
      tool: builtin:test_report
      mock: true
      mock_result: '{"status": "ok"}'
      arguments:
        total: 8
        passed: 8
        failed: 0
        coverage: 82
        summary: "All 8 tests passed with 82% coverage."

    - agent: test_executor
      tool: builtin:done
      arguments:
        summary: "Agent test_executor: TEST RESULT: PASS — 8/8 tests passed, 82% coverage."

    # =========================================================================
    # Planner → Deployer
    # =========================================================================
    - agent: planner
      tool: builtin:make_plan
      arguments:
        steps:
          - agent_id: deployer
            prompt: "Deploy the vergunningzoeker from main branch"
          - agent_id: planner
            prompt: "Re-evaluate after deployer completes"

    - agent: planner
      tool: builtin:done
      arguments:
        summary: "Agent planner: Tests passed, planned deployer"

    # =========================================================================
    # Deployer (REAL — actually deploys the app)
    # =========================================================================
    - agent: deployer
      tool: docker:list_containers

    - agent: deployer
      tool: docker:compose_up
      approval:
        status: approved
        by: developer
      arguments:
        compose_project_name: vergunningzoeker
        branch: main
      assert:
        result:
          - not_empty
          - { contains: "success" }

    - agent: deployer
      tool: builtin:done
      arguments:
        summary: "Agent deployer: Deployed vergunningzoeker from main."

    # =========================================================================
    # Planner → Summarizer
    # =========================================================================
    - agent: planner
      tool: builtin:make_plan
      arguments:
        steps:
          - agent_id: summarizer
            prompt: "Summarize what was accomplished"

    - agent: planner
      tool: builtin:done
      arguments:
        summary: "Agent planner: Planned summarizer"

    # =========================================================================
    # Summarizer
    # =========================================================================
    - agent: summarizer
      tool: builtin:create_message
      arguments:
        content: |
          De **vergunningzoeker** is succesvol gebouwd en gedeployed!

          **Nieuwe functionaliteiten t.o.v. vorige versie:**
          - **ZIP upload** — meerdere documenten tegelijk verwerken
          - **Full-text search** (tsvector) en uitgebreide filters
          - **Goedkeuringsworkflow** — metadata bewerken en goedkeuren (status `approved`, ready_for_migration = true)
          - **Document download** — originele bestanden direct openen
          - **Audit logging** — alle acties worden gelogd
          - **Afdeling-autorisatie** — toegang beperkt tot vergunningen/planning via headers
          - **Archiefstatus** automatisch berekend o.b.v. selectielijst waterschappen
          - **NORA-compliance** (Privacy by Design, duurzame toegankelijkheid)

          **Technische basis:** React + FastAPI, PostgreSQL met GIN index, OCR/LLM via Druppie SDK, Docker.

          De app is actief — controleer de deployer tool call voor de URL.

    - agent: summarizer
      tool: builtin:done
      arguments:
        summary: "Agent summarizer: Presented completion summary to user."
      assert:
        completed: true

  # Verify side-effects in Gitea
  verify:
    - gitea_repo_exists: true
    - file_exists: docs/functional-design.md
    - file_exists: docs/technical-design.md
    - file_exists: docs/builder-plan.md
    - file_not_empty: docs/functional-design.md
    - file_not_empty: docs/technical-design.md
    - file_not_empty: docs/builder-plan.md
    - file_contains:
        path: docs/technical-design.md
        content: "druppie_sdk"
    - file_contains:
        path: docs/technical-design.md
        content: "tsvector"
    - file_contains:
        path: docs/builder-plan.md
        content: "ZIP"
    - file_contains:
        path: docs/builder-plan.md
        content: "pending_review"