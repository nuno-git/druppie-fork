                  description = fields.String(validate=validate.Length(max=5000))
                  status = fields.String(validate=validate.OneOf(["todo", "in_progress", "review", "done"]))
                  priority = fields.String(validate=validate.OneOf(["low", "medium", "high", "critical"]))
                  assignee_id = fields.String(allow_none=True)
                  due_date = fields.Date(allow_none=True)
                  labels = fields.List(fields.String(validate=validate.Length(max=50)), validate=validate.Length(max=10))


              class CommentCreateSchema(Schema):
                  author = fields.String(required=True, validate=validate.Length(min=1, max=100))
                  content = fields.String(required=True, validate=validate.Length(min=1, max=5000))


