              """Marshmallow schemas for request validation and response serialization."""
              from marshmallow import Schema, fields, validate, validates, ValidationError


              class ProjectCreateSchema(Schema):
                  name = fields.String(required=True, validate=validate.Length(min=1, max=100))
                  description = fields.String(validate=validate.Length(max=2000))


              class ProjectUpdateSchema(Schema):
                  name = fields.String(validate=validate.Length(min=1, max=100))
                  description = fields.String(validate=validate.Length(max=2000))
                  status = fields.String(validate=validate.OneOf(["active", "archived"]))


              class TaskCreateSchema(Schema):
                  title = fields.String(required=True, validate=validate.Length(min=1, max=200))
                  description = fields.String(validate=validate.Length(max=5000))
                  priority = fields.String(validate=validate.OneOf(["low", "medium", "high", "critical"]))
                  assignee_id = fields.String()
                  due_date = fields.Date()
                  labels = fields.List(fields.String(validate=validate.Length(max=50)), validate=validate.Length(max=10))


              class TaskUpdateSchema(Schema):
