## Setup: project with substantial codebase to test context compression
##
## Creates a Flask API project with multiple source files, tests, and large design docs.
## The developer agent gets a complex task (add auth + RBAC) that requires reading
## all existing files and making many changes — enough to trigger context compression
## at >50% of max_context_tokens.

tool-test:
  name: setup-context-compression
  description: "Setup project with large codebase for context compression testing"
  tags: [setup, context-compression, agent-runtime]

  chain:
    # --- Router ---
    - agent: router
      tool: builtin:set_intent
      arguments:
        intent: create_project
        project_name: task-api-compression-test
        description: "A Flask REST API for task management — used to test agent context compression"

    - agent: router
      tool: builtin:done
      arguments:
        summary: "Agent router: Classified as create_project"

    # --- Planner -> BA ---
    - agent: planner
      tool: builtin:make_plan
      arguments:
        steps:
          - agent_id: business_analyst
            prompt: "Create functional design for task management API"
          - agent_id: planner
            prompt: "Re-evaluate after BA"

    - agent: planner
      tool: builtin:done
      arguments:
        summary: "Agent planner: Planned business_analyst"

    # --- Business Analyst (large FD) ---
    - agent: business_analyst
      tool: coding:submit_design_for_review
      approval:
        status: approved
      arguments:
        path: docs/functional-design.md
        content: |
          # Functional Design: Task Management API

          ## 1. Project Overview

          A RESTful API for managing tasks, projects, and team assignments.
          The system allows users to create projects, add tasks to projects,
          assign tasks to team members, track status changes, add comments,
          and generate reports.

          ## 2. User Stories

          ### 2.1 Project Management
          - US-01: As a user, I can create a new project with a name and description
          - US-02: As a user, I can list all projects I have access to
          - US-03: As a user, I can update project details (name, description, status)
          - US-04: As a user, I can archive a project (soft delete)
          - US-05: As a user, I can view project statistics (task count, completion rate)

          ### 2.2 Task Management
          - US-10: As a user, I can create a task within a project
          - US-11: As a user, I can assign a task to a team member
          - US-12: As a user, I can change task status (todo, in_progress, review, done)
          - US-13: As a user, I can set task priority (low, medium, high, critical)
          - US-14: As a user, I can set a due date on a task
          - US-15: As a user, I can add labels/tags to tasks
          - US-16: As a user, I can filter tasks by status, priority, assignee, or label
          - US-17: As a user, I can search tasks by title or description
          - US-18: As a user, I can view task history (status changes, assignments)

          ### 2.3 Comments
          - US-20: As a user, I can add a comment to a task
          - US-21: As a user, I can edit my own comments
          - US-22: As a user, I can delete my own comments
          - US-23: As a user, I can view all comments on a task in chronological order

          ### 2.4 Reporting
          - US-30: As a user, I can view a dashboard with project-level metrics
          - US-31: As a user, I can export tasks as CSV
          - US-32: As a user, I can view overdue tasks across all projects

          ## 3. Data Model

          ### Project
          | Field | Type | Required | Description |
          |-------|------|----------|-------------|
          | id | UUID | auto | Primary key |
          | name | string(100) | yes | Project name |
          | description | text | no | Project description |
          | status | enum | yes | active, archived |
          | created_at | datetime | auto | Creation timestamp |
          | updated_at | datetime | auto | Last update |

          ### Task
          | Field | Type | Required | Description |
          |-------|------|----------|-------------|
          | id | UUID | auto | Primary key |
          | project_id | UUID | yes | FK to Project |
          | title | string(200) | yes | Task title |
          | description | text | no | Detailed description |
          | status | enum | yes | todo, in_progress, review, done |
          | priority | enum | yes | low, medium, high, critical |
          | assignee_id | UUID | no | FK to User (future) |
          | due_date | date | no | Deadline |
          | labels | json | no | List of label strings |
          | created_at | datetime | auto | Creation timestamp |
          | updated_at | datetime | auto | Last update |

          ### Comment
          | Field | Type | Required | Description |
          |-------|------|----------|-------------|
          | id | UUID | auto | Primary key |
          | task_id | UUID | yes | FK to Task |
          | author | string | yes | Author name |
          | content | text | yes | Comment body |
          | created_at | datetime | auto | Creation timestamp |
          | updated_at | datetime | auto | Last update |

          ## 4. API Endpoints

          ### Projects
          - POST /api/projects — Create project
          - GET /api/projects — List all projects
          - GET /api/projects/:id — Get project details with stats
          - PUT /api/projects/:id — Update project
          - DELETE /api/projects/:id — Archive project

          ### Tasks
          - POST /api/projects/:id/tasks — Create task in project
          - GET /api/projects/:id/tasks — List tasks (with filtering)
          - GET /api/tasks/:id — Get task details
          - PUT /api/tasks/:id — Update task
          - DELETE /api/tasks/:id — Delete task
          - GET /api/tasks/search?q= — Search tasks

          ### Comments
          - POST /api/tasks/:id/comments — Add comment
          - GET /api/tasks/:id/comments — List comments
          - PUT /api/comments/:id — Edit comment
          - DELETE /api/comments/:id — Delete comment

          ### Reports
          - GET /api/dashboard — Dashboard metrics
          - GET /api/projects/:id/export — Export tasks as CSV

          ## 5. Validation Rules
          - Project name: 1-100 characters, unique per user
          - Task title: 1-200 characters
          - Task status transitions: todo->in_progress->review->done (and back)
          - Comment content: 1-5000 characters
          - Due date: must be in the future when set
          - Labels: max 10 per task, each max 50 characters

          ## 6. Non-Functional Requirements
          - NFR-01: API response time < 200ms for list operations
          - NFR-02: Pagination on all list endpoints (default 20, max 100)
          - NFR-03: Proper error responses with consistent format
          - NFR-04: Input validation on all endpoints
          - NFR-05: CORS support for frontend integration

