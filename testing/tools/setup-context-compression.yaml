              """Project CRUD endpoints."""
              from flask import Blueprint, request, jsonify
              from src.models import db, Project
              from src.schemas import ProjectCreateSchema, ProjectUpdateSchema
              from src.utils import paginate_query, validation_error

              projects_bp = Blueprint("projects", __name__)


              @projects_bp.route("/projects", methods=["POST"])
              def create_project():
                  schema = ProjectCreateSchema()
                  errors = schema.validate(request.json or {})
                  if errors:
                      return validation_error(errors)

                  data = schema.load(request.json)
                  existing = Project.query.filter_by(name=data["name"]).first()
                  if existing:
                      return jsonify({"error": {"code": "conflict", "message": "Project name already exists"}}), 409

                  project = Project(**data)
                  db.session.add(project)
                  db.session.commit()
                  return jsonify({"data": project.to_dict()}), 201


              @projects_bp.route("/projects", methods=["GET"])
              def list_projects():
                  query = Project.query.filter_by(status="active").order_by(Project.created_at.desc())
                  return paginate_query(query, Project)


              @projects_bp.route("/projects/<project_id>", methods=["GET"])
              def get_project(project_id):
                  project = Project.query.get_or_404(project_id)
                  data = project.to_dict()
                  total_tasks = len(project.tasks)
                  done_tasks = sum(1 for t in project.tasks if t.status == "done")
                  data["stats"] = {
                      "total_tasks": total_tasks,
                      "done_tasks": done_tasks,
                      "completion_rate": round(done_tasks / total_tasks * 100, 1) if total_tasks else 0,
                  }
                  return jsonify({"data": data})


              @projects_bp.route("/projects/<project_id>", methods=["PUT"])
              def update_project(project_id):
                  project = Project.query.get_or_404(project_id)
                  schema = ProjectUpdateSchema()
                  errors = schema.validate(request.json or {})
                  if errors:
                      return validation_error(errors)

                  data = schema.load(request.json)
                  for key, value in data.items():
                      setattr(project, key, value)
                  db.session.commit()
                  return jsonify({"data": project.to_dict()})


              @projects_bp.route("/projects/<project_id>", methods=["DELETE"])
              def archive_project(project_id):
                  project = Project.query.get_or_404(project_id)
                  project.status = "archived"
                  db.session.commit()
                  return jsonify({"data": project.to_dict()})

