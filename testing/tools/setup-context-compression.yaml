              from src.models import db, Comment, Task
              from src.schemas import CommentCreateSchema, CommentUpdateSchema
              from src.utils import paginate_query, validation_error

              comments_bp = Blueprint("comments", __name__)


              @comments_bp.route("/tasks/<task_id>/comments", methods=["POST"])
              def create_comment(task_id):
                  Task.query.get_or_404(task_id)
                  schema = CommentCreateSchema()
                  errors = schema.validate(request.json or {})
                  if errors:
                      return validation_error(errors)

                  data = schema.load(request.json)
                  comment = Comment(task_id=task_id, **data)
                  db.session.add(comment)
                  db.session.commit()
                  return jsonify({"data": comment.to_dict()}), 201


              @comments_bp.route("/tasks/<task_id>/comments", methods=["GET"])
              def list_comments(task_id):
                  Task.query.get_or_404(task_id)
                  query = Comment.query.filter_by(task_id=task_id).order_by(Comment.created_at.asc())
                  return paginate_query(query, Comment)


              @comments_bp.route("/comments/<comment_id>", methods=["PUT"])
              def update_comment(comment_id):
                  comment = Comment.query.get_or_404(comment_id)
                  schema = CommentUpdateSchema()
                  errors = schema.validate(request.json or {})
                  if errors:
                      return validation_error(errors)

                  data = schema.load(request.json)
                  comment.content = data["content"]
                  db.session.commit()
                  return jsonify({"data": comment.to_dict()})


              @comments_bp.route("/comments/<comment_id>", methods=["DELETE"])
              def delete_comment(comment_id):
                  comment = Comment.query.get_or_404(comment_id)
                  db.session.delete(comment)
                  db.session.commit()
                  return "", 204

