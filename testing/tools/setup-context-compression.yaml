            content: |
              """Reporting and dashboard endpoints."""
              import csv
              import io
              from flask import Blueprint, jsonify, make_response
              from src.models import db, Project, Task

              reports_bp = Blueprint("reports", __name__)


              @reports_bp.route("/dashboard", methods=["GET"])
              def dashboard():
                  projects = Project.query.filter_by(status="active").all()
                  total_tasks = Task.query.count()
                  done_tasks = Task.query.filter_by(status="done").count()
                  overdue_tasks = Task.query.filter(
                      Task.due_date < db.func.current_date(),
                      Task.status != "done",
                  ).count()

                  return jsonify({
                      "data": {
                          "active_projects": len(projects),
                          "total_tasks": total_tasks,
                          "done_tasks": done_tasks,
                          "overdue_tasks": overdue_tasks,
                          "completion_rate": round(done_tasks / total_tasks * 100, 1) if total_tasks else 0,
                      }
                  })


              @reports_bp.route("/projects/<project_id>/export", methods=["GET"])
              def export_tasks(project_id):
                  project = Project.query.get_or_404(project_id)
                  tasks = Task.query.filter_by(project_id=project_id).all()

                  output = io.StringIO()
                  writer = csv.writer(output)
                  writer.writerow(["ID", "Title", "Status", "Priority", "Assignee", "Due Date", "Labels"])
                  for task in tasks:
                      writer.writerow([
                          task.id, task.title, task.status, task.priority,
                          task.assignee_id or "", task.due_date or "",
                          ",".join(task.labels or []),
                      ])

                  response = make_response(output.getvalue())
                  response.headers["Content-Type"] = "text/csv"
                  response.headers["Content-Disposition"] = f"attachment; filename={project.name}-tasks.csv"
                  return response

