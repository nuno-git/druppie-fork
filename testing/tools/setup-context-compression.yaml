              """Task CRUD, filtering, and search endpoints."""
              from flask import Blueprint, request, jsonify
              from src.models import db, Task, Project
              from src.schemas import TaskCreateSchema, TaskUpdateSchema
              from src.utils import paginate_query, validation_error

              tasks_bp = Blueprint("tasks", __name__)


              @tasks_bp.route("/projects/<project_id>/tasks", methods=["POST"])
              def create_task(project_id):
                  Project.query.get_or_404(project_id)
                  schema = TaskCreateSchema()
                  errors = schema.validate(request.json or {})
                  if errors:
                      return validation_error(errors)

                  data = schema.load(request.json)
                  task = Task(project_id=project_id, **data)
                  db.session.add(task)
                  db.session.commit()
                  return jsonify({"data": task.to_dict()}), 201


              @tasks_bp.route("/projects/<project_id>/tasks", methods=["GET"])
              def list_tasks(project_id):
                  Project.query.get_or_404(project_id)
                  query = Task.query.filter_by(project_id=project_id)

                  status = request.args.get("status")
                  if status:
                      statuses = status.split(",")
                      query = query.filter(Task.status.in_(statuses))

                  priority = request.args.get("priority")
                  if priority:
                      query = query.filter_by(priority=priority)

                  assignee = request.args.get("assignee_id")
                  if assignee:
                      query = query.filter_by(assignee_id=assignee)

                  label = request.args.get("label")
                  if label:
                      query = query.filter(Task.labels.contains(label))

                  query = query.order_by(Task.created_at.desc())
                  return paginate_query(query, Task)


              @tasks_bp.route("/tasks/<task_id>", methods=["GET"])
              def get_task(task_id):
                  task = Task.query.get_or_404(task_id)
                  return jsonify({"data": task.to_dict()})


              @tasks_bp.route("/tasks/<task_id>", methods=["PUT"])
              def update_task(task_id):
                  task = Task.query.get_or_404(task_id)
                  schema = TaskUpdateSchema()
                  errors = schema.validate(request.json or {})
                  if errors:
                      return validation_error(errors)

                  data = schema.load(request.json)
                  for key, value in data.items():
                      setattr(task, key, value)
                  db.session.commit()
                  return jsonify({"data": task.to_dict()})


              @tasks_bp.route("/tasks/<task_id>", methods=["DELETE"])
              def delete_task(task_id):
                  task = Task.query.get_or_404(task_id)
                  db.session.delete(task)
                  db.session.commit()
                  return "", 204


              @tasks_bp.route("/tasks/search", methods=["GET"])
              def search_tasks():
                  q = request.args.get("q", "")
                  if not q:
                      return jsonify({"data": [], "meta": {"total": 0, "page": 1, "per_page": 20}})

                  query = Task.query.filter(
                      db.or_(
                          Task.title.ilike(f"%{q}%"),
                          Task.description.ilike(f"%{q}%"),
                      )
                  ).order_by(Task.created_at.desc())
                  return paginate_query(query, Task)

