    - agent: architect
      tool: coding:submit_design_for_review
      approval:
        status: approved
        by: architect
      arguments:
        path: docs/technical-design.md
        content: |
          # Technical Design: Task Management API

          ## 1. Technology Stack
          - Language: Python 3.12
          - Framework: Flask 3.x with Blueprints
          - Database: SQLite (via SQLAlchemy ORM)
          - Validation: marshmallow
          - Testing: pytest + pytest-cov
          - CORS: flask-cors

          ## 2. Architecture

          ```
          src/
            app.py          — Flask app factory, CORS, error handlers
            config.py       — Configuration (DB path, pagination defaults)
            models.py       — SQLAlchemy models (Project, Task, Comment)
            schemas.py      — Marshmallow schemas for validation/serialization
            routes/
              projects.py   — Project CRUD endpoints
              tasks.py      — Task CRUD + search + filtering
              comments.py   — Comment CRUD endpoints
              reports.py    — Dashboard + CSV export
            utils.py        — Pagination helper, error formatter, UUID gen
          tests/
            conftest.py     — Fixtures (app, client, sample data)
            test_projects.py
            test_tasks.py
            test_comments.py
            test_reports.py
          ```

          ## 3. Database Schema

          Using SQLAlchemy declarative models with SQLite backend.
          Auto-migrate on startup (create_all).

          ### Relationships
          - Project 1:N Task (cascade delete)
          - Task 1:N Comment (cascade delete)

          ### Indexes
          - Task.project_id (FK lookup)
          - Task.status (filtering)
          - Task.assignee_id (filtering)
          - Task.due_date (overdue queries)
          - Comment.task_id (FK lookup)

          ## 4. API Design Patterns

          ### Request/Response Format
          All responses follow: {"data": ..., "meta": {"total": N, "page": N, "per_page": N}}
          Errors follow: {"error": {"code": "...", "message": "...", "details": [...]}}

          ### Pagination
          Query params: ?page=1&per_page=20
          Default per_page=20, max=100

          ### Filtering (Tasks)
          Query params: ?status=todo&priority=high&assignee_id=UUID&label=bug
          Multiple values: ?status=todo,in_progress

          ### Search
          GET /api/tasks/search?q=keyword
          Searches title and description with LIKE matching

          ## 5. Error Handling
          - 400: Validation errors (with field-level details)
          - 404: Resource not found
          - 409: Conflict (duplicate project name)
          - 500: Internal error (logged, generic message to client)

          ## 6. Testing Strategy
          - Unit tests for each endpoint using pytest fixtures
          - In-memory SQLite for test isolation
          - Fixture-based sample data (projects, tasks, comments)
          - Coverage target: 80%+

