## Test: bash commands in the coding sandbox
##
## Verifies that the coding sandbox provides:
## - uv package manager
## - git
## - Python, Node.js
## - Cache volume at /cache
## - Writable /workspace
## - Root user inside container
## - Custom timeout support
##
## Run: POST /api/evaluations/run-tests {"test_name": "test-sandbox-bash"}

tool-test:
  name: test-sandbox-bash
  description: |
    Tests bash commands in the coding sandbox.
    Verifies: uv, git, cache volume, Python, Node, workspace writable, custom timeout.
  tags: [sandbox, bash, e2e]

  chain:
    # Test 1: whoami — should be root inside container
    - agent: builder
      tool: coding:bash
      arguments:
        command: "whoami"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "root" }

    # Test 2: uv package manager available
    - agent: builder
      tool: coding:bash
      arguments:
        command: "uv --version"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "uv" }

    # Test 3: git available
    - agent: builder
      tool: coding:bash
      arguments:
        command: "git --version"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "git version" }

    # Test 4: Cache volume mounted at /cache
    - agent: builder
      tool: coding:bash
      arguments:
        command: "test -d /cache && echo '/cache directory exists'"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "/cache directory exists" }

    # Test 5: Python available
    - agent: builder
      tool: coding:bash
      arguments:
        command: "python3 --version"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "Python" }

    # Test 6: Node.js available
    - agent: builder
      tool: coding:bash
      arguments:
        command: "node --version"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "v" }

    # Test 7: Short timeout — quick command with 5s timeout
    - agent: builder
      tool: coding:bash
      arguments:
        command: "echo 'timeout test passed'"
        timeout: 5
        git_scope: "current_project"
      assert:
        result:
          - { contains: "timeout test passed" }

    # Test 8: Workspace writable — write, read, cleanup
    - agent: builder
      tool: coding:bash
      arguments:
        command: "echo 'sandbox-test-file' > /workspace/test.txt && cat /workspace/test.txt && rm /workspace/test.txt"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "sandbox-test-file" }
