## Tool Test: Data Access MCP - read_data
## read_data against a source_id that isn't configured must surface
## {success: false, error: ...} rather than raising.

tool-test:
  name: data-access-read-data-unknown-source
  description: "read_data against an unknown source returns {success: false, error}"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: dataaccess:read_data
      arguments:
        source_id: "nonexistent-source"
        data_id: "some.table"
      assert:
        result:
          - json_parseable
          - {matches: "\"success\"\\s*:\\s*false"}
          - {contains: "error"}
