## Test: docker compose up -d --build --profile dev in the coding sandbox
##
## Verifies that the coding sandbox provides:
## - docker compose CLI (v2 plugin) with --profile support
## - Ability to create compose files with profiles and Dockerfiles
## - docker compose up -d --build --profile <name> (build image + start with profile)
## - docker compose ps (verify running containers)
## - docker compose logs (check container output)
## - docker compose down (cleanup)
## - Full docker-in-docker via Sysbox
##
## Run: POST /api/evaluations/run-tests {"test_name": "test-sandbox-docker-compose"}

tool-test:
  name: test-sandbox-docker-compose
  description: |
    Tests docker compose with profiles and build in the coding sandbox via router→planner→builder pipeline.
    Verifies: compose CLI with profile support, Dockerfile build, compose up with --build --profile, container verification, logs, cleanup.
  tags: [sandbox, docker-compose, e2e, profiles, build]

  chain:
    # =========================================================================
    # Router — create project for sandbox context
    # =========================================================================
    - agent: router
      tool: builtin:set_intent
      arguments:
        intent: create_project
        project_name: sandbox-compose-test
        description: "Test project for sandbox docker compose with profiles and build"
      assert:
        result:
          - not_empty

    - agent: router
      tool: builtin:done
      arguments:
        summary: "Agent router: Classified as create_project for sandbox-compose-test"

    # =========================================================================
    # Planner → Builder
    # =========================================================================
    - agent: planner
      tool: builtin:make_plan
      arguments:
        steps:
          - agent_id: builder
            prompt: "Run docker compose commands with profiles and build to verify sandbox Docker-in-Docker capabilities"

    - agent: planner
      tool: builtin:done
      arguments:
        summary: "Agent planner: Planned builder for sandbox docker compose test with profiles and build"

    # =========================================================================
    # Builder — docker compose tests with profiles and build
    # =========================================================================

    # Test 1: docker compose version — verify compose v2 plugin is available
    - agent: builder
      tool: coding:bash
      approval:
        status: approved
        by: architect
      arguments:
        command: "docker compose version"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "Docker Compose version" }

    # Test 2: Create a realistic docker-compose.yml WITH profiles and a simple Dockerfile
    - agent: builder
      tool: coding:bash
      approval:
        status: approved
        by: architect
      arguments:
        command: |
          mkdir -p /workspace/test-build && cat > /workspace/test-build/docker-compose.yml << 'EOF'
          services:
            app:
              build: .
              profiles:
                - dev
          EOF
          cat > /workspace/test-build/Dockerfile << 'EOF'
          FROM alpine:latest
          RUN echo "build test"
          CMD ["echo", "hello from build"]
          EOF
          echo "--- docker-compose.yml ---"
          cat /workspace/test-build/docker-compose.yml
          echo "--- Dockerfile ---"
          cat /workspace/test-build/Dockerfile
          echo "--- files created ---"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "profiles" }
          - { contains: "dev" }
          - { contains: "FROM alpine" }

    # Test 3: docker compose up -d --build --profile dev — build image and start with profile
    - agent: builder
      tool: coding:bash
      approval:
        status: approved
        by: architect
      arguments:
        command: "cd /workspace/test-build && docker compose --profile dev up -d --build 2>&1"
        timeout: 120
        git_scope: "current_project"
      assert:
        result:
          - not_empty

    # Test 4: Verify container is/was running with docker compose ps
    - agent: builder
      tool: coding:bash
      approval:
        status: approved
        by: architect
      arguments:
        command: "cd /workspace/test-build && docker compose --profile dev ps -a 2>&1"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "app" }

    # Test 5: Check logs — app container should have output
    - agent: builder
      tool: coding:bash
      approval:
        status: approved
        by: architect
      arguments:
        command: "cd /workspace/test-build && docker compose --profile dev logs app 2>&1"
        timeout: 30
        git_scope: "current_project"
      assert:
        result:
          - { contains: "hello from build" }

    # Test 6: Cleanup — docker compose down
    - agent: builder
      tool: coding:bash
      approval:
        status: approved
        by: architect
      arguments:
        command: "cd /workspace/test-build && docker compose --profile dev down --rmi local --remove-orphans 2>&1"
        timeout: 60
        git_scope: "current_project"
      assert:
        result:
          - not_empty

    # Done
    - agent: builder
      tool: builtin:done
      arguments:
        summary: "Sandbox docker compose tests completed: version, profile compose file + Dockerfile creation, --profile dev up -d --build, ps, logs, down"
      assert:
        completed: true
