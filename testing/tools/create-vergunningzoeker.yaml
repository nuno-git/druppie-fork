        content: |
          # Builder Plan: Vergunningzoeker

          ## Solution Strategy
          Flask backend met React frontend op het Druppie template. OCR via module-vision, metadata-extractie via module-llm met selectielijst-context. Goedkeuringsflow met pending_review -> approved. Full-text search via PostgreSQL tsvector.

          ## Module Integration
          - **SDK**: `druppie_sdk` (pre-installed pip package)
          - **Usage**: `from druppie_sdk import DruppieClient; druppie = DruppieClient()`
          - **Modules Used**:
            - `vision/ocr` -- OCR tekst extractie uit gescande vergunningdocumenten (PDF/afbeelding)
            - `llm/chat` -- Metadata-extractie (alle velden) + selectielijst-classificatie
          - **Key Patterns**:
            ```python
            # OCR
            ocr_result = druppie.call("vision", "ocr", {"image_source": data_uri, "prompt": "Extraheer alle tekst uit dit vergunningdocument."})
            extracted_text = ocr_result.get("text", "")

            # Metadata extraction with selectielijst context
            meta_result = druppie.call("llm", "chat", {
                "prompt": METADATA_EXTRACTION_PROMPT + extracted_text,
                "system": "Metadata-extractie specialist voor Nederlandse watervergunningen. Antwoord ALLEEN met valid JSON."
            })
            ```
          - **No API Keys**: app gebruikt GEEN hardcoded API keys
          - **No openai package**: gebruik druppie.call() via SDK

          ## Data Model

          ### permit
          - id: Integer (PK, autoincrement)
          - permit_number: String -- vergunningnummer (K-xxxx, L-xxxx, etc.)
          - applicant_name: String -- aanvrager
          - permit_holder_name: String -- vergunninghouder
          - issuer_name: String -- uitgever/verlener
          - location: String -- locatie/adres
          - issue_date: Date -- uitgiftedatum
          - validity_date: Date -- geldigheidsdatum
          - applicable_law: String -- toepasselijke wet
          - work_type: String -- type werk/activiteit
          - surface_water_type: String -- type oppervlaktewater
          - water_barrier_type: String -- type waterkering
          - source_file: String -- bestandsnaam
          - source_system: String -- bronsysteem
          - document_path: String -- pad naar lokaal bestand
          - ocr_text: Text -- OCR output
          - search_vector: tsvector -- full-text search index (GIN)
          - archive_nomination: String -- bewaren/vernietigen
          - retention_period_years: Integer -- retentieperiode
          - archive_status: String -- huidige archiefstatus
          - status: String -- pending_review / approved
          - ready_for_migration: Boolean (default false) -- vlag voor zaaksysteem
          - permit_type: String -- geclassificeerd type
          - error_message: Text -- foutmelding indien verwerking mislukt
          - upload_date: DateTime
          - created_at: DateTime
          - updated_at: DateTime
          - reviewed_at: DateTime
          - reviewed_by: String

          ### audit_log
          - id: Integer (PK)
          - user_id: String
          - action_type: String -- upload / search / approve
          - action_details: Text
          - timestamp: DateTime

          ### upload_batch
          - id: Integer (PK)
          - user_id: String
          - file_count: Integer
          - status: String -- processing / completed / failed
          - created_at: DateTime

          ## API Endpoints
          - POST /api/permits/upload -- upload document(en) (incl. ZIP), start asynchrone OCR+LLM verwerking
          - GET /api/permits -- lijst van vergunningen met summary metadata
          - GET /api/permits/search?q=term -- full-text search over alle metadata-velden
          - GET /api/permits/:id -- detail van een vergunning incl. OCR tekst
          - POST /api/permits/:id/approve -- metadata goedkeuren + status -> approved
          - GET /api/permits/:id/document -- origineel document downloaden
          - GET /api/permits/stats -- statistieken
          - DELETE /api/permits/:id -- verwijderen
          - POST /api/permits/:id/retry -- opnieuw verwerken

          ## Frontend
          - Zoektab: zoekresultaten met pending_review marker (amber), archive status, ready_for_migration
          - Uploadtab: drag/drop met ZIP ondersteuning, compatibele bestandsformaten vermelding
          - Detailmodal: alle metadata velden, OCR tekst weergave, goedkeur knop (alleen pending_review), download knop voor origineel document

