        content: |
          # Technical Design -- Vergunningzoeker

          > Platform standards: conforms to [docs/platform-technical-standards.md](./platform-technical-standards.md) rev 2026-04-20.

          ## Introduction

          ### Subject

          De vergunningzoeker is een webtoepassing voor waterschap-medewerkers die vergunningen uit historische bronnen (PDF's, gescande documenten, andere bestanden) verzamelt via upload, automatisch verwerkt met OCR en LLM-extractie, doorzoekbaar maakt, en na menselijke validatie opslaat. Migratie naar het zaaksysteem is **out of scope** voor nu en wordt in een latere fase opgepakt wanneer netwerktoegang tot het zaaksysteem beschikbaar is.

          ### Problem Summary

          Vergunningdata bestaat uit verspreide PDF's, gescande documenten en andere bestanden met verschillende nummeringssystemen. Medewerkers kunnen oude vergunningen niet uniform doorzoeken en archiefstatussen zijn onbekend. Het systeem automatiseert metadata-extractie, biedt uitgebreid zoeken en filteren over alle documenten, en combineert menselijke goedkeuring in een flow.

          ### Functional Question (from FD by Business Analyst)

          Hoe kunnen we alle vergunningbestanden centraal verzamelen, automatisch verwerken tot doorzoekbare metadata, met archiefstatus-inzicht en een goedkeuringsflow, toegankelijk voor geautoriseerde medewerkers van specifieke afdelingen?

          ### Research

          Gebaseerd op [docs/technical-research.md](./technical-research.md). Gekozen benadering: **B -- Automatische extractie met PostgreSQL full-text search + uitgebreide filtering**. Zie het onderzoeksdocument voor de vergelijking van alternatieven en de externe-koppelingen analyse.

          ## Solution

          ### Applied Principles (per NORA layer)

          * **Foundations:** De Archiefwet verplicht waterschappen om retentieperiodes en archiefnominaties correct toe te passen. De selectielijst voor waterschappen (2012) is de leidende referentie. Principe 21 (duurzame toegankelijkheid) eist dat informatieobjecten traceerbaar en vindbaar zijn.
          * **Organization:** Het waterschap is eigenaar van de vergunningdata (Principe 3). De toepassing ondersteunt het vergunningverleningsproces.
          * **Information:** Bronbestanden worden geupload, via OCR en LLM verwerkt tot gestructureerde metadata, en opgeslagen in PostgreSQL. Persoonsgegevens (namen, adressen) zijn aanwezig en vereisen Privacy by Design (Principe 22). De selectielijst wordt als context aan de LLM meegegeven.
          * **Application:** De toepassing volgt het Druppie-template (React frontend, FastAPI backend, PostgreSQL). Nieuwe componenten: upload-service, documentverwerking-service (OCR + LLM), zoekservice, goedkeuringsservice. Alle data wordt in de applicatie zelf opgeslagen.
          * **Security & Privacy:** PII wordt beschermd door toegangsbeperking tot geautoriseerde afdelingen via Keycloak-headers, geen opslag van documentbinaries in de database (alleen paden), en auditlogging van alle acties.

          ### Requirements

          | ID | Source | Requirement | Verification Method |
          |----|--------|-------------|---------------------|
          | FR-01 | BA | Het systeem stelt gebruikers in staat om via een enkel zoekvak te zoeken over alle metadata-velden tegelijk. | Functional test |
          | FR-02 | BA | Het systeem biedt een geavanceerde zoekoptie met filters voor specifieke metadata-velden. | Functional test |
          | FR-03 | BA | Het systeem indexeert en doorzoekt metadata van: aanvrager naam, vergunninghouder naam, uitgever naam, locatie, datums, vergunningnummer (K, L, enz.), toepasselijke wet, type werk, type oppervlaktewater, type waterkering. | Functional test |
          | FR-04 | BA | Het systeem toont bij zoekresultaten alle beschikbare metadata-velden voor elke vergunning. | Functional test |
          | FR-05 | BA | Het systeem stelt gebruikers in staat om gedetailleerde vergunninginformatie te bekijken. | Functional test |
          | FR-06 | BA | Het systeem toont uit welk bronsysteem elke vergunning afkomstig is. | Functional test |
          | FR-07 | BA | Het systeem stelt gebruikers in staat om originele vergunningdocumenten (PDF's, scans) te openen of te downloaden. | Functional test |
          | FR-08 | BA | Het systeem voorziet in toegangsbeperking zodat alleen gebruikers van specifieke afdelingen toegang hebben. | Security test |
          | FR-09 | BA | Het systeem toont de archiefnominatie (bewaren of vernietigen) voor elke vergunning. | Functional test |
          | FR-10 | BA | Het systeem toont de retentieperiode voor elke vergunning indien de archiefnominatie is "vernietigen". | Functional test |
          | FR-11 | BA | Het systeem toont de huidige archiefstatus van elke vergunning. | Functional test |

          ### Architectural Solution

          #### 1. Component Structure (Logical)

          **Nieuwe componenten:**

          | Component | Verantwoordelijkheid |
          |-----------|---------------------|
          | **Uploadservice** | Ontvangt individuele bestanden en ZIP-archieven, pakt ZIP's uit, slaat bestanden op in lokale opslag, start asynchrone verwerking. |
          | **Documentverwerkingsservice** | Asynchrone pipeline: (1) OCR via `module-vision.ocr`, (2) metadata-extractie via `module-llm.chat` met selectielijst-context. Slaat voorgestelde metadata op met status `pending_review`. |
          | **Zoekservice** | Uitgebreid zoeken en filteren over alle vergunningen. Full-text zoek (tsvector) en filtering op metadata-velden en status. Markeert niet-goedgekeurde resultaten. |
          | **Goedkeuringsservice** | Medewerker bewerkt/controleert voorgestelde metadata en keurt goed. Status wordt `approved`. Bij goedkeuring wordt een `ready_for_migration`-vlag gezet ter voorbereiding op toekomstige zaaksysteem-integratie. |
          | **Autorisatieservice** | Controleert afdelingslidmaatschap uit Keycloak-headers. |
          | **Auditlogservice** | Registreert alle acties met gebruiker, timestamp en details. |

          **Hergebruik:**
          - Druppie project-template (frontend + backend scaffold, PostgreSQL, Docker Compose)
          - `module-vision` (OCR -- bestaand)
          - `module-llm` (metadata-extractie -- bestaand)
          - Platform-authenticatie (Keycloak via headers)

          #### 2. Data Architecture & Integration

          **Data Model:**

          - **permit** -- Kernentiteit. Kolommen: id, permit_number, applicant_name, permit_holder_name, issuer_name, location, issue_date, validity_date, applicable_law, work_type, surface_water_type, water_barrier_type, source_system, document_path, search_vector (tsvector, GIN-index), archive_nomination, retention_period_years, status (pending_review / approved), ready_for_migration (boolean, default false), ocr_text, created_at, updated_at, reviewed_at, reviewed_by. Bevat PII.
          - **audit_log** -- id, user_id, action_type (upload / search / approve), action_details, timestamp.
          - **upload_batch** -- id, user_id, file_count, status (processing / completed / failed), created_at.

          **Integration Points:**

          | Extern systeem | Categorie | Beslissing | Module | Toelichting |
          |----------------|-----------|------------|--------|-------------|
          | OCR-service | other | REUSE | `module-vision` | Bestaande OCR-tool |
          | LLM-service | other | REUSE | `module-llm` | Bestaande chat-tool met selectielijst-context |
          | Authenticatie | organizational | REUSE | Platform-standaard | Keycloak via Druppie |
          | Zaaksysteem | organizational | **Out of scope** | N.v.t. (fase 2) | Wordt gerealiseerd als `module-zaaksysteem` wanneer netwerktoegang beschikbaar is |

          #### 3. Flows

          **Documentverwerking Pipeline:**

          1. Bestand wordt geupload via Uploadservice
          2. Opgeslagen in lokale bestandsopslag
          3. OCR via `module-vision.ocr`: tekst extractie
          4. LLM via `module-llm.chat`: metadata + archiefinfo + selectielijst
          5. Metadata opgeslagen met status `pending_review`
          6. tsvector geupdatet
          7. Direct doorzoekbaar als `pending_review`

          **Goedkeuringsflow:**

          1. Medewerker opent `pending_review` vergunning
          2. Medewerker controleert en bewerkt metadata
          3. Medewerker klikt Goedkeuren
          4. Goedgekeurde metadata opgeslagen, status = `approved`
          5. `ready_for_migration = true`
          6. Auditlog geschreven

          ### Security & Compliance (project-specific only)

          | Aspect | Project-specific measure | Explanation |
          |--------|--------------------------|-------------|
          | PII handling | Metadata bevat namen en adressen. Toegang beperkt tot geautoriseerde afdelingen. | Principe 22: alleen metadata en bestandspaden in DB. |
          | Toegangsbeperking | Afdelingscheck op elk endpoint: alleen "vergunningen" en "planning". | FR-08, NFR-05. |
          | Auditlogging | Alle acties gelogd: upload, zoek, goedkeuring. | NFR-06. |
          | GDPR grondslag | Wettelijke plicht (Archiefwet, vergunningverleningstaak). | Vernietiging na retentieperiode is rechtmatig. |

          ### Platform standard deviations

          | Section | Deviation | Rationale |
          |---------|-----------|-----------|
          | (none) | | |

