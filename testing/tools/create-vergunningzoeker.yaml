          import io
          import json
          import pytest
          from unittest.mock import patch


          OCR_MOCK = {
              "text": "Vergunning K-2019-0042. Aanvrager: J. de Vries. Lozing oppervlaktewater. Locatie: Amsterdam. Uitgegeven: 2019-03-15. Wet: Waterwet. Type: lozing."
          }

          LLM_MOCK = {
              "answer": json.dumps({
                  "permit_number": "K-2019-0042",
                  "applicant_name": "J. de Vries",
                  "permit_holder_name": "J. de Vries",
                  "issuer_name": "Waterschap",
                  "location": "Amsterdam",
                  "issue_date": "2019-03-15",
                  "validity_date": "2029-03-15",
                  "applicable_law": "Waterwet",
                  "work_type": "lozing",
                  "surface_water_type": "oppervlaktewater",
                  "water_barrier_type": "",
                  "permit_type": "watervergunning",
                  "permit_subtype": "watervergunning_lozing",
                  "source_system": "upload"
              })
          }


          def test_upload_permit(client, auth_headers):
              """File upload should trigger OCR + metadata extraction via SDK."""
              with patch("app.routes.druppie") as mock_druppie:
                  mock_druppie.call.side_effect = [OCR_MOCK, LLM_MOCK]
                  data = {
                      "file": (io.BytesIO(b"fake image data"), "scan.jpg"),
                  }
                  resp = client.post(
                      "/api/permits/upload",
                      data=data,
                      content_type="multipart/form-data",
                      headers=auth_headers,
                  )
                  assert resp.status_code == 200
                  result = resp.get_json()
                  assert "id" in result
                  assert result["status"] == "processing"
                  assert mock_druppie.call.call_count == 2


          def test_upload_without_auth(client):
              """Upload should fail without authorization headers."""
              data = {"file": (io.BytesIO(b"test"), "test.jpg")}
              resp = client.post(
                  "/api/permits/upload",
                  data=data,
                  content_type="multipart/form-data",
              )
              assert resp.status_code == 403


          def test_search_permits(client, auth_headers):
              """Search should return matching permits."""
              with patch("app.routes.druppie") as mock_druppie:
                  mock_druppie.call.side_effect = [OCR_MOCK, LLM_MOCK]
                  data = {"file": (io.BytesIO(b"test"), "test.jpg")}
                  client.post(
                      "/api/permits/upload",
                      data=data,
                      content_type="multipart/form-data",
                      headers=auth_headers,
                  )
              resp = client.get("/api/permits?q=test", headers=auth_headers)
              assert resp.status_code == 200


          def test_list_permits(client, auth_headers):
              """List should return all permits."""
              resp = client.get("/api/permits", headers=auth_headers)
              assert resp.status_code == 200
              data = resp.get_json()
              assert isinstance(data, list)


          def test_get_permit_detail(client, auth_headers):
              """Detail endpoint should return full permit data."""
              with patch("app.routes.druppie") as mock_druppie:
                  mock_druppie.call.side_effect = [OCR_MOCK, LLM_MOCK]
                  data = {"file": (io.BytesIO(b"test"), "test.jpg")}
                  r = client.post(
                      "/api/permits/upload",
                      data=data,
                      content_type="multipart/form-data",
                      headers=auth_headers,
                  )
                  permit_id = r.get_json()["id"]
              resp = client.get(f"/api/permits/{permit_id}", headers=auth_headers)
              assert resp.status_code == 200
              detail = resp.get_json()
              assert detail["status"] in ("processing", "processed", "pending_review")
              assert "permit_number" in detail


          def test_approve_permit(client, auth_headers):
              """Approve should change status to approved and set ready_for_migration."""
              from app.database import SessionLocal
              from app.models import Permit
              from datetime import date

              with patch("app.routes.druppie") as mock_druppie:
                  mock_druppie.call.side_effect = [OCR_MOCK, LLM_MOCK]
                  data = {"file": (io.BytesIO(b"test"), "test.jpg")}
                  r = client.post(
                      "/api/permits/upload",
                      data=data,
                      content_type="multipart/form-data",
                      headers=auth_headers,
                  )
                  permit_id = r.get_json()["id"]

              # Manually set status to pending_review for testing
              db = SessionLocal()
              try:
                  permit = db.query(Permit).filter(Permit.id == permit_id).first()
                  permit.status = "pending_review"
                  permit.issue_date = date(2019, 3, 15)
                  db.commit()
              finally:
                  db.close()

              resp = client.post(
                  f"/api/permits/{permit_id}/approve",
                  json={"applicant_name": "Goedgekeurd: J. de Vries"},
                  headers=auth_headers,
              )
              assert resp.status_code == 200
              result = resp.get_json()
              assert result["status"] == "approved"
              assert result["ready_for_migration"] is True
              assert result["applicant_name"] == "Goedgekeurd: J. de Vries"


          def test_approve_permit_access_denied(client, auth_headers):
              """Only authorized departments can approve."""
              wrong_headers = {
                  "X-User-Id": "test-user",
                  "X-User-Afdeling": "financien",
                  "X-User-Name": "Test Gebruiker",
              }
              resp = client.post("/api/permits/1/approve", json={}, headers=wrong_headers)
              assert resp.status_code == 403


          def test_stats(client, auth_headers):
              """Stats endpoint should return aggregated data."""
              resp = client.get("/api/permits/stats", headers=auth_headers)
              assert resp.status_code == 200
              data = resp.get_json()
              assert "total" in data
              assert "by_type" in data
              assert "by_archive" in data

