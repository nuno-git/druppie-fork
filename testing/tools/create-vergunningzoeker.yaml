              from datetime import datetime, date, timezone

              from sqlalchemy import Column, Date, DateTime, Integer, String, Text, Boolean, ForeignKey
              from sqlalchemy.dialects.postgresql import TSVECTOR
              from sqlalchemy.orm import relationship

              from app.database import Base


              class Permit(Base):
                  __tablename__ = "permits"

                  id = Column(Integer, primary_key=True, autoincrement=True)
                  # Core identification
                  permit_number = Column(String(100), nullable=True, index=True)
                  source_file = Column(String(500), nullable=True)
                  source_system = Column(String(100), nullable=True)

                  # Extracted metadata (FR-03)
                  applicant_name = Column(String(200), nullable=True, index=True)
                  permit_holder_name = Column(String(200), nullable=True)
                  issuer_name = Column(String(200), nullable=True)
                  location = Column(String(300), nullable=True, index=True)
                  issue_date = Column(Date, nullable=True)
                  validity_date = Column(Date, nullable=True)
                  applicable_law = Column(String(200), nullable=True)
                  work_type = Column(String(200), nullable=True)
                  surface_water_type = Column(String(200), nullable=True)
                  water_barrier_type = Column(String(200), nullable=True)

                  # AI classification
                  permit_type = Column(String(100), nullable=True, index=True)

                  # Archive compliance (FR-09/10/11)
                  archive_nomination = Column(String(50), nullable=True)  # bewaren / vernietigen
                  retention_period_years = Column(Integer, nullable=True)
                  archive_status = Column(String(100), nullable=True)

                  # Full text
                  ocr_text = Column(Text, nullable=True)

                  # Full-text search vector
                  search_vector = Column(TSVECTOR, nullable=True)

                  # Document path (local storage, not in DB)
                  document_path = Column(String(500), nullable=True)

                  # Processing
                  status = Column(String(50), default="processing")
                  error_message = Column(Text, nullable=True)
                  ready_for_migration = Column(Boolean, default=False, nullable=False)
                  upload_date = Column(DateTime, default=lambda: datetime.now(timezone.utc))
                  created_at = Column(DateTime, default=lambda: datetime.now(timezone.utc))
                  updated_at = Column(DateTime, default=lambda: datetime.now(timezone.utc), onupdate=lambda: datetime.now(timezone.utc))
                  reviewed_at = Column(DateTime, nullable=True)
                  reviewed_by = Column(String(200), nullable=True)

                  # Relationships
                  audit_logs = relationship("AuditLog", back_populates="permit", cascade="all, delete-orphan")


              class AuditLog(Base):
                  __tablename__ = "audit_logs"

                  id = Column(Integer, primary_key=True, autoincrement=True)
                  user_id = Column(String(200), nullable=True)
                  action_type = Column(String(50), nullable=False)  # upload / search / approve / download
                  action_details = Column(Text, nullable=True)
                  permit_id = Column(Integer, ForeignKey("permits.id", ondelete="CASCADE"), nullable=True, index=True)
                  created_at = Column(DateTime, default=lambda: datetime.now(timezone.utc))

                  permit = relationship("Permit", back_populates="audit_logs")


              class UploadBatch(Base):
                  __tablename__ = "upload_batches"

                  id = Column(Integer, primary_key=True, autoincrement=True)
                  user_id = Column(String(200), nullable=True)
                  file_count = Column(Integer, default=0)
                  status = Column(String(50), default="processing")  # processing / completed / failed
                  created_at = Column(DateTime, default=lambda: datetime.now(timezone.utc))

