              import base64
              import io
              import json
              import logging
              import os
              import threading
              import uuid
              import zipfile
              from datetime import date, datetime, timezone, timedelta
              from pathlib import Path

              from flask import Blueprint, jsonify, request, send_file
              from druppie_sdk import DruppieClient
              from sqlalchemy import text

              from app.database import SessionLocal, get_db
              from app.models import Permit, AuditLog, UploadBatch

              logger = logging.getLogger(__name__)
              api = Blueprint("api", __name__)

              ALLOWED_EXTENSIONS = {"png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "pdf"}
              MAX_FILE_SIZE = 50 * 1024 * 1024  # 50 MB
              UPLOAD_DIR = Path("uploads")
              UPLOAD_DIR.mkdir(exist_ok=True)

              SELECTIELIJST = {
                  "watervergunning_lozing": {"nominatie": "vernietigen", "jaren": 20},
                  "watervergunning_onttrekking": {"nominatie": "vernietigen", "jaren": 20},
                  "keurvergunning": {"nominatie": "vernietigen", "jaren": 10},
                  "omgevingsvergunning": {"nominatie": "bewaren", "jaren": None},
                  "lozingsvergunning": {"nominatie": "vernietigen", "jaren": 20},
                  "onttrekkingsvergunning": {"nominatie": "vernietigen", "jaren": 15},
                  "projectplan": {"nominatie": "bewaren", "jaren": None},
                  "peilbesluit": {"nominatie": "bewaren", "jaren": None},
                  "leggerwijziging": {"nominatie": "bewaren", "jaren": None},
              }

              METADATA_EXTRACTION_PROMPT = """Analyseer het volgende vergunningdocument en extraheer de metadata.
              Antwoord ALLEEN met een JSON object met deze velden (laat leeg als niet gevonden):

              {
                "permit_number": "vergunningnummer (K-xxxx, L-xxxx, etc.)",
                "applicant_name": "naam aanvrager",
                "permit_holder_name": "naam vergunninghouder",
                "issuer_name": "naam uitgever/verlener",
                "location": "locatie/adres",
                "issue_date": "uitgiftedatum (YYYY-MM-DD)",
                "validity_date": "geldigheidsdatum (YYYY-MM-DD)",
                "applicable_law": "toepasselijke wet of regeling",
                "work_type": "type werk/activiteit",
                "surface_water_type": "type oppervlaktewater",
                "water_barrier_type": "type waterkering",
                "permit_type": "type vergunning (watervergunning, keurvergunning, omgevingsvergunning, etc.)",
                "permit_subtype": "specifiek type uit de selectielijst (watervergunning_lozing, watervergunning_onttrekking, keurvergunning, omgevingsvergunning, lozingsvergunning, onttrekkingsvergunning, projectplan, peilbesluit, leggerwijziging). Bepaal uit de documenttekst welke subtype het beste past.",
                "source_system": "bronsysteem indien herkenbaar"
              }

              Document tekst:
              """


              def _check_authorization():
                  """Check afdeling header for authorization."""
                  user_id = request.headers.get("X-User-Id", "").strip()
                  afdeling = request.headers.get("X-User-Afdeling", "").strip().lower()
                  if not user_id and not afdeling:
                      return jsonify(error="Geen autorisatie headers. Voeg X-User-Id en X-User-Afdeling headers toe."), 401
                  if not afdeling:
                      return jsonify(error="Geen afdeling opgegeven. Voeg X-User-Afdeling header toe."), 401
                  allowed = {"vergunningen", "planning"}
                  if afdeling not in allowed:
                      return jsonify(error=f"Afdeling '{afdeling}' niet geautoriseerd. Toegestaan: {', '.join(allowed)}"), 403
                  return None


              def _allowed_file(fn):
                  return "." in fn and fn.rsplit(".", 1)[1].lower() in ALLOWED_EXTENSIONS


              def _save_file(file_bytes, filename):
                  """Save file to local storage and return the relative path."""
                  ext = filename.rsplit(".", 1)[1].lower() if "." in filename else "bin"
                  safe_name = f"{uuid.uuid4().hex}.{ext}"
                  file_path = UPLOAD_DIR / safe_name
                  file_path.write_bytes(file_bytes)
                  return str(file_path)


              def _resolve_selectielijst_key(permit_type, permit_subtype, ocr_text=None):
                  """Resolve permit type/subtype to a SELECTIELIJST key, with retry."""
                  subtype = (permit_subtype or "").strip().lower().replace(" ", "_")
                  if subtype in SELECTIELIJST:
                      return subtype
                  ptype = (permit_type or "").strip().lower().replace(" ", "_")
                  if ptype in SELECTIELIJST:
                      return ptype
                  for key in SELECTIELIJST:
                      if key.startswith(ptype) or ptype.startswith(key):
                          return key
                  if ocr_text:
                      try:
                          druppie = DruppieClient()
                          keys_str = ", ".join(sorted(SELECTIELIJST.keys()))
                          prompt_body = (
                              'Het document is geclassificeerd als "' + str(permit_type)
                              + '", maar deze term staat niet in de selectielijst. '
                              + "Analyseer de tekst hieronder en bepaal de specifieke subtype uit deze lijst: "
                              + keys_str + ". Antwoord ALLEEN met de subtype key, niets anders.\n\n"
                              + str(ocr_text[:3000])
                          )
                          retry_result = druppie.call("llm", "chat", {
                              "prompt": prompt_body,
                              "system": "Je bepaalt de specifieke vergunning-subtype aan de hand van de documenttekst. Antwoord alleen met de key uit de lijst.",
                          })
                          retry_subtype = (retry_result.get("answer", "") or "").strip().lower().replace(" ", "_")
                          if retry_subtype in SELECTIELIJST:
                              logger.info("Retry resolved '%s' -> '%s'", permit_type, retry_subtype)
                              return retry_subtype
                      except Exception as e:
                          logger.warning("Retry resolution failed for '%s': %s", permit_type, e)
                  return None


              def _compute_archive_status(selectielijst_key, issue_date_str):
                  """Compute archive status from a SELECTIELIJST key and issue date."""
                  if selectielijst_key is None:
                      return "onbekend", None, "onbekend"
                  key = (selectielijst_key or "").strip().lower().replace(" ", "_")
                  info = SELECTIELIJST.get(key, {"nominatie": "onbekend", "jaren": None})
                  nominatie = info["nominatie"]
                  jaren = info["jaren"]
                  status = "onbekend"

                  if nominatie == "bewaren":
                      status = "te bewaren (oneindig)"
                  elif nominatie == "vernietigen" and jaren and issue_date_str:
                      try:
                          issue = date.fromisoformat(issue_date_str)
                          destroy_date = issue.replace(year=issue.year + jaren)
                          if date.today() >= destroy_date:
                              status = "te vernietigen"
                          else:
                              status = f"te bewaren tot {destroy_date.isoformat()}"
                      except (ValueError, OverflowError):
                          status = f"te bewaren ({jaren} jaar na uitgifte)"
                  elif nominatie == "vernietigen":
                      status = f"te bewaren ({jaren} jaar na uitgifte)" if jaren else "onbekend"

                  return nominatie, jaren, status


              def _log_audit(db, user_id, action_type, details=None):
                  """Create an audit log entry."""
                  log = AuditLog(
                      user_id=user_id,
                      action_type=action_type,
                      action_details=details,
                  )
                  db.add(log)


              @api.route("/info")
              def info():
                  from app.config import settings
                  return jsonify(app_name=settings.app_name)


              def _recover_stuck_permits():
                  """Find stuck permits older than cutoff and reset them."""
                  cutoff = datetime.now(timezone.utc) - timedelta(minutes=10)
                  db = SessionLocal()
                  try:
                      stuck = db.query(Permit).filter(
                          Permit.status == "processing",
                          Permit.upload_date < cutoff,
                      ).all()
                      for p in stuck:
                          logger.warning("Recovering stuck permit %s", p.id)
                          p.status = "pending_review"
                      if stuck:
                          db.commit()
                      return len(stuck)
                  except Exception as e:
                      logger.error("Recovery failed: %s", e)
                      db.rollback()
                      return 0
                  finally:
                      db.close()


              def _update_search_vector(db, permit_id):
                  """Update the tsvector column for full-text search."""
                  stmt = text("""
                      UPDATE permits SET search_vector = to_tsvector('dutch', coalesce(permit_number,'') || ' ' ||
                          coalesce(applicant_name,'') || ' ' || coalesce(permit_holder_name,'') || ' ' ||
                          coalesce(issuer_name,'') || ' ' || coalesce(location,'') || ' ' ||
                          coalesce(applicable_law,'') || ' ' || coalesce(work_type,'') || ' ' ||
                          coalesce(surface_water_type,'') || ' ' || coalesce(water_barrier_type,'') || ' ' ||
                          coalesce(ocr_text,''))
                      WHERE id = :id
                  """)
                  db.execute(stmt, {"id": permit_id})
                  db.commit()


              def _process_document(permit_id, file_path):
                  """Background OCR + LLM processing for a single document."""
                  druppie = DruppieClient()
                  db = SessionLocal()
                  try:
                      permit = db.query(Permit).filter(Permit.id == permit_id).first()
                      if not permit:
                          return
                      try:
                          # OCR
                          ocr_result = druppie.call("vision", "ocr", {
                              "image_source": str(file_path),
                          })
                          extracted_text = ocr_result.get("text", "")
                          permit.ocr_text = extracted_text

                          # LLM metadata extractie met selectielijst context
                          keys_str = ", ".join(sorted(SELECTIELIJST.keys()))
                          prompt = (
                              f"Analyseer het volgende vergunningdocument en extraheer metadata. "
                              f"Extraheer: permit_number, applicant_name, permit_holder_name, issuer_name, location, "
                              f"issue_date (YYYY-MM-DD), validity_date (YYYY-MM-DD), applicable_law, work_type, "
                              f"surface_water_type, water_barrier_type, permit_type, permit_subtype. "
                              f"Kies voor permit_subtype een van: {keys_str} als het past. "
                              f"Antwoord ALLEEN met een JSON object.\n\n"
                              f"{extracted_text[:3000]}"
                          )
                          llm_result = druppie.call("llm", "chat", {
                              "prompt": prompt,
                              "system": "Je bent een metadata-extractie specialist. Antwoord uitsluitend met geldige JSON.",
                          })
                          answer = llm_result.get("answer", "{}")
                          # Parse JSON antwoord, eventueel met code blok
                          if "```json" in answer:
                              answer = answer.split("```json")[1].split("```")[0]
                          elif "```" in answer:
                              answer = answer.split("```")[1].split("```")[0]
                          meta = json.loads(answer)

                          # Velden overnemen
                          permit.permit_number = meta.get("permit_number") or permit.permit_number
                          permit.applicant_name = meta.get("applicant_name") or None
                          permit.permit_holder_name = meta.get("permit_holder_name") or None
                          permit.issuer_name = meta.get("issuer_name") or None
                          permit.location = meta.get("location") or None
                          if meta.get("issue_date"):
                              try:
                                  permit.issue_date = date.fromisoformat(meta["issue_date"])
                              except ValueError:
                                  pass
                          if meta.get("validity_date"):
                              try:
                                  permit.validity_date = date.fromisoformat(meta["validity_date"])
                              except ValueError:
                                  pass
                          permit.applicable_law = meta.get("applicable_law") or None
                          permit.work_type = meta.get("work_type") or None
                          permit.surface_water_type = meta.get("surface_water_type") or None
                          permit.water_barrier_type = meta.get("water_barrier_type") or None

                          permit_type = meta.get("permit_type") or "onbekend"
                          permit_subtype = meta.get("permit_subtype") or None
                          key = _resolve_selectielijst_key(permit_type, permit_subtype, extracted_text)
                          if key:
                              nominatie, jaren, status_text = _compute_archive_status(
                                  key, permit.issue_date.isoformat() if permit.issue_date else None
                              )
                              permit.archive_nomination = nominatie
                              permit.retention_period_years = jaren
                          permit.status = "pending_review"
                      except Exception as e:
                          logger.exception("Processing failed for permit %s", permit_id)
                          permit.status = "pending_review"
                      finally:
                          db.commit()
                          _update_search_vector(db, permit_id)
                  finally:
                      db.close()


              def _permit_summary(p):
                  """Return a summary dict for a permit."""
                  key = _resolve_selectielijst_key(
                      p.permit_type, getattr(p, "permit_subtype", None)
                  ) if p.permit_type else None
                  _, _, status_text = _compute_archive_status(
                      key, p.issue_date.isoformat() if p.issue_date else None
                  )
                  return {
                      "id": p.id,
                      "permit_number": p.permit_number,
                      "applicant_name": p.applicant_name,
                      "permit_type": p.permit_type,
                      "location": p.location,
                      "source_system": p.source_system,
                      "status": p.status,
                      "ready_for_migration": p.ready_for_migration,
                      "archive_statustext": status_text,
                      "issue_date": p.issue_date.isoformat() if p.issue_date else None,
                      "validity_date": p.validity_date.isoformat() if p.validity_date else None,
                      "created_at": p.created_at.isoformat() if p.created_at else None,
                  }


              def _permit_detail(p):
                  """Return a detail dict for a permit."""
                  d = _permit_summary(p)
                  d.update({
                      "permit_holder_name": p.permit_holder_name,
                      "issuer_name": p.issuer_name,
                      "applicable_law": p.applicable_law,
                      "work_type": p.work_type,
                      "surface_water_type": p.surface_water_type,
                      "water_barrier_type": p.water_barrier_type,
                      "archive_nomination": p.archive_nomination,
                      "retention_period_years": p.retention_period_years,
                      "ocr_text": p.ocr_text,
                      "document_path": p.document_path,
                      "reviewed_at": p.reviewed_at.isoformat() if p.reviewed_at else None,
                      "reviewed_by": p.reviewed_by,
                  })
                  return d


              @api.route("/permits/upload", methods=["POST"])
              def upload_permit():
                  auth_err = _check_authorization()
                  if auth_err:
                      return auth_err
                  user_id = request.headers.get("X-User-Id", "anonymous")

                  if "file" not in request.files:
                      return jsonify(error="Geen bestand geupload."), 400
                  file = request.files["file"]
                  if not file.filename:
                      return jsonify(error="Geen bestand geupload."), 400

                  ext = file.filename.rsplit(".", 1)[-1].lower() if "." in file.filename else ""
                  db = SessionLocal()
                  try:
                      if ext == "zip":
                          # ZIP upload: uitpakken en elk bestand verwerken
                          contents = file.read()
                          zip_buffer = io.BytesIO(contents)
                          processed = 0
                          batch = UploadBatch(user_id=user_id, file_count=0, status="processing")
                          db.add(batch)
                          db.commit()
                          db.refresh(batch)
                          with zipfile.ZipFile(zip_buffer, "r") as zf:
                              for name in zf.namelist():
                                  inner_ext = name.rsplit(".", 1)[-1].lower() if "." in name else ""
                                  if inner_ext not in ALLOWED_EXTENSIONS:
                                      continue
                                  inner_data = zf.read(name)
                                  safe_name = f"{batch.id}_{name.replace('/', '_')}"
                                  file_path = UPLOAD_DIR / safe_name
                                  file_path.write_bytes(inner_data)
                                  permit = Permit(source_system="upload", document_path=str(file_path), status="processing")
                                  db.add(permit)
                                  db.commit()
                                  db.refresh(permit)
                                  threading.Thread(target=_process_document, args=(permit.id, file_path), daemon=True).start()
                                  processed += 1
                          batch.file_count = processed
                          batch.status = "completed" if processed > 0 else "failed"
                          db.commit()
                          _log_audit(db, user_id, "upload", f"ZIP batch {batch.id} met {processed} bestanden")
                          return jsonify(batch_id=batch.id, file_count=processed, status=batch.status)

                      # Enkel bestand
                      if ext not in ALLOWED_EXTENSIONS:
                          return jsonify(error=f"Ongeldig bestandstype: {ext}. Toegestaan: {', '.join(ALLOWED_EXTENSIONS)}"), 400
                      contents = file.read()
                      if not contents:
                          return jsonify(error="Leeg bestand."), 400

                      saved_path = _save_file(contents, file.filename)
                      permit = Permit(source_system="upload", document_path=saved_path, status="processing")
                      db.add(permit)
                      db.commit()
                      db.refresh(permit)

                      threading.Thread(target=_process_document, args=(permit.id, Path(saved_path)), daemon=True).start()
                      _log_audit(db, user_id, "upload", f"Enkel bestand {file.filename}, permit {permit.id}")
                      return jsonify(id=permit.id, status="processing", filename=file.filename)
                  finally:
                      db.close()


              @api.route("/permits")
              def list_permits():
                  auth_err = _check_authorization()
                  if auth_err:
                      return auth_err
                  db = SessionLocal()
                  try:
                      permits = db.query(Permit).order_by(Permit.created_at.desc()).all()
                      return jsonify([_permit_summary(p) for p in permits])
                  finally:
                      db.close()


              @api.route("/permits/search")
              def search_permits():
                  auth_err = _check_authorization()
                  if auth_err:
                      return auth_err
                  user_id = request.headers.get("X-User-Id", "anonymous")
                  db = SessionLocal()
                  try:
                      query = db.query(Permit)
                      # Full-text search via tsvector
                      q = request.args.get("q")
                      if q:
                          query = query.filter(Permit.search_vector.match(q, postgresql_regconfig="dutch"))
                      # Specifieke filters
                      applicant_name = request.args.get("applicant_name")
                      if applicant_name:
                          query = query.filter(Permit.applicant_name.ilike(f"%{applicant_name}%"))
                      permit_number = request.args.get("permit_number")
                      if permit_number:
                          query = query.filter(Permit.permit_number.ilike(f"%{permit_number}%"))
                      location = request.args.get("location")
                      if location:
                          query = query.filter(Permit.location.ilike(f"%{location}%"))
                      status = request.args.get("status")
                      if status:
                          query = query.filter(Permit.status == status)
                      permit_type = request.args.get("permit_type")
                      if permit_type:
                          query = query.filter(Permit.permit_type.ilike(f"%{permit_type}%"))
                      results = query.order_by(Permit.created_at.desc()).limit(200).all()
                      _log_audit(db, user_id, "search", f"q={q}, filters: applicant={applicant_name}, status={status}")
                      return jsonify([_permit_summary(p) for p in results])
                  finally:
                      db.close()


              @api.route("/permits/<int:permit_id>")
              def get_permit(permit_id):
                  auth_err = _check_authorization()
                  if auth_err:
                      return auth_err
                  db = SessionLocal()
                  try:
                      permit = db.query(Permit).filter(Permit.id == permit_id).first()
                      if not permit:
                          return jsonify(error="Vergunning niet gevonden"), 404
                      return jsonify(_permit_detail(permit))
                  finally:
                      db.close()


              @api.route("/permits/<int:permit_id>/approve", methods=["POST"])
              def approve_permit(permit_id):
                  auth_err = _check_authorization()
                  if auth_err:
                      return auth_err
                  user_id = request.headers.get("X-User-Id", "anonymous")
                  db = SessionLocal()
                  try:
                      permit = db.query(Permit).filter(Permit.id == permit_id).first()
                      if not permit:
                          return jsonify(error="Vergunning niet gevonden"), 404
                      body = request.get_json(silent=True) or {}
                      # Update velden uit de body (indien meegegeven)
                      for field in [
                          "permit_number", "applicant_name", "permit_holder_name", "issuer_name",
                          "location", "applicable_law", "work_type", "surface_water_type", "water_barrier_type",
                      ]:
                          if field in body:
                              setattr(permit, field, body[field])
                      if "issue_date" in body:
                          try:
                              permit.issue_date = date.fromisoformat(body["issue_date"])
                          except ValueError:
                              pass
                      if "validity_date" in body:
                          try:
                              permit.validity_date = date.fromisoformat(body["validity_date"])
                          except ValueError:
                              pass
                      # Bereken archiefinfo opnieuw
                      key = _resolve_selectielijst_key(
                          permit_type=getattr(permit, "permit_type", None),
                          permit_subtype=body.get("permit_subtype"),
                      )
                      if key:
                          nominatie, jaren, _ = _compute_archive_status(
                              key, permit.issue_date.isoformat() if permit.issue_date else None
                          )
                          permit.archive_nomination = nominatie
                          permit.retention_period_years = jaren
                      permit.status = "approved"
                      permit.ready_for_migration = True
                      permit.reviewed_at = datetime.now(timezone.utc)
                      permit.reviewed_by = user_id
                      db.commit()
                      _update_search_vector(db, permit.id)
                      _log_audit(db, user_id, "approve", f"Permit {permit_id} goedgekeurd")
                      return jsonify(_permit_detail(permit))
                  finally:
                      db.close()


              @api.route("/permits/<int:permit_id>/document")
              def download_document(permit_id):
                  auth_err = _check_authorization()
                  if auth_err:
                      return auth_err
                  db = SessionLocal()
                  try:
                      permit = db.query(Permit).filter(Permit.id == permit_id).first()
                      if not permit or not permit.document_path:
                          return jsonify(error="Document niet beschikbaar"), 404
                      path = Path(permit.document_path)
                      if not path.exists():
                          return jsonify(error="Bestand niet gevonden op server"), 404
                      return send_file(str(path), as_attachment=True, download_name=path.name)
                  finally:
                      db.close()

          - path: app/agent.py
            content: |
              """Vergunningzoeker agent -- agentic search over permits."""
              import json
              from druppie_sdk import DruppieClient
              from app.models import Permit

              druppie = DruppieClient()

              def run_agent(question: str, history: list[dict], db) -> dict:
                  steps = []
                  context_str = ""
                  if history:
                      recent = history[-4:]
                      context_str = "\n".join(
                          f"{'Gebruiker' if m['role']=='user' else 'Assistent'}: {m['content'][:200]}"
                          for m in recent
                      )
                  full_prompt = question
                  if context_str:
                      full_prompt = f"Gesprekscontext:\n{context_str}\n\nNieuwe vraag: {question}"
                  # Zoektermen genereren
                  query_result = druppie.call("llm", "chat", {
                      "prompt": (
                          "De gebruiker stelt een vraag over vergunningen. Genereer 1-3 zoektermen "
                          "(komma-gescheiden). Antwoord ALLEEN met de zoektermen.\n\nVraag: " + full_prompt
                      ),
                      "system": "Je genereert zoektermen. Antwoord met komma-gescheiden termen.",
                  })
                  terms = [t.strip() for t in query_result.get("answer", question).split(",") if t.strip()]
                  steps.append({"type": "search", "label": f"Zoektermen: {', '.join(terms)}", "detail": terms})

                  # Zoeken in DB
                  found = {}
                  for term in terms[:3]:
                      like = f"%{term}%"
                      results = db.query(Permit).filter(
                          Permit.permit_number.ilike(like) |
                          Permit.applicant_name.ilike(like) |
                          Permit.permit_holder_name.ilike(like) |
                          Permit.location.ilike(like) |
                          Permit.permit_type.ilike(like) |
                          Permit.applicable_law.ilike(like) |
                          Permit.work_type.ilike(like) |
                          Permit.ocr_text.ilike(like)
                      ).limit(10).all()
                      for p in results:
                          found[p.id] = p
                  steps.append({"type": "query", "label": f"{len(found)} vergunningen gevonden", "detail": None})

                  # Synthesize antwoord
                  if found:
                      parts = []
                      for p in found.values():
                          parts.append(f"Vergunning {p.id}: {p.permit_number or 'onbekend'}, aanvrager: {p.applicant_name}, type: {p.permit_type}")
                      context = "\n".join(parts)
                  else:
                      context = "Geen vergunningen gevonden."
                  answer_result = druppie.call("llm", "chat", {
                      "prompt": f"Beantwoord de vraag op basis van de data.\n\nVraag: {full_prompt}\n\nData:\n{context}",
                      "system": "Je bent een behulpzame assistent voor waterschapmedewerkers.",
                  })
                  return {"answer": answer_result.get("answer", "Geen antwoord."), "steps": steps}

          - path: app/config.py
            content: |
              import os


              class Settings:
                  app_name = "Vergunningzoeker"
                  database_url = os.environ.get(
                      "DATABASE_URL",
                      "postgresql://postgres:postgres@db:5432/vergunningen",
                  )
                  upload_dir = os.environ.get("UPLOAD_DIR", "/data/uploads")
                  secret_key = os.environ.get("SECRET_KEY", "dev-secret-key")


              settings = Settings()

          - path: app/__init__.py
            content: |
              import logging
              import os

              from flask import Flask, send_from_directory
              from app.routes import api

              logger = logging.getLogger(__name__)

              def create_app():
                  app = Flask(__name__, static_folder=None)
                  app.config["SECRET_KEY"] = os.environ.get("SECRET_KEY", "dev-secret-key")
                  app.register_blueprint(api, url_prefix="/api")

                  @app.route("/health")
                  def health():
                      return {"status": "ok"}

                  @app.before_first_request
                  def startup():
                      try:
                          from app.database import init_db
                          init_db()
                      except Exception as e:
                          logger.error("Database initialization failed: %s", e)

                  # Serve static frontend files
                  static_dir = os.path.join(os.path.dirname(os.path.dirname(__file__)), "static")

                  @app.route("/", defaults={"path": ""})
                  @app.route("/<path:path>")
                  def serve_spa(path):
                      if path and os.path.isfile(os.path.join(static_dir, path)):
                          return send_from_directory(static_dir, path)
                      return send_from_directory(static_dir, "index.html")

                  return app

              app = create_app()

          - path: app/database.py
            content: |
              import logging
              from sqlalchemy import create_engine, text
              from sqlalchemy.orm import sessionmaker, DeclarativeBase
              from app.config import settings

              logger = logging.getLogger(__name__)
              engine = create_engine(settings.database_url)
              SessionLocal = sessionmaker(bind=engine)


              class Base(DeclarativeBase):
                  pass


              def get_db():
                  db = SessionLocal()
                  try:
                      yield db
                  finally:
                      db.close()


              def init_db():
                  import app.models  # noqa: F401
                  with engine.connect() as conn:
                      try:
                          conn.execute(text("CREATE EXTENSION IF NOT EXISTS pg_trgm"))
                          conn.execute(text("CREATE EXTENSION IF NOT EXISTS unaccent"))
                      except Exception:
                          pass
                      Base.metadata.create_all(bind=engine)
                      try:
                          conn.execute(text("""
                              CREATE INDEX IF NOT EXISTS idx_permits_search_vector
                              ON permits USING GIN (search_vector)
                          """))
                          conn.commit()
                      except Exception as e:
                          logger.warning("Could not create GIN index: %s", e)

