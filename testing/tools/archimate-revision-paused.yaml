## Seeded session: a COMPLETE ArchiMate plate + TD already exist, paused on
## the architect's TD approval gate — ready to test the REVISION / feedback loop.
##
## Unlike archimate-e2e-paused-at-fd-approval (which builds the plate live with a
## real LLM, ~7 min), this seed INJECTS a finished plate + TD deterministically so
## you land straight on the TD approval with a plate to revise. Both files are
## written with coding:make_design (the architect IS allowed it; it writes content
## verbatim, only validating Mermaid — the .archimate XML has none).
##
## To test the revision loop:
##   1. Run archimate-revision-paused from the evaluations page -> green.
##   2. Log in as the session owner (admin). Go to /tasks.
##   3. Open the pending approval for docs/technical-design.md on session
##      "overlast-meldportaal" -> the embedded ArchiMate plate renders.
##   4. REJECT with feedback, e.g. "Voeg een element 'Audit-log'
##      (ApplicationComponent) toe en koppel het via Serving aan het
##      Overlast-meldportaal." Then resume the session.
##   5. Watch the architect apply ONLY that delta (add_to_view on the existing
##      view, not a rebuild). Reopen the TD: the new element is present
##      (highlighted), nothing you didn't ask for changed, tekenafspraken intact.
##
## Deterministic (no LLM up to the gate). Embed view id matches the injected
## architecture.archimate: id-22c5ae408afc4068aa82d09d65c58df2.

tool-test:
  name: archimate-revision-paused
  description: "Complete ArchiMate plate + TD injected, paused on the TD approval gate — for testing the revision/feedback loop"
  tags: [archimate, revision, paused, manual-followup, tekenafspraken]
  session_status: paused

  chain:
    - agent: router
      tool: builtin:set_intent
      arguments:
        intent: create_project
        project_name: overlast-meldportaal
        description: "Burger-portaal voor het melden van overlast aan het waterschap; meldingen landen in het zaaksysteem (DSP) en het juiste behandelteam wordt genotificeerd."
      assert:
        result:
          - not_empty

    - agent: router
      tool: builtin:done
      arguments:
        summary: "Agent router: Classified as create_project for overlast-meldportaal"

    - agent: planner
      tool: builtin:make_plan
      arguments:
        steps:
          - agent_id: architect
            prompt: "Produce the technical design with an ArchiMate plate"

    - agent: planner
      tool: builtin:done
      arguments:
        summary: "Agent planner: Planned architect to produce the technical design"

    # --- Inject the finished ArchiMate model (architect IS allowed make_design;
    #     it writes verbatim, Mermaid-validating only — the XML has none) ---
    - agent: architect
      tool: coding:make_design
      approval:
        status: approved
      arguments:
