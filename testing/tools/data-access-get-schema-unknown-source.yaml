## Tool Test: Data Access MCP - get_schema
## get_schema against a source_id that isn't configured must surface
## {success: false, error: ...} rather than raising.

tool-test:
  name: data-access-get-schema-unknown-source
  description: "get_schema against an unknown source returns {success: false, error}"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: dataaccess:get_schema
      arguments:
        source_id: "nonexistent-source"
        data_id: "some.table"
      assert:
        result:
          - json_parseable
          - {matches: "\"success\"\\s*:\\s*false"}
          - {contains: "error"}
