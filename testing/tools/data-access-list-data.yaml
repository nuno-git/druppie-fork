## Tool Test: Data Access MCP - List Data Unknown
## Tests error handling for unknown source

tool-test:
  name: data-access-list-data-unknown
  description: "List available data from unknown source returns error"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: data_access:list_available_data
      arguments:
        source_id: "nonexistent-source"
      assert:
        result:
          - json_parseable
          - {contains: "error"}