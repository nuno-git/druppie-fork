              F --> G[Verwijs naar preventieafdeling]
              G --> Z1[Einde]
              E -->|Ja| H[Formuleer advies met bronnen]
              H --> I{Bevat gevoelige data?}
              I -->|Ja| J[Scherm gevoelige info af]
              I -->|Nee| K[Toon volledig advies]
              J --> K
              K --> L[Sla gesprek op]
              L --> M[Gesprek in V&G-reviewqueue]
              M --> N[V&G beoordeelt gesprek]
              N --> O{Advies juist?}
              O -->|Ja| Z2[Einde]
              O -->|Nee| P[V&G stuurt correctie naar medewerker]
              P --> Z3[Einde]
