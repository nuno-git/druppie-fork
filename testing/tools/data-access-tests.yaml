## Tool Test: Data Access MCP - List Sources
## Tests the list_sources tool

tool-test:
  name: data-access-list-sources
  description: "List all configured data sources"
  tags: [data-access, mcp]

  chain:
    - agent: router
      tool: data_access:list_sources
      assert:
        result:
          - json_parseable
          - {contains: "sources"}
          - {contains: "count"}