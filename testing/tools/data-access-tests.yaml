## Tool Tests: Data Access MCP
## Tests all 6 data_access tools

tool-test:
  name: data-access-list-sources
  description: "List all configured data sources"
  tags: [data-access, mcp]

  chain:
    - agent: router
      tool: data_access:list_sources
      assert:
        result:
          - json_parseable
          - {contains: "sources"}
          - {contains: "count"}

tool-test:
  name: data-access-test-connection-unknown
  description: "Test connection to unknown source returns error"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: data_access:test_connection
      arguments:
        source_id: "nonexistent-source"
      assert:
        result:
          - json_parseable
          - {contains: "error"}

