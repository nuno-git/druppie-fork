## Tool Test: Data Access MCP - Test Connection Unknown
## Tests error handling for unknown source

tool-test:
  name: data-access-test-connection-unknown
  description: "Test connection to unknown source returns error"
  tags: [data-access, mcp, error-handling]

  chain:
    - agent: router
      tool: data_access:test_connection
      arguments:
        source_id: "nonexistent-source"
      assert:
        result:
          - json_parseable
          - {contains: "error"}