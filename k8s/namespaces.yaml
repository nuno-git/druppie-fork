apiVersion: v1
kind: Namespace
metadata:
  name: druppie-prod
  labels:
    app.kubernetes.io/part-of: druppie
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: druppie-prod-quota
  namespace: druppie-prod
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 48Gi
    persistentvolumeclaims: "20"
    pods: "50"
---
apiVersion: v1
kind: Namespace
metadata:
  name: druppie-colab-dev
  labels:
    app.kubernetes.io/part-of: druppie
    environment: development
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: druppie-colab-dev-quota
  namespace: druppie-colab-dev
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 24Gi
    persistentvolumeclaims: "15"
    pods: "30"
