apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-creds
  namespace: druppie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ci/harbor
        property: username
    - secretKey: password
      remoteRef:
        key: ci/harbor
        property: password
---
# Harbor admin password consumed by the Harbor chart via
# existingSecretAdminPassword (helm/harbor/values.yaml). The `harbor` namespace
# is declared here so this ExternalSecret applies before Harbor is installed.
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  # Short interval so the secret is present before Harbor is installed.
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-admin
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: ci/harbor
        property: password
