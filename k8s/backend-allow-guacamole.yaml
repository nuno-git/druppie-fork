---
# NetworkPolicy: allow backend pod to reach Guacamole in remote-access namespace
# The druppie-app-net egress policy blocks private IP ranges (10/8), which
# includes Guacamole's ClusterIP. This additive policy permits egress to
# pods labeled app=guacamole in the remote-access namespace on port 8080.
# Applied standalone: kubectl apply -f k8s/backend-allow-guacamole.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-guacamole
  namespace: druppie
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remote-access
          podSelector:
            matchLabels:
              app: guacamole
      ports:
        - protocol: TCP
          port: 8080
