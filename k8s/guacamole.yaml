apiVersion: v1
kind: Namespace
metadata:
  name: remote-access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guac-postgres
  namespace: remote-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guac-postgres
  template:
    metadata:
      labels:
        app: guac-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: guacamole_db
        - name: POSTGRES_USER
          value: guacamole_user
        - name: POSTGRES_PASSWORD
          value: guac_pass
        ports:
        - containerPort: 5432
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: guac-postgres
  namespace: remote-access
spec:
  selector:
    app: guac-postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: remote-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacd
  template:
    metadata:
      labels:
        app: guacd
    spec:
      containers:
      - name: guacd
        image: guacamole/guacd:1.5.5
        ports:
        - containerPort: 4822
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: remote-access
spec:
  selector:
    app: guacd
  ports:
  - port: 4822
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: remote-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      initContainers:
      - name: install-oidc
        image: guacamole/guacamole:1.5.5
        command:
        - sh
        - -c
        - |
          mkdir -p /guac-extensions/openid
          curl -sL "https://downloads.apache.org/guacamole/1.5.5/binary/guacamole-auth-sso-1.5.5.tar.gz" -o /tmp/sso.tar.gz
          tar xzf /tmp/sso.tar.gz -C /tmp/
          cp /tmp/guacamole-auth-sso-1.5.5/openid/guacamole-auth-sso-openid-1.5.5.jar /guac-extensions/openid/
        volumeMounts:
        - name: guac-extensions
          mountPath: /guac-extensions
      containers:
      - name: guacamole
        image: guacamole/guacamole:1.5.5
        env:
        - name: POSTGRESQL_HOSTNAME
          value: guac-postgres
        - name: POSTGRESQL_PORT
          value: "5432"
        - name: POSTGRESQL_DATABASE
          value: guacamole_db
        - name: POSTGRESQL_USER
          value: guacamole_user
        - name: POSTGRESQL_PASSWORD
          value: guac_pass
        - name: POSTGRESQL_AUTO_CREATE_ACCOUNTS
          value: "true"
        - name: GUACD_HOSTNAME
          value: guacd
        - name: GUACD_PORT
          value: "4822"
        - name: OPENID_AUTHORIZATION_ENDPOINT
          value: http://localhost:30002/realms/druppie/protocol/openid-connect/auth
        - name: OPENID_JWKS_ENDPOINT
          value: http://druppie-keycloak.druppie.svc.cluster.local:8080/realms/druppie/protocol/openid-connect/certs
        - name: OPENID_ISSUER
          value: http://localhost:30002/realms/druppie
        - name: OPENID_CLIENT_ID
          value: guacamole
        - name: OPENID_REDIRECT_URI
          value: http://localhost:30020/guacamole/
        - name: OPENID_USERNAME_CLAIM_TYPE
          value: preferred_username
        - name: OPENID_GROUPS_CLAIM_TYPE
          value: roles
        volumeMounts:
        - name: guac-extensions
          mountPath: /opt/guacamole/openid
          subPath: openid
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /guacamole/
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: guac-extensions
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: remote-access
spec:
  type: NodePort
  selector:
    app: guacamole
  ports:
  - port: 8080
    nodePort: 30020
