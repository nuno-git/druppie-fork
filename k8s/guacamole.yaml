apiVersion: v1
kind: Namespace
metadata:
  name: remote-access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guac-postgres
  namespace: remote-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guac-postgres
  template:
    metadata:
      labels:
        app: guac-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: guacamole_db
        - name: POSTGRES_USER
          value: guacamole_user
        - name: POSTGRES_PASSWORD
          value: guac_pass
        ports:
        - containerPort: 5432
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: guac-postgres
  namespace: remote-access
spec:
  selector:
    app: guac-postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: remote-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacd
  template:
    metadata:
      labels:
        app: guacd
    spec:
      containers:
      - name: guacd
        image: guacamole/guacd:1.5.5
        ports:
        - containerPort: 4822
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: remote-access
spec:
  selector:
    app: guacd
  ports:
  - port: 4822
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: remote-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      containers:
      - name: guacamole
        image: guacamole/guacamole:1.5.5
        env:
        - name: POSTGRESQL_HOSTNAME
          value: guac-postgres
        - name: POSTGRESQL_PORT
          value: "5432"
        - name: POSTGRESQL_DATABASE
          value: guacamole_db
        - name: POSTGRESQL_USER
          value: guacamole_user
        - name: POSTGRESQL_PASSWORD
          value: guac_pass
        - name: GUACD_HOSTNAME
          value: guacd
        - name: GUACD_PORT
          value: "4822"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /guacamole/
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: remote-access
spec:
  type: NodePort
  selector:
    app: guacamole
  ports:
  - port: 8080
    nodePort: 30020
