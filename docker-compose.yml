# Druppie Platform - Docker Compose Setup
# =========================================
#
# Profiles:
#   infra   - Infrastructure only (databases, Keycloak, Gitea, MCP servers)
#   dev     - Development mode with hot reload (backend + frontend with volume mounts)
#   prod    - Production mode (backend + frontend without hot reload)
#   init    - Initialization container (Keycloak + Gitea setup)
#
# Usage:
#   docker compose --profile infra --profile init up -d      # Infrastructure + init
#   docker compose --profile dev --profile init up -d        # Full dev environment
#   docker compose --profile prod --profile init up -d       # Full production
#   docker compose --profile reset-db run --rm reset-db      # Reset app database
#   docker compose --profile reset-hard run --rm reset-hard  # Full reset + re-init
#   docker compose --profile nuke run --rm nuke              # Full nuke & rebuild from scratch
#   docker compose down                                       # Stop everything
#
# Ports (base defaults, apply PORT_OFFSET via scripts/apply-port-offset.sh):
#   PostgreSQL:     5432
#   Keycloak:       8080
#   Gitea:          3000
#   Backend:        8000
#   Frontend:       5173
#   MCP Coding:     9001
#   MCP Docker:     9002
#   MCP File Search:9004
#   MCP Web:        9005
#   MCP Registry:   9007
#   MCP Vision:     9008
#   MCP LLM:        9009
#   MCP Data Access:9010
#   Adminer:        8081

services:
  # ===========================================================================
  # DATABASES
  # ===========================================================================

  druppie-db:
    image: postgres:15-alpine
    profiles: [infra, dev, prod, reset-db]
    environment:
      POSTGRES_DB: druppie
      POSTGRES_USER: druppie
      POSTGRES_PASSWORD: ${DRUPPIE_DB_PASSWORD:-druppie_secret}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "druppie"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DRUPPIE_DB_PORT:-5432}:5432"
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    profiles: [infra, dev, prod]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  keycloak-db:
    image: postgres:15-alpine
    profiles: [infra, dev, prod]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_secret}
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  gitea-db:
    image: postgres:15-alpine
    profiles: [infra, dev, prod]
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:-gitea_secret}
    volumes:
      - gitea_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gitea"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  # ===========================================================================
  # KEYCLOAK (Identity Provider)
  # ===========================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    profiles: [infra, dev, prod]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_secret}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${EXTERNAL_HOST:-localhost}
      # Port for frontend URL building. Required for direct dev access on :8180;
      # in prod behind a reverse proxy, X-Forwarded-Port takes precedence over this.
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:MaxGCPauseMillis=100 -Djava.net.preferIPv4Stack=true"
      KC_CACHE: local
      KC_CACHE_STACK: udp
    command: start-dev
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    mem_limit: 768m
    mem_reservation: 384m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - app-net

  # ===========================================================================
  # GITEA (Git Server)
  # ===========================================================================

  gitea:
    image: gitea/gitea:1.21
    profiles: [infra, dev, prod]
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea_secret}
      GITEA__server__ROOT_URL: ${GITEA_PUBLIC_URL:-http://${EXTERNAL_HOST:-localhost}:${GITEA_PORT:-3100}}
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__DOMAIN: ${EXTERNAL_HOST:-localhost}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: email
    volumes:
      - gitea_data:/data
    ports:
      - "${GITEA_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    depends_on:
      gitea-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-net

  # ===========================================================================
  # MCP SERVERS (Microservices)
  # ===========================================================================

  module-coding:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-coding/Dockerfile
    profiles: [infra, dev, prod]
    environment:
      WORKSPACE_ROOT: /workspaces
      MCP_PORT: "9001"
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_ORG: druppie
      GITEA_USER: ${GITEA_ADMIN_USER:-gitea_admin}
      GITEA_PASSWORD: ${GITEA_ADMIN_PASSWORD:-GiteaAdmin123}
      GITEA_TOKEN: ${GITEA_ADMIN_TOKEN:-}
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-druppie-internal-secret-key}
      # Sandbox container management
      DRUPPIE_SANDBOX_RUNTIME: ${DRUPPIE_SANDBOX_RUNTIME:-sysbox-runc}
      DRUPPIE_SANDBOX_CACHE_VOLUME: ${DRUPPIE_INSTANCE:-druppie}_sandbox_dep_cache
      DRUPPIE_SANDBOX_USER: ${DRUPPIE_SANDBOX_USER:-druppie}
      DRUPPIE_SANDBOX_IMAGE: ${DRUPPIE_SANDBOX_IMAGE:-druppie-sandbox:latest}
      DRUPPIE_SANDBOX_NETWORK: ${DRUPPIE_INSTANCE:-druppie}-sandbox-net
      DRUPPIE_SANDBOX_INET_NETWORK: ${DRUPPIE_INSTANCE:-druppie}-sandbox-inet
      DRUPPIE_SANDBOX_MODULES_NETWORK: ${DRUPPIE_INSTANCE:-druppie}-sandbox-modules
      DRUPPIE_DOCKER_MEMORY_LIMIT: ${DRUPPIE_SANDBOX_MEMORY_LIMIT:-12g}
      DRUPPIE_DOCKER_CPU_LIMIT: ${DRUPPIE_SANDBOX_CPU_LIMIT:-4}
      # Core repo config (for update_core git scope)
      DRUPPIE_CORE_REPO_URL: ${DRUPPIE_CORE_REPO_URL:-}
      DRUPPIE_CORE_REPO_BRANCH: ${DRUPPIE_CORE_REPO_BRANCH:-colab-dev}
      # GitHub App (for cloning/authenticating against private GitHub repos)
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - workspace:/workspaces
      - ./secrets:/app/secrets:ro
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    ports:
      - "${MCP_CODING_PORT:-9001}:9001"
    depends_on:
      gitea:
        condition: service_healthy
      sandbox-image-builder:
        condition: service_completed_successfully
    networks:
      - app-net
      - sandbox-net
      - sandbox-inet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sandbox-image-builder:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-coding/Dockerfile.sandbox
    image: ${DRUPPIE_SANDBOX_IMAGE:-druppie-sandbox:latest}
    profiles: [infra, dev, prod]
    command: ["echo", "Sandbox base image built successfully"]

  module-docker:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-docker/Dockerfile
    container_name: druppie-module-docker
    profiles: [infra, dev, prod]
    environment:
      MCP_PORT: "9002"
      WORKSPACE_ROOT: /workspaces
      DOCKER_NETWORK: ${DRUPPIE_INSTANCE:-druppie}-network
      DRUPPIE_URL: ${DRUPPIE_URL:-http://backend:8000}
      DRUPPIE_MODULE_API_TOKEN: ${DRUPPIE_MODULE_API_TOKEN:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
    volumes:
      - workspace:/workspaces
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - ./druppie/sdk:/druppie-sdk:ro
    ports:
      - "${MCP_DOCKER_PORT:-9002}:9002"
    networks:
      - app-net
      - sandbox-modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-filesearch:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-filesearch/Dockerfile
    profiles: [infra, dev, prod]
    environment:
      SEARCH_ROOT: /dataset
      MCP_PORT: "9004"
    volumes:
      - dataset:/dataset
    ports:
      - "${MCP_FILESEARCH_PORT:-9004}:9004"
    networks:
      - app-net
      - sandbox-modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-archimate:
    build:
      # Context is ./druppie (not mcp-servers) because the Dockerfile COPYs
      # mcp-servers/-prefixed paths including the models/ directory.
      context: ./druppie
      dockerfile: mcp-servers/module-archimate/Dockerfile
    profiles: [infra, dev, prod]
    environment:
      MODELS_DIR: /models
      WORKSPACE_ROOT: /workspaces
      MCP_PORT: "9006"
      LAYOUT_SERVICE_URL: ${LAYOUT_SERVICE_URL:-http://layout-service:8090}
    volumes:
      - ./druppie/mcp-servers/module-archimate/models:/models:ro
      - workspace:/workspaces
    ports:
      - "${MCP_ARCHIMATE_PORT:-9006}:9006"
    networks:
      - app-net
      - sandbox-modules
    depends_on:
      layout-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  layout-service:
    build:
      context: ./druppie/mcp-servers/layout-service
      dockerfile: Dockerfile
    container_name: druppie-layout-service
    profiles: [infra, dev, prod]
    environment:
      PORT: "8090"
    ports:
      - "${LAYOUT_SERVICE_PORT:-8090}:8090"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-web:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-web/Dockerfile
    profiles: [infra, dev, prod]
    environment:
      SEARCH_ROOT: /dataset
      MCP_PORT: "9005"
    volumes:
      - dataset:/dataset
    ports:
      - "${MCP_WEB_PORT:-9005}:9005"
    networks:
      - app-net
      - sandbox-modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-registry:
    build:
      # Context is ./druppie (not mcp-servers) because the Dockerfile COPYs
      # agents/, core/, and skills/ which live outside mcp-servers/.
      context: ./druppie
      dockerfile: mcp-servers/module-registry/Dockerfile
    profiles: [infra, dev, prod]
    environment:
      DATA_DIR: /data
      MCP_PORT: "9007"
    volumes:
      - ./druppie/agents/definitions:/data/agents:ro
      - ./druppie/core/mcp_config.yaml:/data/mcp_config.yaml:ro
      - ./druppie/skills:/data/skills:ro
      - ./druppie/agents/builtin_tools.py:/data/builtin_tools.py:ro
      - ./druppie/mcp-servers:/data/mcp-servers:ro
    ports:
      - "${MCP_REGISTRY_PORT:-9007}:9007"
    networks:
      - app-net
      - sandbox-modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-llm:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-llm/Dockerfile
    profiles: [infra, dev, prod]
    environment:
      MCP_PORT: "9008"
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-}
      ZAI_MODEL: ${ZAI_MODEL:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_API_VERSION: ${EMBEDDING_API_VERSION:-}
    ports:
      - "${MCP_LLM_PORT:-9009}:9008"
    networks:
      - app-net
      - sandbox-modules
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9008/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-vision:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-vision/Dockerfile
    profiles: [infra, dev, prod]
    environment:
      MCP_PORT: "9011"
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-}
      ZAI_VISION_MODEL: ${ZAI_VISION_MODEL:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
    ports:
      - "${MCP_VISION_PORT:-9008}:9011"
    networks:
      - app-net
      - sandbox-modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9011/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-data-access:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-data-access/Dockerfile
    container_name: druppie-module-data-access
    profiles: [infra, dev, prod]
    environment:
      MCP_PORT: "9010"
      WORKSPACE_ROOT: /workspaces
      DATA_SOURCE_1: ${DATA_SOURCE_1:-}
      DATA_SOURCE_2: ${DATA_SOURCE_2:-}
      DATA_SOURCE_3: ${DATA_SOURCE_3:-}
      DATA_SOURCE_4: ${DATA_SOURCE_4:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
    volumes:
      - workspace:/workspaces
    ports:
      - "${MCP_DATA_ACCESS_PORT:-9010}:9010"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-azuredevops:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-azuredevops/Dockerfile
    container_name: druppie-module-azuredevops
    # Opt-in profile: this module needs Azure DevOps credentials and crashes at
    # startup when they are unset, so it is NOT part of the default dev/infra/prod
    # stack. Start it alongside the app once AZURE_DEVOPS_* are set in .env, e.g.:
    #   docker compose --profile dev --profile azuredevops up -d
    profiles: [azuredevops]
    environment:
      MCP_PORT: "9012"
      # Read-only access is hard-scoped to this single project (see module).
      AZURE_DEVOPS_ORG_URL: ${AZURE_DEVOPS_ORG_URL:-}
      AZURE_DEVOPS_PROJECT: ${AZURE_DEVOPS_PROJECT:-}
      AZURE_DEVOPS_TENANT_ID: ${AZURE_DEVOPS_TENANT_ID:-}
      AZURE_DEVOPS_CLIENT_ID: ${AZURE_DEVOPS_CLIENT_ID:-}
      AZURE_DEVOPS_CLIENT_SECRET: ${AZURE_DEVOPS_CLIENT_SECRET:-}
    ports:
      - "${MCP_AZUREDEVOPS_PORT:-9012}:9012"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9012/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  module-kubernetes:
    build:
      context: ./druppie/mcp-servers
      dockerfile: module-kubernetes/Dockerfile
    container_name: druppie-module-kubernetes
    # Opt-in profile: this module needs a reachable cluster and the external
    # `kind` network, so it is NOT part of the default dev/infra/prod stack.
    # Start it alongside the app, e.g.:
    #   docker compose --profile dev --profile kubernetes up -d
    profiles: [kubernetes]
    environment:
      MCP_PORT: "9013"
    volumes:
      # Read-only kubeconfig for local dev (Helm uses in-cluster config instead).
      # kind's standard kubeconfig points the API server at 127.0.0.1, which is
      # the container's own loopback. Use the --internal kubeconfig instead — it
      # targets the control-plane container over the `kind` network below:
      #   kind get kubeconfig --name druppie --internal > ~/.kube/druppie-mcp.yaml
      - ${HOME}/.kube/druppie-mcp.yaml:/root/.kube/config:ro
    ports:
      - "${MCP_KUBERNETES_PORT:-9013}:9013"
    networks:
      - app-net
      - kind
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9013/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # DATABASE ADMIN

  adminer:
    image: adminer:latest
    profiles: [infra, dev, prod]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: druppie-db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      druppie-db:
        condition: service_healthy
    networks:
      - app-net

  docs-validator:
    image: python:3.11-slim
    profiles: [docs-validator]
    working_dir: /repo
    volumes:
      - .:/repo:ro
    entrypoint: ["sh", "-c"]
    command: ["pip install --quiet --root-user-action=ignore -r scripts/requirements-docs.txt && python scripts/validate_docs.py"]

  # ===========================================================================
  # OAUTH2 PROXY (authentication gatekeeper)
  # ===========================================================================
  # Sits in front of the app via nginx auth_request.
  # Redirects unauthenticated users to Keycloak login.
  # Works in all browsers (no Basic Auth popup dependency).

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    # Production auth gate (sits behind nginx). Not used in dev/infra, where the backend
    # is reached directly — including it there only restart-loops on missing secrets.
    profiles: [prod]
    environment:
      DRUPPIE_DOMAIN: ${DRUPPIE_DOMAIN:-localhost}
    command:
      - --provider=keycloak-oidc
      - --skip-oidc-discovery=true
      - --login-url=${PUBLIC_SCHEME:-https}://${DRUPPIE_DOMAIN:-localhost}/realms/druppie-gate/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/druppie-gate/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/druppie-gate/protocol/openid-connect/certs
      - --profile-url=
      - --oidc-issuer-url=${PUBLIC_SCHEME:-https}://${DRUPPIE_DOMAIN:-localhost}/realms/druppie-gate
      - --insecure-oidc-skip-issuer-verification=true
      - --client-id=druppie-proxy
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      # Defaults to .${DRUPPIE_DOMAIN}, but when Gitea lives on a sibling subdomain
      # (e.g. druppie.example.com + git.example.com) set OAUTH2_PROXY_COOKIE_DOMAIN
      # to the shared base (.example.com) so the gate cookie covers both.
      - --cookie-domain=${OAUTH2_PROXY_COOKIE_DOMAIN:-.${DRUPPIE_DOMAIN:-localhost}}
      - --cookie-secure=${OAUTH2_PROXY_COOKIE_SECURE:-true}
      - --cookie-samesite=lax
      - --redirect-url=${PUBLIC_SCHEME:-https}://${DRUPPIE_DOMAIN:-localhost}/oauth2/callback
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email=true
      - --skip-provider-button=true
      - --upstream=static://200
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --whitelist-domain=${OAUTH2_PROXY_WHITELIST_DOMAIN:-.${DRUPPIE_DOMAIN:-localhost}}
      - --allowed-role=platform-access
      - --oidc-groups-claim=realm_access.roles
      - --session-cookie-minimal=true
    ports:
      - "127.0.0.1:4180:4180"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:4180/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # INITIALIZATION CONTAINER (one-time setup)
  # ===========================================================================
  # Runs setup_keycloak.py and setup_gitea.py on first launch.
  # Uses init-marker volume to track if setup was already completed.
  # Exits after completion - does not stay running.

  druppie-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    profiles: [init, dev, prod]
    environment:
      # Keycloak config (internal Docker URLs)
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      EXTERNAL_HOST: ${EXTERNAL_HOST:-localhost}
      # Port configuration (passed to setup scripts for Keycloak client URIs)
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8080}
      GITEA_PORT: ${GITEA_PORT:-3000}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      # Gitea config (internal Docker URLs)
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-gitea_admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-GiteaAdmin123}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-admin@druppie.local}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: druppie
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      # Container name derived from COMPOSE_PROJECT_NAME (Docker Compose naming: <project>-<service>-1)
      GITEA_CONTAINER: ${COMPOSE_PROJECT_NAME:-druppie}-gitea-1
      # Entra ID identity broker (optional — skipped if ENTRA_CLIENT_ID is empty)
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      # Override .env path for setup_gitea.py token writing
      ENV_FILE: /project/.env
    volumes:
      - init_marker:/init-marker
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - .:/project
    depends_on:
      keycloak:
        condition: service_healthy
      gitea:
        condition: service_healthy
    networks:
      - app-net
    restart: "no"

  # ===========================================================================
  # BACKEND - Development Mode (hot reload)
  # ===========================================================================

  druppie-backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [dev]
    command: ["uvicorn", "druppie.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "druppie", "--reload-dir", "testing"]
    environment:
      DATABASE_URL: postgresql://druppie:${DRUPPIE_DB_PASSWORD:-druppie_secret}@druppie-db:5432/druppie
      DB_POOL_SIZE: ${DB_POOL_SIZE:-30}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-50}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-60}
      DEV_MODE: ${DEV_MODE:-false}
      KEYCLOAK_URL: http://${EXTERNAL_HOST:-localhost}:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: http://${EXTERNAL_HOST:-localhost}:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_REALM: druppie
      KEYCLOAK_CLIENT_ID: druppie-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_ALLOWED_EMAILS: ${ENTRA_ALLOWED_EMAILS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-zai}
      LLM_FORCE_PROVIDER: ${LLM_FORCE_PROVIDER:-}
      LLM_FORCE_MODEL: ${LLM_FORCE_MODEL:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.7}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      DEEPINFRA_MODEL: ${DEEPINFRA_MODEL:-Qwen/Qwen3-32B}
      DEEPINFRA_BASE_URL: ${DEEPINFRA_BASE_URL:-https://api.deepinfra.com/v1}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY:-}
      FOUNDRY_MODEL: ${FOUNDRY_MODEL:-GPT-5-MINI}
      FOUNDRY_API_URL: ${FOUNDRY_API_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-3-27b-it}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-}
      CORS_ORIGINS: http://${EXTERNAL_HOST:-localhost}:${FRONTEND_PORT:-5173},http://localhost:5173
      GITEA_URL: http://${EXTERNAL_HOST:-localhost}:${GITEA_PORT:-3000}
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-gitea_admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-GiteaAdmin123}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-admin@druppie.local}
      GITEA_ORG: druppie
      WORKSPACE_PATH: /app/workspace
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-druppie-internal-secret-key}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
