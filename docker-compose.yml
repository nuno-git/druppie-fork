    depends_on:
      druppie-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gitea:
        condition: service_healthy
    networks:
      app-net:
        aliases:
          - backend
      sandbox-modules:
        aliases:
          - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # FRONTEND - Development Mode (Vite HMR)
  # ===========================================================================

  druppie-frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    profiles: [dev]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://${EXTERNAL_HOST:-localhost}:${BACKEND_PORT:-8000}
      VITE_KEYCLOAK_URL: http://${EXTERNAL_HOST:-localhost}:${KEYCLOAK_PORT:-8080}
      VITE_KEYCLOAK_REALM: druppie
      VITE_KEYCLOAK_CLIENT_ID: druppie-frontend
    depends_on:
      druppie-backend-dev:
        condition: service_healthy
    networks:
      - app-net

  # ===========================================================================
  # FRONTEND - Production Mode
  # ===========================================================================

  druppie-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_PUBLIC_URL:-http://${EXTERNAL_HOST:-localhost}:${BACKEND_PORT:-8100}}
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://${EXTERNAL_HOST:-localhost}:${KEYCLOAK_PORT:-8180}}
        VITE_KEYCLOAK_REALM: druppie
        VITE_KEYCLOAK_CLIENT_ID: druppie-frontend
        VITE_GITEA_URL: ${GITEA_PUBLIC_URL:-http://${EXTERNAL_HOST:-localhost}:${GITEA_PORT:-3100}}
    profiles: [prod]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      druppie-backend:
        condition: service_healthy
    networks:
      - app-net

  # ===========================================================================
  # RESET SERVICES
  # ===========================================================================

  # Reset application database only (preserves Keycloak, Gitea, and user accounts)
  # Drops: projects, sessions, agent_runs, messages, tool_calls, llm_calls, approvals, questions
  # Keeps: users, user_roles, user_tokens (synced from Keycloak)
  reset-db:
    image: docker:cli
    profiles: [reset-db]
    environment:
      PGPASSWORD: ${DRUPPIE_DB_PASSWORD:-druppie_secret}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-druppie}
    volumes:
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    entrypoint: ["sh", "-c"]
    command:
      - |
        # Docker Compose auto-names containers as <COMPOSE_PROJECT_NAME>-<service>-<ordinal>
        # NOTE: $$ escapes the dollar so Compose passes a literal $ to the shell;
        # a single $ would be interpolated (to empty) by Compose before the shell runs.
        DB_CONTAINER="$${COMPOSE_PROJECT_NAME}-druppie-db-1"
        # Backend service differs between prod (druppie-backend) and dev (druppie-backend-dev) profiles.
        BACKEND_CONTAINER="$${COMPOSE_PROJECT_NAME}-druppie-backend-1"
        BACKEND_CONTAINER_DEV="$${COMPOSE_PROJECT_NAME}-druppie-backend-dev-1"
        echo "=== Resetting Druppie Application Database ==="
        echo "Preserving user tables (users, user_roles, user_tokens)"
        echo "DB container: $$DB_CONTAINER"
        echo ""
        echo "Waiting for database..."
        until docker exec "$$DB_CONTAINER" pg_isready -U druppie; do sleep 1; done
        echo "Dropping application tables..."
        docker exec "$$DB_CONTAINER" psql -U druppie -d druppie -c "
          DROP TABLE IF EXISTS sandbox_sessions CASCADE;
          DROP TABLE IF EXISTS tool_call_normalizations CASCADE;
          DROP TABLE IF EXISTS llm_retries CASCADE;
          DROP TABLE IF EXISTS questions CASCADE;
          DROP TABLE IF EXISTS approvals CASCADE;
          DROP TABLE IF EXISTS llm_calls CASCADE;
          DROP TABLE IF EXISTS tool_calls CASCADE;
          DROP TABLE IF EXISTS messages CASCADE;
          DROP TABLE IF EXISTS agent_runs CASCADE;
          DROP TABLE IF EXISTS job_runs CASCADE;
          DROP TABLE IF EXISTS job_definitions CASCADE;
          DROP TABLE IF EXISTS sessions CASCADE;
          DROP TABLE IF EXISTS projects CASCADE;
        "
        echo ""
        echo "Restarting backend to recreate tables..."
        docker restart "$$BACKEND_CONTAINER" 2>/dev/null \
          || docker restart "$$BACKEND_CONTAINER_DEV" 2>/dev/null \
          || echo "Backend not running"
        echo ""
        echo "=== Database reset complete ==="
        echo "Application tables dropped. User accounts preserved."
        echo "Backend restarted - tables will be recreated automatically."
    networks:
      - app-net

  # Full reset - removes ALL volumes and re-initializes
  # NOTE: This service runs with network_mode: host to avoid being stopped by docker compose down
  reset-hard:
    build:
      context: .
      dockerfile: Dockerfile.reset
    profiles: [reset-hard]
    network_mode: host
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-druppie}
      # Host project directory for Docker volume mount resolution (required for rootless Docker)
      HOST_PROJECT_DIR: ${PWD}
      # Init container env vars for re-initialization (use localhost since we're on host network)
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      EXTERNAL_HOST: ${EXTERNAL_HOST:-localhost}
      # Port configuration
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8080}
      GITEA_PORT: ${GITEA_PORT:-3000}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      GITEA_URL: http://localhost:${GITEA_PORT:-3000}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-gitea_admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-GiteaAdmin123}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-admin@druppie.local}
      KEYCLOAK_INTERNAL_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_REALM: druppie
      ENV_FILE: /project/.env
    volumes:
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - .:/project

  # Full nuke & rebuild - destroys EVERYTHING (containers, volumes, images) and rebuilds from scratch
  # Usage: docker compose --profile nuke run --rm nuke
  # Stop only: START_AFTER=false docker compose --profile nuke run --rm nuke
  nuke:
    build:
      context: .
      dockerfile: Dockerfile.reset
    profiles: [nuke]
    network_mode: host
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-druppie}
      START_AFTER: ${START_AFTER:-true}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8080}
      GITEA_PORT: ${GITEA_PORT:-3000}
    volumes:
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - .:/project
    entrypoint: ["/app/scripts/nuke.sh"]

  # Emergency purge of the shared sandbox dependency cache
  # Usage: docker compose --profile reset-cache run --rm reset-cache
  # With reason: PURGE_REASON="suspected compromise" docker compose --profile reset-cache run --rm reset-cache
  reset-cache:
    image: docker:cli
    profiles: [reset-cache]
    environment:
      DRUPPIE_INSTANCE: ${DRUPPIE_INSTANCE:-druppie}
    entrypoint: ["sh", "-c"]
    command:
      - |
        # NOTE: $$ escapes the dollar so Compose passes a literal $ to the shell.
        # ${PURGE_REASON:-manual} is intentionally left single-$ so Compose
        # interpolates it from the host env (see usage note above).
        CACHE_VOLUME="$${DRUPPIE_INSTANCE}_sandbox_dep_cache"
        echo "=== Emergency Cache Purge ==="
        echo "Timestamp: $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "Reason: ${PURGE_REASON:-manual}"
        echo "Cache volume: $$CACHE_VOLUME"
        echo ""
        echo "Step 1: Stopping running sandbox containers..."
        sandbox_ids=$$(docker ps --filter "network=$${DRUPPIE_INSTANCE}-sandbox-net" -q)
        if [ -n "$$sandbox_ids" ]; then
          echo "  Stopping sandbox(es)..."
          if ! docker stop -t 5 $$sandbox_ids 2>/dev/null; then
            echo "  WARNING: Graceful stop failed, forcing..."
            docker kill $$sandbox_ids 2>/dev/null || true
          fi
          docker rm -f $$sandbox_ids 2>/dev/null || true
          echo "  Stopped."
        else
          echo "  None running."
        fi
        echo ""
        echo "Step 2: Removing cache volume..."
        if docker volume inspect "$$CACHE_VOLUME" >/dev/null 2>&1; then
          if ! docker volume rm "$$CACHE_VOLUME"; then
            echo "  ERROR: Failed to remove volume. Is it still in use?"
            echo "  Check: docker ps --filter volume=$$CACHE_VOLUME"
            exit 1
          fi
          echo "  Removed."
        else
          echo "  Volume does not exist (already removed)."
        fi
        echo ""
        echo "Step 3: Recreating empty volume..."
        docker volume create "$$CACHE_VOLUME"
        if ! docker volume inspect "$$CACHE_VOLUME" >/dev/null 2>&1; then
          echo "  ERROR: Volume creation failed."
          exit 1
        fi
        echo "  Created."
        echo ""
        echo "=== Purge Complete ==="
    volumes:
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false

  # cache-scanner: removed with background-agents (TODO: rebuild inside druppie/sandbox)

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres:
    name: ${DRUPPIE_INSTANCE:-druppie}_postgres
  keycloak_postgres:
    name: ${DRUPPIE_INSTANCE:-druppie}_keycloak_postgres
  gitea_postgres:
    name: ${DRUPPIE_INSTANCE:-druppie}_gitea_postgres
  gitea_data:
    name: ${DRUPPIE_INSTANCE:-druppie}_gitea_data
  workspace:
    name: ${DRUPPIE_INSTANCE:-druppie}_workspace
  dataset:
    name: ${DRUPPIE_INSTANCE:-druppie}_dataset
  init_marker:
    name: ${DRUPPIE_INSTANCE:-druppie}_init_marker
  redis_data:
    name: ${DRUPPIE_INSTANCE:-druppie}_redis_data
  sandbox_dep_cache:
    name: ${DRUPPIE_INSTANCE:-druppie}_sandbox_dep_cache
  sandbox_bundles:
    name: ${DRUPPIE_INSTANCE:-druppie}_sandbox_bundles

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  app-net:
    name: ${DRUPPIE_INSTANCE:-druppie}-network
    driver: bridge
  # Created by `kind`; the kubernetes module joins it to reach the cluster's
  # control-plane container. Only required by the opt-in `kubernetes` profile.
  kind:
    name: kind
    external: true
  sandbox-net:
    name: ${DRUPPIE_INSTANCE:-druppie}-sandbox-net
    driver: bridge
    internal: true
  sandbox-inet:
    name: ${DRUPPIE_INSTANCE:-druppie}-sandbox-inet
    driver: bridge
  sandbox-modules:
    name: ${DRUPPIE_INSTANCE:-druppie}-sandbox-modules
    driver: bridge
    internal: true
